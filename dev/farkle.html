<title>Monster Farkle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Germania+One&family=Oswald:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Monster Farkle. Six dice on a tavern table. The turn's total is the blow you
   are winding up: strike and the monster takes it, farkle and it hits you.

   Colors, type and shapes come from BRAND.md: soot black and dark leather,
   gold headlines, crimson for the monster, green for you, teal for magic,
   3px black borders with hard offset shadows, and no emoji anywhere a player
   can see. Germania One for titles, Oswald for numbers and buttons,
   Alegreya Sans for anything you actually read. */
:root{
  --soot:#14100d; --leather:#1b1410; --wood:#241913; --wood-2:#33241b; --wood-3:#433025; --line:#5d4434;
  --parch:#f3e6c8; --parch-dim:#c7b28c;
  --gold:#f2b632; --gold-hi:#ffd35c;
  --hp:#c8241f; --heal:#3fae4a; --heal-hi:#7be38a; --teal:#7fe3d8; --boss:#a63de0;
  --steel:#76a9db; --ink:#16100d;
  --bubble:#f3e6c8; --bubble-ink:#16100d;
  --f-title:'Germania One','Palatino Linotype',Georgia,serif;
  --f-num:'Oswald','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Alegreya Sans','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0;background:var(--soot);
  background-image:repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 2px, transparent 2px 46px),
                   radial-gradient(ellipse at 50% 0%, rgba(242,182,50,.12), transparent 60%);
  color:var(--parch);font-family:var(--f-body);font-size:16px;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;
}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
img{max-width:100%}
[hidden]{display:none!important}

#app{
  max-width:880px;margin:0 auto;height:100%;min-height:0;
  padding-left:max(14px, env(safe-area-inset-left, 0px));
  padding-right:max(14px, env(safe-area-inset-right, 0px));
  padding-block:8px 10px;display:flex;flex-direction:column;gap:7px;
}
#app.shake{animation:shake .38s}
@keyframes shake{20%{transform:translate(-7px,2px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,-1px)}}

/* ---------- the bar across the top ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-title);font-size:1.45rem;line-height:1;color:var(--gold)}
.brand img{flex:none;width:30px;height:30px;border-radius:7px;border:2px solid #000;box-shadow:2px 2px 0 #000}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tool{background:var(--leather);border:2px solid #000;box-shadow:2px 2px 0 #000;border-radius:999px;
  padding:6px 11px;min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--f-num);font-weight:600;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase}

/* ---------- the monster ---------- */
/* The monster takes whatever is left over and no more. It is the only part
   that stretches, so flex alone sizes it: everything else is flex:none at its
   own height, and the stage gets the remainder. A max-height here looked
   sensible and was not - it capped the monster on a tall phone and left a dead
   band under the buttons where the leftover had nowhere to go. */
.stage{position:relative;flex:1 1 auto;min-height:104px;
  border-radius:14px;overflow:hidden;border:3px solid #000;box-shadow:4px 4px 0 #000;
  display:flex;flex-direction:column;
  background:linear-gradient(rgba(10,5,3,.55), rgba(10,5,3,.05) 38%, rgba(10,5,3,.05) 70%, rgba(10,5,3,.6)),
             var(--bgimg) center/cover no-repeat, linear-gradient(#3e2617,#170d07)}
.stage-top{padding:9px 42px 0 11px;display:flex;flex-direction:column;gap:5px;z-index:2}
.foe-title{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.foe-name{font-family:var(--f-title);font-size:1.3rem;line-height:1.1;text-shadow:0 2px 0 rgba(0,0,0,.7)}
.foe-rule{font-family:var(--f-num);font-weight:600;font-size:.8rem;letter-spacing:.03em;color:#ffb7a3;text-shadow:0 1px 0 rgba(0,0,0,.6)}
.foe-pic{flex:1;min-height:0;display:grid;place-items:center;z-index:1;filter:drop-shadow(0 14px 18px rgba(0,0,0,.65));
  animation:breathe 3.2s ease-in-out infinite}
.foe-pic img{display:block;height:clamp(84px,22vh,250px);max-width:76%;object-fit:contain}
@keyframes breathe{50%{transform:scale(1.04) translateY(-5px)}}
.foe-pic.hit{animation:foeHit .42s}
@keyframes foeHit{0%{filter:brightness(2.4) saturate(0)}30%{transform:translateX(-14px) rotate(-7deg)}60%{transform:translateX(10px) rotate(5deg)}}

/* The monster's standing clip. object-position sits high on purpose: the clips
   are 16:9 and this stage is a short wide band, so cover trims the sides and
   the head stays in frame. Never crop a head. */
.foe-vidwrap{position:absolute;inset:0;overflow:hidden;z-index:0;opacity:0;transition:opacity .4s;pointer-events:none}
.stage.hasvid .foe-vidwrap{opacity:1}
.stage.hasvid .foe-pic{visibility:hidden}
.foe-vidwrap::before{content:"";position:absolute;inset:-20px;background:var(--bgimg) center/cover;filter:blur(15px) brightness(.5)}
.foe-vidwrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 38%;
  filter:contrast(1.06) saturate(1.06)}
.foe-vidwrap video.atk{opacity:0;transition:opacity .22s ease}
.foe-vidwrap video.atk.on{opacity:1}
.foe-vidwrap.hit{animation:vidHit .42s}
@keyframes vidHit{0%{filter:brightness(2.6) saturate(0)}35%{transform:translateX(-12px)}70%{transform:translateX(9px)}}
.foe-vidwrap.healglow{animation:vidHeal 1.1s}
@keyframes vidHeal{40%{filter:brightness(1.3) sepia(.5) hue-rotate(60deg)}}
.foe-vidwrap.shieldglow{animation:vidShield 1.1s}
@keyframes vidShield{40%{filter:brightness(1.25) sepia(.6) hue-rotate(175deg)}}

/* the level badge and how dangerous this one is */
.lvtag{display:inline-flex;align-items:center;gap:4px;border:2px solid #000;border-radius:999px;padding:2px 9px;
  font-family:var(--f-num);font-weight:700;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;
  background:var(--wood-3);color:var(--parch);box-shadow:2px 2px 0 #000}
.lvtag.easy{background:#2c5230;color:#cfeccf} .lvtag.even{background:#4a3a1c;color:#ffe3a6}
.lvtag.hard{background:#5e2a1e;color:#ffd0c2} .lvtag.boss{background:var(--boss);color:#fff}
.vbar{position:absolute;right:11px;top:11px;bottom:11px;width:17px;border-radius:999px;
  background:rgba(0,0,0,.45);border:2px solid #000;overflow:hidden;z-index:2}
.vbar i{position:absolute;left:0;right:0;bottom:0;height:100%;background:linear-gradient(0deg,#8e1a16,var(--hp) 70%,#ff7a6a);transition:height .45s ease}
.vbar span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:.9rem;
  color:#fff;text-shadow:1px 1px 0 #000,0 0 4px #000;line-height:1;z-index:1}
.stage-foot{position:absolute;left:10px;right:40px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
/* The shout sits high and the damage number comes out of the middle. They were
   both near the centre and landed on each other on a big hit. */
.banner{position:absolute;left:16px;right:16px;top:20%;text-align:center;font-family:var(--f-title);
  font-size:clamp(1.9rem,8.5vw,3rem);color:var(--gold);text-shadow:0 3px 0 #000,0 0 18px rgba(0,0,0,.85);
  opacity:0;pointer-events:none;z-index:3;text-transform:uppercase;line-height:1.05}
.banner small{display:block;font-family:var(--f-num);font-weight:600;font-size:.42em;letter-spacing:.06em;color:var(--parch)}
.banner.show{animation:bannerIn 1.4s ease forwards}
@keyframes bannerIn{0%{opacity:0;transform:scale(.55)}18%{opacity:1;transform:scale(1.06)}72%{opacity:1;transform:scale(1)}100%{opacity:0}}

/* ---------- you ---------- */
.hero{display:flex;align-items:center;gap:9px;flex:none;
  background:var(--leather);border:3px solid #000;box-shadow:3px 3px 0 #000;border-radius:12px;padding:7px 10px}
.hpbar{flex:1;min-width:0;height:20px;border-radius:999px;background:#120d0b;border:2px solid #000;overflow:hidden;position:relative}
.hpbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#2d7f36,var(--heal-hi));transition:width .45s ease}
.hpbar span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-weight:600;
  font-size:.76rem;letter-spacing:.04em;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.85);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;
  font-family:var(--f-num);font-weight:600;font-size:.78rem;letter-spacing:.03em;
  background:var(--wood-3);border:2px solid #000;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .ico{width:15px;height:15px;object-fit:contain}
.chip.gold{color:var(--gold-hi)}
.chip.blk{background:#26394d;color:#cfe4ff}
.chip.hit{background:#5a2a22;color:#ffd9cc}
.chip.calm{background:#2f3b4f;color:#d6e6ff}

/* ---------- the wind-up, and the two trays of dice ---------- */
.table{flex:none;background:var(--leather);border:3px solid #000;box-shadow:4px 4px 0 #000;
  border-radius:14px;padding:9px 10px 10px;display:flex;flex-direction:column;gap:8px}
.wind{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.wind-lbl{font-family:var(--f-num);font-weight:600;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--parch-dim)}
.wind-num{font-family:var(--f-title);font-size:2.1rem;line-height:1;color:var(--gold);text-shadow:0 2px 0 #000;font-variant-numeric:tabular-nums}
.wind-note{font-family:var(--f-num);font-weight:600;font-size:.76rem;color:var(--parch-dim);text-align:right;line-height:1.2}

/* Both rows are the same six columns, and every die keeps its own column for
   the whole turn, so a die set aside slides straight up out of its column
   instead of jumping sideways across the tray. */
.row6{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;align-items:center}
/* No side padding on the set-aside tray on purpose: its six columns have to
   line up exactly with the six below it, or a die set aside slides up AND
   sideways and the whole point of fixed columns is lost. */
.held{padding:4px 0;border-radius:10px;border:2px dashed var(--line);border-left:0;border-right:0;
  background:rgba(0,0,0,.28);min-height:38px}
.live{min-height:50px}

/* ---------- a die ----------
   Ordinary readable pips, always. Monster faces on dice faces would be the one
   change that sinks the game, because six dice have to be read at a glance.
   The flavor is in the material: --die-* is swapped per world, and the pips
   stay at maximum contrast in every single set. */
:root{ --die-face:#f6ecd4; --die-face-2:#d8c7a2; --die-face-3:#bfa87e; --die-pip:#16100d; }
.die{
  position:relative;aspect-ratio:1;width:100%;min-width:0;padding:9.5%;border:3px solid #000;border-radius:19%;
  background:linear-gradient(155deg, var(--die-face), var(--die-face-2) 58%, var(--die-face-3));
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.2), 3px 3px 0 #000;
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:4%;
}
.die i{border-radius:50%;background:transparent}
.die i.on{background:var(--die-pip);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
/* a die that could still be part of something that scores */
.die.can{box-shadow:inset 0 -3px 0 rgba(0,0,0,.2), 0 0 0 3px var(--gold), 3px 3px 0 #000}
/* a die that cannot. It has to stay readable - the player is about to decide
   whether to re-roll it - so this says "scores nothing", not "broken". */
.die.dead{filter:grayscale(.7) brightness(.78);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2), 2px 2px 0 #000}
/* set aside this roll - still yours to take back */
.die.pick{box-shadow:inset 0 -3px 0 rgba(0,0,0,.2), 0 0 0 3px var(--gold-hi), 0 0 14px rgba(255,211,92,.5), 3px 3px 0 #000}
/* set aside for good, earlier in the turn */
.die.locked{box-shadow:inset 0 -3px 0 rgba(0,0,0,.2), 0 0 0 2px #8a6a28, 2px 2px 0 #000;cursor:default}
/* before the first roll of a turn: a die with nothing on it yet, so the tray
   never sits there showing six 1s and lighting up as an 8000 jackpot */
.die.blank{filter:brightness(.66) saturate(.72);cursor:default}
.die.blank i{background:transparent!important;box-shadow:none!important}

/* The tumble. Flat, not a 3D cube: a spinning cube is lovely for half a second
   and unreadable for the other half, and reading six dice fast is the whole
   game. The face flips a few times mid-tumble from script, so it reads as a
   real roll, and it lands square because tilted pips are harder to read. */
@keyframes tumble{
  0%  {transform:translateY(-130%) rotate(-30deg) scale(.82)}
  34% {transform:translateY(8%)    rotate(190deg) scale(1.05)}
  54% {transform:translateY(-24%)  rotate(268deg) scale(.97)}
  76% {transform:translateY(5%)    rotate(330deg) scale(1.04)}
  90% {transform:translateY(-5%)   rotate(352deg) scale(1)}
  100%{transform:translateY(0)     rotate(360deg) scale(1)}
}
.die.tumble{animation:tumble var(--dur,580ms) cubic-bezier(.3,.72,.38,1) both}
@keyframes land{0%{transform:scale(1.14,.88)}46%{transform:scale(.96,1.07)}100%{transform:scale(1)}}
.die.land{animation:land .22s ease-out}
@keyframes shiver{25%{transform:translateX(-2px) rotate(-3deg)}75%{transform:translateX(2px) rotate(3deg)}}
.die.shiver{animation:shiver .3s ease-in-out 2}
@keyframes hotflash{0%,100%{filter:none}40%{filter:brightness(1.7) saturate(1.5) drop-shadow(0 0 12px var(--gold))}}
.die.hot{animation:hotflash .5s ease-in-out}
@media (prefers-reduced-motion: reduce){
  .die.tumble,.die.land,.die.shiver,.die.hot{animation:none}
}

/* ---------- the buttons ---------- */
.actions{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:3px solid #000;border-radius:12px;box-shadow:3px 3px 0 #000;background:var(--leather);color:var(--parch);
  font-family:var(--f-num);font-weight:600;font-size:1rem;letter-spacing:.04em;padding:12px 10px;min-height:52px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.1}
.btn small{font-size:.68rem;font-weight:500;letter-spacing:.03em;opacity:.78}
.btn.roll{background:var(--wood-3)}
.btn.strike{background:var(--hp);color:#fff;font-family:var(--f-title);font-weight:400;font-size:1.3rem;letter-spacing:0}
.btn.strike small{font-family:var(--f-num);font-weight:600}
.btn:disabled{opacity:.36;cursor:not-allowed;box-shadow:1px 1px 0 #000}
.btn.big{background:var(--gold);color:#000;width:100%;font-family:var(--f-title);font-weight:400;
  font-size:1.3rem;letter-spacing:0;box-shadow:4px 4px 0 #000}
.btn.ghost{background:var(--leather);font-size:.84rem;padding:9px 10px;min-height:44px}

/* ---------- popups ---------- */
#overlay{position:fixed;inset:0;background:rgba(15,9,6,.8);display:grid;place-items:center;z-index:50;
  padding:max(14px, env(safe-area-inset-top,0px)) max(14px, env(safe-area-inset-right,0px))
          max(14px, env(safe-area-inset-bottom,0px)) max(14px, env(safe-area-inset-left,0px))}
.panel{background-color:var(--leather);background-image:radial-gradient(rgba(255,255,255,.03) 1px,transparent 1.3px);
  background-size:6px 6px;border:3px solid #000;box-shadow:6px 6px 0 #000;border-radius:14px;
  width:100%;max-width:520px;max-height:100%;overflow:auto;padding:16px;
  display:flex;flex-direction:column;gap:11px;animation:pop .22s ease}
@keyframes pop{from{transform:scale(.94);opacity:.4}}
.panel h2{margin:0;font-family:var(--f-title);font-weight:400;font-size:1.7rem;line-height:1.1;
  color:var(--gold);text-shadow:2px 2px 0 #000;text-wrap:balance}
.panel p{margin:0;line-height:1.5;color:var(--parch-dim);font-size:1rem}
.panel p b{color:var(--parch)}
.eyebrow{font-family:var(--f-num);font-weight:600;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--parch-dim)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
.menu-note{font-size:.9rem;color:var(--parch-dim);line-height:1.45}
.tipbox{background:var(--bubble);color:var(--bubble-ink);border:3px solid #000;box-shadow:4px 4px 0 #000;
  border-radius:12px;padding:9px 11px;font-size:.95rem;line-height:1.4}
.tipbox b{color:#000}
.tipbox::before{content:"Old Bram says";display:block;font-family:var(--f-num);font-size:.64rem;letter-spacing:.12em;
  text-transform:uppercase;font-weight:700;color:#8a5a20;margin-bottom:2px}

/* ---------- a scene at the top of a popup ---------- */
.scene{position:relative;width:100%;aspect-ratio:16/9;border-radius:11px;border:3px solid #000;
  box-shadow:3px 3px 0 #000;overflow:hidden;background:#0d0906;flex:none}
.scene>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scene .foe{position:absolute;left:50%;bottom:0;translate:-50% 0;height:92%;filter:drop-shadow(0 8px 14px rgba(0,0,0,.8))}
.scene .tag{position:absolute;left:8px;top:8px;background:var(--gold);color:#000;border:3px solid #000;
  box-shadow:3px 3px 0 #000;border-radius:7px;padding:3px 10px;rotate:-2.5deg;
  font-family:var(--f-title);font-size:1.05rem;line-height:1.2;max-width:72%}
.scene .mark{position:absolute;right:12px;top:14%;font-family:var(--f-title);font-size:2rem;color:var(--gold-hi);
  text-shadow:0 3px 0 #000;animation:markpop .5s ease both}
@keyframes markpop{0%{opacity:0;scale:.3}60%{scale:1.2}100%{opacity:1;scale:1}}
.say{position:relative;background:var(--bubble);color:var(--bubble-ink);
  border:3px solid #000;box-shadow:3px 3px 0 #000;border-radius:10px;padding:7px 11px;margin-top:9px;
  font-size:.95rem;line-height:1.3;font-weight:500;min-height:1.3em}
.say::before{content:"";position:absolute;left:22px;top:-9px;width:0;height:0;
  border:7px solid transparent;border-bottom-color:#000;border-top:0}
.say::after{content:"";position:absolute;left:25px;top:-4px;width:0;height:0;
  border:5px solid transparent;border-bottom-color:var(--bubble);border-top:0}
.say.you{background:#dbe9f7}
.say:empty{display:none}

/* ---------- you against it, side by side ---------- */
.tape{display:grid;grid-template-columns:1fr auto 1fr;gap:3px 8px;align-items:center;
  background:rgba(0,0,0,.3);border:2px solid #000;border-radius:10px;padding:8px 10px}
.tape .who{font-family:var(--f-num);font-weight:700;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--parch-dim)}
.tape .who.r{text-align:right}
.tape .mid{font-family:var(--f-num);font-weight:600;font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--parch-dim);text-align:center}
.tape b{font-family:var(--f-num);font-weight:700;font-size:1.02rem;font-variant-numeric:tabular-nums}
.tape b.r{text-align:right}
.tape .mine{color:var(--heal-hi)} .tape .theirs{color:#ff9f90;text-align:right}

/* ---------- victory ---------- */
.vic{display:flex;flex-direction:column;gap:10px;align-items:stretch;text-align:center}
/* .hpbar is flex:1 so it can stretch along the fight bar. In a column that
   makes flex-basis 0 and the height collapses to a line, so pin it here. */
.vic .hpbar,.panel .hpbar{flex:none;height:22px}
.vic-title{font-family:var(--f-title);font-size:2.3rem;line-height:1;color:var(--gold);text-shadow:0 3px 0 #000}
.vic-tag{display:inline-flex;flex-direction:column;align-self:center;background:var(--gold);color:#000;
  border:3px solid #000;box-shadow:3px 3px 0 #000;border-radius:9px;padding:3px 12px;rotate:-1.5deg}
.vic-tag b{font-family:var(--f-title);font-weight:400;font-size:1.15rem;line-height:1.1}
.vic-tag span{font-family:var(--f-num);font-weight:600;font-size:.78rem;letter-spacing:.04em}
.vic-foe{display:grid;place-items:center}
.vic-foe img{height:clamp(88px,20vh,150px);width:auto;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.7))}
.vic-sub{font-size:1rem;color:var(--parch-dim);line-height:1.35}
.vic-sub b{color:var(--parch)}
.loot{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;
  background:rgba(0,0,0,.3);border:2px solid #000;border-radius:10px;padding:8px 10px}
.purse{display:flex;align-items:center;gap:7px}
.purse img{width:30px;height:30px}
.purse b{font-family:var(--f-num);font-weight:700;font-size:1.3rem;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.purse small{display:block;font-family:var(--f-num);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--parch-dim)}
.xpwrap{min-width:0}

/* ================= phones =================
   Everything below is for a phone held upright. Four sizes are checked:
   390x844, 375x667, 360x740 and 320x568.

   Note for anyone making a test page out of this file: this source has no
   <head>, so a page built by hand has no viewport meta either, and a
   mobile-emulated Chrome then lays it out at 980px - every query below reads
   false while the page still looks laid out. Build test pages with
   dev/gen/harness.py, and check matchMedia('(max-width:560px)').matches at
   320 wide before trusting a single measurement. */
@media (max-width:560px){
  .brand{font-size:1.25rem}
  .brand img{width:26px;height:26px}
  .tool{padding:5px 9px;font-size:.72rem}
  .wind-num{font-size:1.9rem}
}
/* The name and three buttons stop fitting on one line somewhere under 430px,
   and a second row of buttons costs 38px of height the monster needs. The
   title goes first: the page is called Monster Farkle and the menu says so,
   so the word on the bar is doing the least work of anything up there.
   Sound is not up here at all - it lives in the menu, with the other settings. */
@media (max-width:430px){
  .brand .wide-only{display:none}
  .tools{flex-wrap:nowrap}
}
/* Six dice stay in one row on every phone that matters. At 320 wide, with the
   narrow padding below, that is a 46px die - above the 44px tap floor and the
   pips still read at a glance. Two rows of three would be prettier dice and
   about 100px taller, which the monster cannot afford on a 568-tall screen.
   Below 300px there is no honest way to fit six, so they stack. */
@media (max-width:300px){
  .row6{grid-template-columns:repeat(3,1fr)}
}
/* At 320 the die has to clear 44px, and every bit of side padding on the way
   in comes off it: the page, then the table, then the gaps between six dice.
   8 + 6 + four-pixel gaps leaves a 45px die. 10 + 10 + five left it at 42. */
@media (max-width:380px){
  #app{padding-left:max(8px, env(safe-area-inset-left,0px));padding-right:max(8px, env(safe-area-inset-right,0px))}
  .table{padding:8px 6px 9px}
  .row6{gap:4px}
  .panel{padding:13px;gap:9px}
  .panel h2{font-size:1.5rem}
  .btn{font-size:.92rem;padding:10px 8px}
  .btn.strike{font-size:1.15rem}
}
/* The level-up screen carries more than any other popup - a medal, two stat
   rows and three choices - and at 320x568 the third choice fell off the
   bottom. No popup may need scrolling to reach its main button, so everything
   above the choices gives height back. */
@media (max-height:680px){
  .panel .eyebrow{display:none}
  .lu-medal{width:54px;height:54px}
  .lu-medal b{font-size:1.6rem}
  .lu-row{padding:5px 9px;gap:8px}
  .lu-row .ico{width:26px;height:26px}
  .lu-lbl{font-size:.94rem}
  .perk{padding:7px 10px;min-height:48px;gap:2px 9px}
  .perk b{font-size:1.02rem}
  .perk span{font-size:.84rem;line-height:1.22}
  .perks{gap:6px}
  /* the smith lists five slots at once, which is the longest list in the game */
  .panel h2{font-size:1.45rem}
  .buy{padding:6px 9px;min-height:48px;gap:2px 9px}
  .buy b{font-size:1rem}
  .buy span{font-size:.82rem;line-height:1.2}
  .buy .ico{width:26px;height:26px}
  .buys{gap:5px}

}

  .stage{min-height:90px}
  .stage-top{padding-top:7px}

<script>
(() => {
const $ = id => document.getElementById(id);
const fmt = n => (n|0).toLocaleString('en-US');
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const store = {
  get(k,d){ try{ const v=localStorage.getItem('fk_'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('fk_'+k, JSON.stringify(v)); }catch(e){} }
};

/* In the phone apps the game's files sit inside the app, served from
   capacitor://, where there is no site to ask for the monster clips or the
   leaderboard. Point those at the real site. On the web this is empty. */
const REMOTE = /^https?:$/.test(location.protocol) ? '' : 'https://axesandaces.com/';

function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2400);
}
function openPanel(html){ $('panel').innerHTML=html; $('overlay').hidden=false; $('panel').scrollTop=0; }
function closePanel(){ $('overlay').hidden=true; }

/* ===== SCORING =====================================================
   Real Farkle scoring. dev/gen/dieavg.cjs lifts this exact block out of this
   file and runs it, so the simulator and the game can never drift apart. Keep
   it self-contained: no DOM, no game state, nothing from outside the block.

     each 1                    100
     each 5                     50
     three of a kind            face x 100, and three 1s are 1000
     each extra matching die    doubles the three of a kind
     straight, 1 through 6     1500
     three pairs               1500
     four of a kind + a pair   1500
     two triplets              2500

   The doubling rule is why four of a kind is not a flat number. A flat 1000
   would have made four 1s worth the same as three 1s, so the fourth die earned
   nothing - the sort of thing a player notices once and never trusts again.
   Doubling is one sentence to explain, never goes backwards, and leaves six 1s
   at 8000 as the jackpot of the whole game. */
const FACE3 = [0, 1000, 200, 300, 400, 500, 600];   /* three of a kind, by face */

const counts = faces => { const c = [0,0,0,0,0,0,0]; for(const f of faces) c[f]++; return c; };

/* The best score for a set of dice that uses EVERY die in it, or null when some
   die in the set is dead weight. That "every die" rule is what makes a
   selection legal: you may not set aside a die that is not paying its way. */
const setMemo = new Map();
function scoreSet(c){
  const n = c[1]+c[2]+c[3]+c[4]+c[5]+c[6];
  if(!n) return 0;
  const key = c.join(',');
  if(setMemo.has(key)) return setMemo.get(key);
  let best = -1;
  if(n === 6){
    const pairs = c.filter(x => x === 2).length, trips = c.filter(x => x === 3).length;
    if(c[1]===1&&c[2]===1&&c[3]===1&&c[4]===1&&c[5]===1&&c[6]===1) best = Math.max(best, 1500);
    if(pairs === 3) best = Math.max(best, 1500);
    if(trips === 2) best = Math.max(best, 2500);
    if(c.some(x => x === 4) && pairs === 1) best = Math.max(best, 1500);
  }
  for(let f = 1; f <= 6; f++) if(c[f] >= 3) for(let k = 3; k <= c[f]; k++){
    const d = c.slice(); d[f] -= k;
    const rest = scoreSet(d);
    if(rest !== null) best = Math.max(best, FACE3[f] * (1 << (k - 3)) + rest);
  }
  if(c[1]){ const d = c.slice(); d[1]--; const r = scoreSet(d); if(r !== null) best = Math.max(best, 100 + r); }
  if(c[5]){ const d = c.slice(); d[5]--; const r = scoreSet(d); if(r !== null) best = Math.max(best, 50 + r); }
  const out = best < 0 ? null : best;
  setMemo.set(key, out);
  return out;
}

/* What a chosen handful of dice is worth. null means the choice is not legal. */
const scoreOf = faces => scoreSet(counts(faces));

/* Every subset of the roll, and the best of them. Ties go to the pick that
   leaves the most dice to roll again, because that is worth more than nothing. */
function bestSplit(faces){
  const n = faces.length;
  let best = { score: 0, keep: [] };
  for(let m = 1; m < (1 << n); m++){
    const sel = [];
    for(let i = 0; i < n; i++) if(m & (1 << i)) sel.push(i);
    const s = scoreOf(sel.map(i => faces[i]));
    if(s === null || s <= 0) continue;
    if(s > best.score || (s === best.score && sel.length < best.keep.length)) best = { score: s, keep: sel };
  }
  return best;
}

const isFarkle = faces => bestSplit(faces).score === 0;

/* Could this handful still grow into something that scores? This is what makes
   an illegal move impossible rather than merely discouraged: a die is only
   tappable when some way of filling in the rest of the roll pays for it. */
function reachable(faces, picked){
  const rest = [];
  for(let i = 0; i < faces.length; i++) if(picked.indexOf(i) < 0) rest.push(i);
  for(let m = 0; m < (1 << rest.length); m++){
    const sel = picked.slice();
    for(let i = 0; i < rest.length; i++) if(m & (1 << i)) sel.push(rest[i]);
    if(scoreOf(sel.map(i => faces[i])) > 0) return true;
  }
  return false;
}

/* The names, for the banner and the scoring screen. Plain first, loud second. */
function namedCombos(c){
  const n = c[1]+c[2]+c[3]+c[4]+c[5]+c[6], out = [];
  if(n === 6){
    if(c[1]===1&&c[2]===1&&c[3]===1&&c[4]===1&&c[5]===1&&c[6]===1) out.push(['Straight', 'ALL SIX!', 1500]);
    if(c.filter(x => x === 2).length === 3) out.push(['Three pairs', 'THREE PAIRS!', 1500]);
    if(c.filter(x => x === 3).length === 2) out.push(['Two triplets', 'TWO TRIPLETS!', 2500]);
  }
  for(let f = 1; f <= 6; f++) if(c[f] >= 3){
    const word = ['', '', '', 'Three', 'Four', 'Five', 'Six'][c[f]];
    out.push([`${word} ${f}s`, c[f] >= 5 ? 'UNBELIEVABLE!' : c[f] === 4 ? 'FOUR OF A KIND!' : null,
              FACE3[f] * (1 << (c[f] - 3))]);
  }
  return out;
}
/* ===== END SCORING ===== */

/* ---------- what a turn is actually worth ----------
   Measured, not guessed: dev/gen/dieavg.cjs plays 300,000 turns at each of
   twelve bank-at thresholds using the scoring block above. Every number below
   is off that run.

     bank at   per turn   farkle rate   when banked
         250      543.1         12.8%           623
         300      546.6         19.8%           682   <- best
         350      542.4         29.1%           765
         500      516.1         49.8%          1027
        1000      440.0         71.5%          1541

   A turn delivers 547 on average, counting farkles as nothing, and about one
   turn in five farkles. The curve is almost flat from 250 to 400, which is the
   best thing about the game: a careful player and a greedy player earn nearly
   the same, so pushing your luck is a real choice rather than a mistake.

   WINDUP_AVG is the median blow the fight maths is built from, the way
   HAND_AVG = 121 works in dev/game.html. Monster health and monster hits are
   scaled from this, so neither side is stronger than the other by default.
   Re-run dieavg.cjs and update this if the scoring ever changes. */
const WINDUP_AVG = 545;

/* ===== THE FIGHT MATHS =============================================
   Both sides measured in the same units, so neither is stronger by default.
   The hero's output is a wind-up, which dev/gen/dieavg.cjs measured at 545 a
   turn. Everything else is built off that and off what a hero of a given level
   can take, the way dev/game.html builds its numbers off HAND_AVG.

   dev/gen/fkbalance.cjs lifts this block and runs whole fights through it, so
   keep it free of the page: no DOM, nothing off S, nothing from outside. The
   bits that do read S live below the end marker. */
const LVL_STEP = 1.12;
const lvlMult = L => Math.pow(LVL_STEP, Math.max(1, L | 0));
const heroMaxHP = L => 400 + 100 * (Math.max(1, L | 0) - 1);
const rnd = n => Math.random() * n | 0;

/* How long an even fight should run. A Farkle turn is several rolls and a
   decision, so a fight wants fewer turns than the card game wants hands.
   Armour stretches it by about 15%, so five lands near six real turns. */
const TURNS = 5;

/* What a turn delivers at this level, before the monster's armour. Guards and
   heals are priced off THIS, not off the monster's own health. The card game
   prices them off max health and gets away with it because one hand there is
   nearly a third of a monster; a strike here is under a tenth, so the same 15%
   heal would be worth more than a hit and the monster would never die. */
const turnDamage = L => WINDUP_AVG * lvlMult(L);
const HEAL_SHARE = .4, GUARD_SHARE = .3;

/* A kind's temperament, 0 to 1: 1 is all shell and no bite, 0 is all bite and
   no shell. Read off the kind's own health and attack, the same trick
   dev/game.html uses, so no monster needs tagging by hand. */
const temper = k => Math.max(0, Math.min(1, ((k.hp || 1) / (k.atk || 1) - 0.6) / 1.1));

/* Its ordinary hit is a share of what a hero of its level can take. Shell and
   bite trade against each other: a heavy monster hits softer and lives longer.
   The tenth is measured, not picked. dev/gen/fkbalance.cjs plays whole fights
   with the real scoring: at a tenth, a bare hero with no gear and no potions
   wins 88% of them and finishes on half health, and a greedy one who holds out
   for 500 a turn wins 70%. A thirteenth made a careful player almost unable to
   lose, which takes the gamble out of a push-your-luck game. */
const foeHit = (L, tp) => Math.round(heroMaxHP(L) / 10 * (1.3 - .6 * tp) / 5) * 5;
/* Armor soaks a share of every strike. The cap keeps it under half, always. */
const foeArmorFor = (L, boss, tp) => Math.min(95, Math.round((10 + L * 5) * (.6 + .8 * tp) * (boss ? 1.25 : 1)));
const foeArmor = d => d ? (d.def != null ? d.def : foeArmorFor(d.lvl || 1, d.boss, d.tp)) : 0;
const armored = (dmg, d) => Math.max(1, Math.round(dmg / (1 + foeArmor(d) / 100)));

/* Its health is the fight length you want, in strikes that actually land.
   Armour is divided back out here on purpose: without that, a shelled monster
   got the longer fight twice over - once from its armour and again from the
   kind's own health - and a heavy kind took fifteen strikes instead of five. */
const monsterHP = (L, kindHp, armor) =>
  Math.round(TURNS * turnDamage(L) / (1 + armor / 100) * (kindHp || 1) / 50) * 50;

/* A farkle is the punishment, so it costs more than an ordinary move. */
const FARKLE_MULT = 1.5;

/* what you carry */
const weaponPts = () => (S.eq.main ? EQUIP[S.eq.main.type].atk[S.eq.main.tier] : 0)
  + (S.eq.off && !twoHanded() ? EQUIP[S.eq.off.type].atk[S.eq.off.tier] : 0);
const twoHanded = () => !!(S.eq.main && EQUIP[S.eq.main.type].hands === 2);
const defense = () => ['shield','helm','armor'].reduce((a,k) => a + (S.eq[k] ? EQUIP[S.eq[k].type].def[S.eq[k].tier] : 0), 0);
const atkMult = () => 1 + weaponPts() / 100;
/* Everything the player has bought or picked meets here, so there is one
   place to look when a number is wrong: perks, charms and the rage potion. */
const perkMult = w =>
    (1 + .10 * perkCount('strong'))
  * ((w > 1000 && (perkCount('gamble') || hasCharm('ring'))) ? 1 + .25 * (perkCount('gamble') + (hasCharm('ring') ? 1 : 0)) : 1)
  * (S.rage ? 1.5 : 1);
const bankBonus = () => 50 * perkCount('steady') + (hasCharm('whet') ? 100 : 0);
const strikeDamage = w => armored(Math.round(w * lvlMult(S.level) * atkMult() * perkMult(w)), foeDef());
/* what one of the monster's hits actually costs you */
const takeFrom = n => Math.max(1, Math.round(n / (1 + defense() / 100)));

const AREA_FIGHTS = 3;

const posIn = (i = S.idx) => i % AREA_FIGHTS;
const isBossStep = (i = S.idx) => posIn(i) === AREA_FIGHTS - 1;
const worldOf = () => WORLDS[(S.world || 0) % 10];
const worldName = w => {
  w = w || 0;
  const n = WORLDS[w % 10].name;
  return w >= 10 ? `Endless · Depth ${w - 9}: ${n}` : n;
};
const curArea = () => worldOf().areas[areaOf()];
const AREA_LV = () => { const off = (S.world || 0) * 8; return [[1,3],[3,5],[5,7],[7,9]][areaOf()].map(x => x + off); };

/* ---------- sound ----------
   Dice on a wooden table: a short noise knock through a band-pass, with a low
   body under it. Built the same way dev/game.html builds its effects. */
let ac = null, noiseBuf = null;
let soundOn = store.get('sound', true);
function audio(){
  if(!ac){ try{ ac = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  if(ac && ac.state === 'suspended') ac.resume();
  return ac;
}
function noise(){
  if(!noiseBuf){
    noiseBuf = ac.createBuffer(1, ac.sampleRate * .4, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const s = ac.createBufferSource(); s.buffer = noiseBuf; return s;
}
function tone(f, dur, type = 'triangle', vol = .07, delay = 0){
  if(!soundOn || !audio()) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .012);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + .02);
}
/* one die hitting the table */
function knock(delay = 0, vol = 1){
  if(!soundOn || !audio()) return;
  const t = ac.currentTime + delay, n = noise(), f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'bandpass'; f.frequency.value = 1500 + Math.random() * 900; f.Q.value = 1.3;
  g.gain.setValueAtTime(.16 * vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + .09);
  n.connect(f); f.connect(g); g.connect(ac.destination); n.start(t); n.stop(t + .12);
  tone(90 + Math.random() * 40, .07, 'sine', .05 * vol, delay);
}
/* a die snapping into the set-aside tray */
const snap = () => { tone(1250, .06, 'square', .045); tone(1870, .05, 'triangle', .03, .035); };
const unsnap = () => tone(620, .07, 'triangle', .035);
const deadthud = () => { tone(104, .26, 'sawtooth', .09); tone(66, .34, 'sine', .11, .02); };

/* ---------- the dice ----------
   Six dice, each keeping its own column for the whole turn. 'where' is the only
   thing that moves them: live on the table, pick set aside this roll and still
   takeable back, locked set aside for good earlier in the turn. */
const PIPS = { 1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8] };
const DICE = 6;
let D = [];          /* the six dice */
let wind = 0;        /* locked into this turn's wind-up, not counting the pick */
let rolling = false; /* dice in the air: nothing is tappable */
let busy = false;    /* a strike or a monster's move is playing out */
let started = false; /* before the first roll the dice are blank, not showing six 1s */

const liveIdx  = () => D.map((d, i) => i).filter(i => D[i].where === 'live');
const pickIdx  = () => D.map((d, i) => i).filter(i => D[i].where === 'pick');
const rollIdx  = () => D.map((d, i) => i).filter(i => D[i].where === 'live' || D[i].where === 'pick');
const facesOf  = ix => ix.map(i => D[i].f);
/* the roll the scoring is judged on: everything not locked away earlier */
const pickScore = () => { const s = scoreOf(facesOf(pickIdx())); return s === null ? 0 : s; };

function dieEl(i){
  const b = document.createElement('button');
  b.className = 'die'; b.dataset.die = i; b.type = 'button';
  for(let k = 0; k < 9; k++) b.appendChild(document.createElement('i'));
  return b;
}
function paintFace(el, f){
  const on = PIPS[f];
  [...el.children].forEach((pip, k) => pip.className = on.includes(k) ? 'on' : '');
  el.setAttribute('aria-label', `Die showing ${f}`);
}

/* Move things without jumping: measure, move, then animate the gap away. */
function flip(els, mutate){
  if(reduced()){ mutate(); return; }
  const was = new Map();
  els.forEach(el => was.set(el, el.getBoundingClientRect()));
  mutate();
  els.forEach(el => {
    const a = was.get(el), b = el.getBoundingClientRect();
    const dx = a.left - b.left, dy = a.top - b.top;
    if(!dx && !dy) return;
    el.animate([{ transform:`translate(${dx}px,${dy}px)` }, { transform:'none' }],
               { duration:250, easing:'cubic-bezier(.2,.9,.3,1.25)' });
  });
}

function buildTray(){
  $('heldRow').innerHTML = ''; $('liveRow').innerHTML = '';
  D = [];
  for(let i = 0; i < DICE; i++){
    const el = dieEl(i);
    el.style.gridColumn = String(i + 1);
    D.push({ f:1, where:'live', el });
    $('liveRow').appendChild(el);
    paintFace(el, 1);
  }
}

/* Put every die in the row its state says, and dress it. */
function placeDice(){
  const held = $('heldRow'), live = $('liveRow');
  D.forEach(d => {
    const want = d.where === 'live' ? live : held;
    if(d.el.parentElement !== want) want.appendChild(d.el);
  });
  held.classList.toggle('empty', !D.some(d => d.where !== 'live'));
  renderDice();
}

function renderDice(){
  const roll = rollIdx();                                /* the dice in this roll */
  const faces = facesOf(roll);
  const pos = new Map(roll.map((g, k) => [g, k]));        /* die number -> place in the roll */
  const picked = pickIdx().map(g => pos.get(g));
  D.forEach((d, i) => {
    const el = d.el;
    el.classList.remove('can', 'dead', 'pick', 'locked', 'blank');
    if(!started){ el.classList.add('blank'); el.disabled = true; return; }
    if(d.where === 'locked'){ el.classList.add('locked'); el.disabled = true; return; }
    if(d.where === 'pick'){ el.classList.add('pick'); el.disabled = rolling; return; }
    /* A die is tappable only when some way of filling in the rest of this roll
       pays for it. That is what makes an illegal pick impossible rather than
       merely discouraged: one 2 out of three 2s never lights up, all three do. */
    const could = !rolling && reachable(faces, picked.concat([pos.get(i)]));
    el.classList.add(could ? 'can' : 'dead');
    el.disabled = rolling || !could;
  });
  renderWind();
}

function renderWind(){
  const add = pickScore(), total = (wind + add) && (wind + add + bankBonus()), left = liveIdx().length;
  $('windNum').textContent = fmt(total);
  $('windNum').style.color = add ? 'var(--gold-hi)' : 'var(--gold)';
  $('rollNote').textContent = !started ? 'six dice'
    : !add ? 'set aside first'
    : left === 0 ? 'hot dice - all six' : `${left} ${left === 1 ? 'die' : 'dice'} left`;
  $('strikeNote').textContent = total ? `hit for ${fmt(strikeDamage(total))}` : 'nothing yet';
  const stop = rolling || busy;
  $('rollBtn').disabled = stop || (started && add === 0);
  $('strikeBtn').disabled = stop || !started || add === 0;
}

function toggleDie(i){
  const d = D[i];
  if(rolling || (d.where !== 'live' && d.where !== 'pick')) return;
  d.where = d.where === 'live' ? 'pick' : 'live';
  if(d.where === 'pick') snap(); else unsnap();
  flip(D.map(x => x.el), placeDice);
}

/* ---------- the roll ---------- */
function rollDice(){
  const ix = liveIdx();
  if(!ix.length) return Promise.resolve([]);
  rolling = true; renderDice();
  const dur = reduced() ? 1 : 580;
  ix.forEach((i, k) => {
    const d = D[i], el = d.el;
    d.f = 1 + (Math.random() * 6 | 0);
    el.classList.remove('land', 'shiver', 'hot', 'tumble');
    el.style.setProperty('--dur', dur + 'ms');
    if(reduced()){ paintFace(el, d.f); return; }
    void el.offsetWidth;
    el.style.animationDelay = (k * 60) + 'ms';
    el.classList.add('tumble');
    /* the face flips while it is in the air, then lands on the real one */
    let flips = 0;
    const spin = setInterval(() => {
      if(++flips > 6){ clearInterval(spin); paintFace(el, d.f); return; }
      paintFace(el, 1 + (Math.random() * 6 | 0));
    }, dur / 8);
    setTimeout(() => {
      clearInterval(spin); paintFace(el, d.f);
      el.classList.remove('tumble'); el.style.animationDelay = '';
      el.classList.add('land'); knock(0, .9);
      setTimeout(() => el.classList.remove('land'), 240);
    }, dur + k * 60);
  });
  return new Promise(done => setTimeout(() => {
    rolling = false; renderDice();
    done(ix);
  }, reduced() ? 40 : dur + ix.length * 60 + 120));
}

  if(act === 'rest'){
    spend(REST_PRICE);
    const n = Math.min(S.maxHp - S.hp, Math.round(S.maxHp * REST_SHARE));
    S.hp += n; setMyBars(); toast(`You rest, and feel ${fmt(n)} better.`);
    return shopPanel('rest');
  }
  if(act === 'buyEq'){
    const slot = b.dataset.slot, type = b.dataset.type, tier = +b.dataset.tier;
    spend(EQUIP[type].price[tier]);
    S.eq[slot] = { type, tier };
    /* a two-handed weapon has no room for a second one */
    if(slot === 'main' && EQUIP[type].hands === 2) S.eq.off = null;
    setMyBars(); toast(`${eqName(type, tier)} is yours.`);
    return shopPanel('smith');
  }
  if(act === 'buyCharm'){ spend(CH[b.dataset.charm].price); S.charms = (S.charms || []).concat([b.dataset.charm]);
    toast(`${CH[b.dataset.charm].name} is yours.`); return shopPanel('charms'); }
  if(act === 'buyPot'){ spend(PO[b.dataset.pot].price); S.pots = (S.pots || []).concat([b.dataset.pot]);
    renderPots(); toast(`${PO[b.dataset.pot].name} in your bag.`); return shopPanel('pots'); }
  if(act === 'drink') return drink(b.dataset.pot);
  if(act === 'again'){ closePanel(); S.hp = S.maxHp; S.idx = 0; S.world = 0; S.introBeat = 0; return storyPanel('start'); }
  if(act === 'storyNext') return storyNext(b.dataset.key);
  toast('Not built yet: ' + act);
});

/* ---------- effects ---------- */
const wait = ms => new Promise(r => setTimeout(r, ms));
function anim(el, cls){
  if(!el) return;
  if(el === $('foePic') && $('stage').classList.contains('hasvid')) el = $('foeVidWrap');
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), 1300);
}
function shake(t = 1){
  if(reduced()) return;
  const a = $('app');
  a.classList.remove('shake', 'shake2', 'shake3'); void a.offsetWidth;
  a.classList.add(t >= 3 ? 'shake3' : t >= 2 ? 'shake2' : 'shake');
  setTimeout(() => a.classList.remove('shake', 'shake2', 'shake3'), 700);
}
function banner(t, small){
  const b = $('banner');
  b.innerHTML = small ? `${t}<small>${small}</small>` : t;
  b.className = 'banner'; void b.offsetWidth; b.classList.add('show');
}
function pop(el, text, cls){
  if(!el) return;
  const r = el.getBoundingClientRect(), s = document.createElement('div');
  s.className = 'pop ' + cls; s.textContent = text;
  s.style.left = (r.left + r.width / 2 + (Math.random() * 18 - 9)) + 'px';
  s.style.top = r.top + 'px';
  $('fx').appendChild(s); setTimeout(() => s.remove(), 1050);
}
function swoosh(){
  if(!soundOn || !audio()) return;
  const t = ac.currentTime, n = noise(), f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'bandpass'; f.frequency.setValueAtTime(2600, t); f.frequency.exponentialRampToValueAtTime(380, t + .22);
  g.gain.setValueAtTime(.1, t); g.gain.exponentialRampToValueAtTime(.0001, t + .24);
  n.connect(f); f.connect(g); g.connect(ac.destination); n.start(t); n.stop(t + .26);
}
const bigBoom = t => { tone(55, .5 + t * .1, 'sine', .17); tone(42, .7, 'sawtooth', .06, .03); if(t >= 3) tone(30, .9, 'sine', .13, .06); };
function stageCentre(){
  const r = $('stage').getBoundingClientRect();
  return { x:r.left + r.width / 2, y:r.top + r.height * .55, r };
}
/* the axe going through it, once per tier of the hit */
async function slashes(n){
  const { x, y, r } = stageCentre();
  for(let i = 0; i < n; i++){
    if(!reduced()){
      const el = document.createElement('div');
      el.className = 'slash';
      const a = (i % 2 ? 148 : 32) + (Math.random() * 34 - 17);
      const w = Math.max(200, Math.min(900, Math.min(r.width, r.height * 1.6) * .8)), h = Math.max(6, Math.round(w / 38));
      el.style.width = w + 'px'; el.style.height = h + 'px';
      el.style.margin = `${-h / 2}px 0 0 ${-w / 2}px`;
      el.style.left = (x + Math.random() * w / 5 - w / 10) + 'px';
      el.style.top = (y + Math.random() * 60 - 30) + 'px';
      el.style.setProperty('--a', a + 'deg');
      $('fx').appendChild(el); setTimeout(() => el.remove(), 420);
    }
    swoosh(); anim($('foePic'), 'hit');
    await wait(n > 3 ? 92 : 118);
  }
}
/* the burst, and the number counting up out of it */
function damageBurst(n, tier){
  const { x, y } = stageCentre();
  if(!reduced()){
    const b = document.createElement('div');
    /* big enough that the number sits inside the star, not beside it */
    b.className = 'boom'; b.style.left = x + 'px'; b.style.top = y + 'px';
    b.style.width = b.style.height = (120 + tier * 34) + 'px';
    $('fx').appendChild(b); setTimeout(() => b.remove(), 700);
  }
  const t = document.createElement('div');
  t.className = 'dmgnum'; t.style.left = x + 'px'; t.style.top = y + 'px';
  t.textContent = '0'; $('fx').appendChild(t);
  const ms = reduced() ? 1 : 420, t0 = performance.now();
  (function step(now){
    const k = Math.min(1, (now - t0) / ms);
    t.textContent = fmt(Math.round(n * (1 - Math.pow(1 - k, 3))));
    if(k < 1) requestAnimationFrame(step);
    else { t.textContent = fmt(n); t.classList.add('out'); setTimeout(() => t.remove(), 700); }
  })(t0);
}
function claws(){
  if(reduced()) return;
  const r = $('heroBox').getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const fl = document.createElement('div'); fl.className = 'redflash';
  $('fx').appendChild(fl); setTimeout(() => fl.remove(), 460);
  [-1, 0, 1].forEach((k, i) => {
    const c = document.createElement('div'); c.className = 'claw';
    c.style.left = (cx + k * 32) + 'px'; c.style.top = (cy - 10 + k * 9) + 'px';
    c.style.animationDelay = (i * 45) + 'ms';
    $('fx').appendChild(c); setTimeout(() => c.remove(), 700);
  });
}

/* ---------- the turn ---------- */
async function doRoll(){
  if(busy) return;
  busy = true;
  started = true;
  commitPick();
  if(!liveIdx().length){
    if(hasRule('nohot')){
      banner('No hot dice', 'Its rule ends your turn');
      deadthud(); await wait(1200);
      return doStrike(true);
    }
    hotDice();
  }
  await rollDice();
  if(isFarkle(facesOf(rollIdx()))) await farkle();
  else {
    $('windNote').textContent = 'Set aside what scores, then roll or strike.';
    busy = false; renderDice();
  }
}
function commitPick(){
  const add = pickScore();
  if(!add) return;
  const ones = pickIdx().filter(i => D[i].f === 1).length;
  wind += add + (hasCharm('knuckle') ? 50 * ones : 0) - (hasRule('ones') ? 50 * ones : 0);
  if(wind < 0) wind = 0;
  pickIdx().forEach(i => D[i].where = 'locked');
  placeDice();
}
/* all six scored, so all six come back and the wind-up carries on */
function hotDice(){
  D.forEach(d => { d.where = 'live'; d.el.classList.add('hot'); });
  placeDice();
  banner('Hot dice!', 'All six come back');
  [0, 1, 2, 3].forEach(k => tone(660 * Math.pow(1.26, k), .15, 'triangle', .06, k * .07));
}

/* ---------- a strike: the blow you wound up actually lands ---------- */
const STRIKE_TIERS = [
  [0,   'Hit!'],
  [.6,  'Solid hit!'],
  [1.2, 'Brutal!'],
  [2,   'Devastating!'],
  [4,   'Legendary!']
];
const strikeTier = w => {
  let t = 0;
  STRIKE_TIERS.forEach((x, i) => { if(w / WINDUP_AVG >= x[0]) t = i; });
  return t;
};
function sweepDice(){
  const set = D.filter(d => d.where !== 'live');
  if(reduced() || !set.length) return wait(60);
  const { x, y } = stageCentre();
  set.forEach((d, k) => {
    const r = d.el.getBoundingClientRect();
    d.el.animate([
      { transform:'none', opacity:1 },
      { transform:`translate(${x - r.left - r.width / 2}px, ${y - r.top - r.height / 2}px) scale(.45) rotate(${160 + rnd(220)}deg)`, opacity:0 }
    ], { duration:380, delay:k * 40, easing:'cubic-bezier(.5,0,.75,.2)', fill:'forwards' });
  });
  return wait(380 + set.length * 40);
}
async function doStrike(forced){
  if(busy && !forced) return;
  busy = true;
  commitPick();
  const w = wind + bankBonus(), tier = strikeTier(w), dmg = strikeDamage(w);
  if(dmg > (S.bestHit || 0)) S.bestHit = dmg;
  $('rollBtn').disabled = $('strikeBtn').disabled = true;
  $('windNote').textContent = '';
  await sweepDice();
  banner(STRIKE_TIERS[tier][1], `Wind-up ${fmt(w)}`);
  await slashes(tier + 1);

  const f = S.fight, absorbed = Math.min(f.block, dmg);
  f.block -= absorbed; f.hp -= dmg - absorbed;
  damageBurst(dmg - absorbed, tier);
  if(absorbed) pop($('foeBlock'), `${fmt(absorbed)} blocked`, 'b');
  knock(0, 1.3);
  if(tier >= 2){ bigBoom(tier); shake(tier >= 3 ? 3 : 2); }
  else if(dmg - absorbed >= f.max * .25) shake(1);
  setFoeBars();
  await wait(820);

  if(f.hp <= 0) return won();
  await foeTurn();
  if(S.hp <= 0) return lost();
  busy = false;
  newTurn();
}

/* ---------- a farkle: your guard drops and it hits you ---------- */
async function farkle(){
  if(hasPerk('second') && !S.usedSecond && wind > 0){
    S.usedSecond = true;
    banner('Second wind!', `You keep ${fmt(wind)}`);
    [0,1,2].forEach(k => tone(520 * Math.pow(1.22, k), .16, 'triangle', .06, k * .08));
    await wait(1100);
    hotDice();
    await rollDice();
    if(isFarkle(facesOf(rollIdx()))) return farkle();
    $('windNote').textContent = 'Set aside what scores, then roll or strike.';
    busy = false; renderDice();
    return;
  }
  D.filter(d => d.where === 'live').forEach(d => d.el.classList.add('shiver'));
  deadthud();
  banner('Farkle!', wind ? `You lose ${fmt(wind)}` : 'Nothing scored');
  $('windNote').innerHTML = '<b>Farkle.</b> The wind-up is gone.';
  wind = 0; renderWind();
  await wait(900);
  if(hasCharm('bone') && !S.usedBone){
    S.usedBone = true;
    banner('The bone charm holds', 'It does not get its hit in');
    tone(1046.5, .3, 'sine', .05);
    await wait(1100);
  } else await foeTurn(FARKLE_MULT * (hasRule('double') ? 2 : 1));
  if(S.hp <= 0) return lost();
  busy = false;
  newTurn();
}

/* ---------- the monster's move ----------
   Exactly one a turn, either way: after a strike it takes its scheduled move,
   and on a farkle it simply hits you, harder. */
async function foeTurn(farkleMult){
  const f = S.fight, d = f.d;
  const mv = farkleMult ? { k:'atk', n:Math.round(d.moves.filter(m => m.k === 'atk')
      .reduce((a, b) => a + b.n, 0) / Math.max(1, d.moves.filter(m => m.k === 'atk').length) * farkleMult) }
    : d.moves[f.mv % d.moves.length];
  await wait(220);
  if(mv.k === 'atk'){
    const hitMs = playFoeAttack();
    if(!hitMs){ anim($('foePic'), 'lunge'); swoosh(); }
    await wait(hitMs || 320);
    swoosh(); claws();
    const after = Math.max(1, Math.round(takeFrom(mv.n) * (S.ironskin ? .5 : 1)));
    const absorbed = Math.min(S.block, after); S.block -= absorbed;
    const dmg = Math.max(0, after - absorbed);
    S.hp = Math.max(0, S.hp - dmg);
    if(dmg > 0) S.tookHit = true;
    if(absorbed) pop($('myBlock'), `${fmt(absorbed)} blocked`, 'b');
    if(dmg > 0){
      setMyBars(); anim($('heroBox'), 'flash'); deadthud();
      const r = $('heroBox').getBoundingClientRect();
      const t = document.createElement('div');
      t.className = 'hurtnum'; t.textContent = '-' + fmt(dmg);
      t.style.left = (r.left + r.width / 2) + 'px'; t.style.top = (r.top + r.height / 2) + 'px';
      $('fx').appendChild(t); setTimeout(() => t.remove(), 1300);
      shake(farkleMult ? 2 : 1);
    } else tone(900, .1, 'square', .04);
  } else if(mv.k === 'blk'){
    f.block += mv.n; anim($('foePic'), 'shieldglow');
    banner('It raises its guard', `Blocks ${fmt(mv.n)} of your next strike`);
    tone(500, .16, 'square', .04);
  } else {
    const before = f.hp; f.hp = Math.min(f.max, f.hp + mv.n);
    anim($('foePic'), 'healglow');
    banner('It heals itself', `+${fmt(f.hp - before)} health`);
    tone(700, .2, 'sine', .05);
  }
  if(!farkleMult) f.mv++;
  if(hasRule('guard') && mv.k !== 'blk'){
    f.block += Math.round(turnDamage(d.lvl) * GUARD_SHARE * .6);
    anim($('foePic'), 'shieldglow');
  }
  setFoeBars(); setMyBars();
  await wait(520);
}

function newTurn(){
  wind = 0; started = false; busy = false;
  S.block = hasCharm('cup') ? 20 : 0;
  D.forEach(d => {
    d.where = 'live';
    d.el.getAnimations().forEach(a => a.cancel());
    d.el.classList.remove('shiver', 'hot');
    d.el.style.opacity = ''; d.el.style.transform = '';
  });
  placeDice();
  $('windNote').textContent = 'Tap Roll to start.';
}

/* ---------- how a fight starts ---------- */
const ENC = {
  ambush:{ title:'Ambush!',           text:'It jumped you out of the dark.' },
  spot:  { title:'You spot it first', text:'It has not seen you yet.' },
  path:  { title:'Blocked',           text:'It will not let you past.' },
  boss:  { title:'',                  text:'It guards the way forward.' }
};
const SAY = {
  ambush:['Gotcha!','Fresh meat!','Surprise, hero!'],
  path:['You shall not pass.','Turn back, little hero.','This path is mine.'],
  boss:['Your quest ends here.','You will go no further.','Turn back, or fall like the others.']
};
const pick = a => a[rnd(a.length)];

/* a typed line, so it arrives rather than just being there */
let typer = null;
function typeInto(el, text, speed = 26){
  clearInterval(typer);
  if(!el) return;
  if(reduced()){ el.textContent = text; return; }
  let n = 0;
  el.textContent = '';
  typer = setInterval(() => {
    if(!document.body.contains(el)){ clearInterval(typer); return; }
    el.textContent = text.slice(0, ++n);
    if(n >= text.length) clearInterval(typer);
  }, speed);
}

function tapeHTML(d){
  const mine = Math.round(WINDUP_AVG * lvlMult(S.level) * atkMult());
  const theirs = d.moves.filter(m => m.k === 'atk');
  const hit = Math.round(theirs.reduce((a, b) => a + b.n, 0) / Math.max(1, theirs.length));
  return `<div class="tape">
    <span class="who">You</span><span class="mid"></span><span class="who r">It</span>
    <b class="mine">${fmt(S.hp)}</b><span class="mid">Health</span><b class="theirs">${fmt(d.hp)}</b>
    <b class="mine">${fmt(armored(mine, d))}</b><span class="mid">A normal blow</span><b class="theirs">${fmt(takeFrom(hit))}</b>
    <b class="mine">+${defense()}</b><span class="mid">Armor</span><b class="theirs">+${foeArmor(d)}</b>
  </div>`;
}

function fightIntro(){
  const d = S.fight.d;
  const kind = d.boss ? 'boss' : ['ambush','spot','path'][rnd(3)];
  S.enc = kind;
  const t = ENC[kind];
  const title = kind === 'boss' ? `The ${d.name}!` : t.title;
  const line = kind === 'spot' ? 'It has not seen me.' : pick(SAY[kind] || SAY.path);
  openPanel(`
    <div class="scene">
      <img class="bg" src="art/${bgOf()}.webp" alt="">
      <img class="foe" src="art/${d.slug}.webp" alt="${d.name}">
      <span class="tag">${title}</span>
      ${kind === 'spot' ? '<span class="mark">?</span>' : ''}
    </div>
    <div class="say ${kind === 'spot' ? 'you' : ''}" id="encSay"></div>

    <p id="encCap"></p>

  setTimeout(() => typeInto($('encCap'), t.text, 18), 1100);
  if(kind === 'ambush') setTimeout(() => { deadthud(); shake(); }, 300);
  if(kind === 'boss') setTimeout(() => shake(2), 450);

/* ---------- the end of a fight ---------- */
function won(){
  busy = true;
  const d = S.fight.d;
  const flawless = !S.tookHit, clutch = S.hp <= S.maxHp * .12;
  banner('Victory!', `The ${d.name} is down`);
  anim($('foePic'), 'hit');
  [0,1,2,3].forEach(k => tone([523.25,659.25,783.99,1046.5][k], k === 3 ? .6 : .14, 'triangle', .06, k * .13));
  const bonus = flawless ? d.gold : 0;
  S.gold += d.gold + bonus + (hasCharm('purse') ? 3 : 0);
  S.xp += Math.round(d.xp * (hasPerk('study') ? 1.25 : 1));
  S.wins++;
  if(!S.best || S.bestHit > (S.best || 0)) S.best = S.bestHit || S.best;
  setMyBars();
  setTimeout(() => victoryPanel(d, { flawless, clutch, bonus }), 1500);
}
function victoryPanel(d, mood){
  const oldLv = S.level, oldXp = S.xp - Math.round(d.xp * (hasPerk('study') ? 1.25 : 1));
  while(S.xp >= cumNeed(S.level)) levelUp();
  openPanel(`<div class="vic">
    <div class="vic-title">Victory!</div>
    ${mood.flawless ? `<div class="vic-tag"><b>Flawless</b><span>Not a scratch &middot; double gold</span></div>`
      : mood.clutch ? `<div class="vic-tag"><b>Clutch</b><span>Won by a hair</span></div>` : ''}
    <div class="vic-foe"><img src="art/dead_${d.slug}.webp" alt="${d.name}, defeated"></div>
    <div class="vic-sub">You brought down the <b>${d.name}</b>.</div>
    <div class="loot">
      <div class="purse"><img src="art/i_coin.webp" alt=""><div><small>Gold</small><b id="vGold">${fmt(S.gold - d.gold - mood.bonus)}</b></div></div>
      <div class="xpwrap">
        <div class="xphead"><span>+${fmt(Math.round(d.xp * (hasPerk('study') ? 1.25 : 1)))} experience</span><span id="vLv">Level ${oldLv}</span></div>
        <div class="xpbar"><i id="vXp"></i><span id="vXpTxt"></span></div>
      </div>
    </div>
    <div class="hpbar" style="height:20px"><i style="width:${Math.max(0, S.hp / S.maxHp * 100)}%"></i><span>HP ${fmt(S.hp)} / ${fmt(S.maxHp)}</span></div>
    <button class="btn big" data-act="onward">${S.pendingLv ? 'Level up!' : 'Onward'}</button>
  </div>`);
  countTo($('vGold'), S.gold - d.gold - mood.bonus, S.gold, 900, 300);
  xpFill(oldLv, oldXp, 500);
  if(mood.flawless || mood.clutch) setTimeout(() => { deadthud(); tone(523.25, .5, 'triangle', .05, .1); }, 300);
}
/* a number that arrives rather than appearing */
function countTo(el, from, to, ms, delay = 0){
  if(!el) return;
  if(reduced()){ el.textContent = fmt(to); return; }
  setTimeout(() => {
    const t0 = performance.now();
    (function step(now){
      const k = Math.min(1, (now - t0) / ms);
      el.textContent = fmt(Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3))));
      if(k < 1) requestAnimationFrame(step); else el.textContent = fmt(to);
    })(t0);
  }, delay);
}
function xpFill(oldLv, oldXp, delay){
  const base = cumNeed(oldLv - 1) || 0, need = xpNeed(oldLv);
  const from = Math.max(0, Math.min(1, (oldXp - base) / need));
  const to = S.level > oldLv ? 1 : Math.max(0, Math.min(1, (S.xp - base) / need));
  const bar = $('vXp'), txt = $('vXpTxt');
  if(!bar) return;
  bar.style.width = (from * 100) + '%';
  if(txt) txt.textContent = `${fmt(Math.max(0, S.xp - base))} / ${fmt(need)}`;
  setTimeout(() => {
    bar.style.width = (to * 100) + '%';
    if(S.level > oldLv) setTimeout(() => {
      const l = $('vLv'); if(l) l.textContent = `Level ${S.level}`;
      tone(1046.5, .35, 'triangle', .06);
    }, 900);
  }, delay);
}
function levelUp(){
  S.level++;
  const was = S.maxHp;
  S.maxHp = heroMaxHP(S.level) + (S.bonusHp || 0);
  S.hp = Math.min(S.maxHp, S.hp + (S.maxHp - was));
  S.pendingLv = (S.pendingLv || 0) + 1;
}

/* ---------- level up ---------- */
/* Nothing here touches the scoring block, on purpose: that block has to stay
   pure so the simulators can lift it. A seventh die was the obvious perk and
   is not here either - seven dice across a 320px screen come out at 38px, and
   the dice clearing 44px matters more than any perk. */
const PERKS = [
  {id:'steady', name:'Steady Hand',    icon:'attack', desc:'Every bank is worth 50 more.'},
  {id:'second', name:'Second Wind',    icon:'potion', desc:'Once a fight, a farkle is ignored.'},
  {id:'tough',  name:'Tough as Nails', icon:'heart',  desc:'+40 health, now and every level.'},
  {id:'strong', name:'Strong Arm',     icon:'sword',  desc:'Every strike hits 10% harder.'},
  {id:'gamble', name:"Gambler's Nerve",icon:'coin',   desc:'Over 1,000 hits a quarter harder.'},
  {id:'study',  name:'Quick Study',    icon:'xp',     desc:'A quarter more experience.'}
];
const hasPerk = id => (S.perks || []).indexOf(id) >= 0;
const perkCount = id => (S.perks || []).filter(p => p === id).length;

function levelPanel(){
  const was = heroMaxHP(S.level - 1) + (S.bonusHp || 0);
  const offer = PERKS.slice().sort(() => Math.random() - .5).slice(0, 3);
  openPanel(`
    <div class="eyebrow">You grew stronger</div>
    <h2 style="text-align:center">Level up!</h2>
    <div class="lu-medal"><b>${S.level}</b></div>
    <div class="lu-row"><img class="ico" src="art/i_heart.webp" alt=""><span class="lu-lbl">Health</span>
      <span class="lu-val"><span class="was">${fmt(was)}</span>${fmt(S.maxHp)}</span></div>
    <div class="lu-row"><img class="ico" src="art/i_attack.webp" alt=""><span class="lu-lbl">Every strike</span>
      <span class="lu-val"><span class="was">&times;${lvlMult(S.level - 1).toFixed(2)}</span>&times;${lvlMult(S.level).toFixed(2)}</span></div>
    <p>Pick one.</p>
    <div class="perks">${offer.map(p => `<button class="perk" data-act="perk" data-perk="${p.id}">
      <img class="ico" src="art/i_${p.icon}.webp" alt=""><b>${p.name}</b><span>${p.desc}</span></button>`).join('')}</div>`);
  [0,1,2].forEach(k => tone([523.25,659.25,783.99][k], .18, 'triangle', .055, k * .11));
}
function takePerk(id){
  S.perks = (S.perks || []).concat([id]);
  if(id === 'tough'){ S.bonusHp = (S.bonusHp || 0) + 40; S.maxHp += 40; S.hp += 40; }
  S.pendingLv--;
  setMyBars();
  if(S.pendingLv > 0) levelPanel();
  else shopPanel();
}

function lost(){
  busy = true;
  banner('You have fallen', `The ${S.fight.d.name} brought you down`);
  deadthud();
  S.deaths++;
  setTimeout(() => {
    openPanel(`
      <div class="eyebrow">${curArea().name}</div>
      <h2>You have fallen</h2>
      <div class="scene"><img class="bg" src="art/${bgOf()}.webp" alt="">
        <img class="foe" src="art/${S.fight.d.slug}.webp" alt="${S.fight.d.name}">
        <span class="tag">The ${S.fight.d.name}</span></div>
      <p>You reached <b>level ${S.level}</b> and won <b>${fmt(S.wins)}</b> ${S.wins === 1 ? 'fight' : 'fights'} before it brought you down.</p>
      <button class="btn big" data-act="again">Try again</button>`);
  }, 1600);
}
/* ---------- moving on ----------
   A run is four areas of three fights. Clearing an area opens the next one and
   shows a story beat; clearing the fourth finishes the world and starts the
   next. Past the tenth world it keeps going, deeper each time. */
function nextFight(){
  const wasBoss = isBossStep();
  if(!wasBoss){ S.idx++; return startFight(); }
  if(areaOf() >= 3) return worldDone();
  S.idx++;
  storyPanel(['a1','a2','a3'][areaOf() - 1]);
}
function worldDone(){
  const beats = worldOf().story.end;
  S.endBeat = 0;
  storyPanel('end');
}
function storyPanel(key){
  const w = worldOf();
  const beat = key === 'end' ? w.story.end[S.endBeat || 0]
             : key === 'start' ? w.intro[S.introBeat || 0]
             : w.story[key];
  const art = key === 'end' ? `art/sc_${w.id === 'w1' ? '' : w.id + '_'}end_${Math.min(S.endBeat || 0, 1)}.webp`
            : key === 'start' ? `art/sc_${w.id === 'w1' ? '' : w.id + '_'}start_${Math.min(S.introBeat || 0, 1)}.webp`
            : `art/sc_${w.id === 'w1' ? '' : w.id + '_'}${key}_0.webp`;
  const more = key === 'end' ? (S.endBeat || 0) < w.story.end.length - 1
             : key === 'start' ? (S.introBeat || 0) < w.intro.length - 1 : false;
  openPanel(`
    <div class="eyebrow">${worldName(S.world || 0)}</div>
    <div class="scene"><img class="bg" src="${art}" alt="" onerror="this.src='art/${bgOf()}.webp'">
      <span class="tag">${beat.title}</span></div>
    <p id="storyText"></p>
    <button class="btn big" data-act="storyNext" data-key="${key}">${more ? 'Go on' : key === 'end' ? 'Onward' : 'Carry on'}</button>`);
  typeInto($('storyText'), beat.text, 14);
}
function storyNext(key){
  const w = worldOf();
  clearInterval(typer);
  if(key === 'start'){
    S.introBeat = (S.introBeat || 0) + 1;
    if(S.introBeat < w.intro.length) return storyPanel('start');
    S.introBeat = 0; closePanel(); return startFight();
  }
  if(key === 'end'){
    S.endBeat = (S.endBeat || 0) + 1;
    if(S.endBeat < w.story.end.length) return storyPanel('end');
    S.endBeat = 0;
    S.world = (S.world || 0) + 1;
    S.idx = 0; S.introBeat = 0;
    closePanel();
    return storyPanel('start');
  }
  closePanel(); startFight();
}

/* ===================== what you can buy =====================
   Gear is the card game's own table, so the icons and the numbers match.
   Charms are Farkle's own, and they are where the dice flavour lives. All of
   them are passive on purpose: an active charm would want a button on the
   fight screen, and at 320 wide that row is already spoken for. */
const CHARMS = [
  {id:'whet',    name:'Whetstone',        icon:'axe',      price:14, desc:'+100 to every wind-up you bank.'},
  {id:'knuckle', name:'Lucky Knuckle',    icon:'coin',     price:16, desc:'Every 1 you set aside is worth 50 more.'},
  {id:'bone',    name:'Bone Charm',       icon:'skull',    price:18, desc:'The first farkle of a fight does no damage.'},
  {id:'cup',     name:'Iron Cup',         icon:'ironskin', price:14, desc:'Start every turn with 20 guard.'},
  {id:'ring',    name:"Gambler's Ring",   icon:'chest',    price:20, desc:'Over 1,000 hits a quarter harder.'},
  {id:'purse',   name:"Merchant's Purse", icon:'bag',      price:12, desc:'+3 gold after every fight.'}
];
const CH = Object.fromEntries(CHARMS.map(c => [c.id, c]));
const hasCharm = id => (S.charms || []).indexOf(id) >= 0;

const POTIONS = [
  {id:'heal', name:'Healing Potion',   icon:'potion',   price:5, desc:'Back on your feet: heal 35%.'},
  {id:'iron', name:'Iron Skin Potion', icon:'ironskin', price:5, desc:'Half of every hit bounces off, all fight.'},
  {id:'rage', name:'Rage Potion',      icon:'rage',     price:6, desc:'Every strike hits half again as hard, all fight.'}
];
const PO = Object.fromEntries(POTIONS.map(p => [p.id, p]));
const POT_SLOTS = 3;

const REST_PRICE = 4, REST_SHARE = .5;

/* ---------- the merchant ---------- */
const TABS = [['rest','Rest'], ['smith','Smith'], ['charms','Charms'], ['pots','Potions']];
function shopPanel(tab){
  S.shopTab = tab || S.shopTab || 'rest';
  const t = S.shopTab;
  openPanel(`
    <h2>The merchant</h2>
    <div class="purse-line"><img src="art/i_coin.webp" alt="">${fmt(S.gold)} gold</div>
    <div class="tabs">${TABS.map(([k, n]) =>
      `<button class="tab ${k === t ? 'on' : ''}" data-act="shopTab" data-tab="${k}">${n}</button>`).join('')}</div>
    <div class="buys">${
      t === 'rest'   ? restHTML() :
      t === 'smith'  ? smithHTML() :
      t === 'charms' ? charmsHTML() : potsHTML()}</div>
    <button class="btn big" data-act="leaveShop">Onward</button>`);
}
function restHTML(){
  const heal = Math.round(S.maxHp * REST_SHARE);
  const full = S.hp >= S.maxHp;
  return `<div class="hpbar"><i style="width:${Math.max(0, S.hp / S.maxHp * 100)}%"></i><span>HP ${fmt(S.hp)} / ${fmt(S.maxHp)}</span></div>
    <button class="buy" data-act="rest" ${full || S.gold < REST_PRICE ? 'disabled' : ''}>
      <img class="ico" src="art/i_inn.webp" alt=""><b>Rest by the fire</b>
      <span>${full ? 'You are already in good shape.' : `Heal ${fmt(Math.min(heal, S.maxHp - S.hp))} health.`}</span>
      <span class="cost"><img src="art/i_coin.webp" alt="">${REST_PRICE}</span></button>
    ${(S.charms || []).length ? `<p class="menu-note">Charms you carry:</p><div class="charmrow">${
      (S.charms || []).map(id => `<img src="art/i_${CH[id].icon}.webp" alt="${CH[id].name}" title="${CH[id].name}">`).join('')
    }</div>` : ''}`;
}
const SLOT_ORDER = [['main','Weapon'], ['off','Second weapon'], ['shield','Shield'], ['helm','Helmet'], ['armor','Armor']];
function smithHTML(){
  const cap = Math.min(5, 1 + Math.floor(S.level / 2));
  return SLOT_ORDER.map(([slot, label]) => {
    const have = S.eq[slot];
    const type = slot === 'main' ? (have ? have.type : (S.level >= 3 ? 'axe' : 'sword'))
               : slot === 'off' ? 'dagger' : slot;
    const tier = (have ? have.tier : 0) + 1;
    if(tier > cap) return `<button class="buy owned" disabled><img class="ico" src="art/i_eq_${type}_${Math.max(1, tier - 1)}.webp" alt="">
      <b>${have ? eqName(have.type, have.tier) : label}</b><span>Best you can carry at level ${S.level}.</span>
      <span class="cost">Yours</span></button>`;
    const e = EQUIP[type], price = e.price[tier];
    const gain = e.atk ? `+${e.atk[tier]} Attack${e.hands === 2 ? ', two hands' : ''}` : `+${e.def[tier]} Defense`;
    return `<button class="buy" data-act="buyEq" data-slot="${slot}" data-type="${type}" data-tier="${tier}"
        ${S.gold < price ? 'disabled' : ''}>
      <img class="ico" src="art/i_eq_${type}_${tier}.webp" alt="">
      <b>${eqName(type, tier)}</b><span>${gain}${have ? ` &middot; was ${eqName(have.type, have.tier)}` : ''}</span>
      <span class="cost"><img src="art/i_coin.webp" alt="">${price}</span></button>`;
  }).join('');
}
/* Three at a time, not all six. Six rows cannot fit a 320x568 screen without
   scrolling, and no popup may need scrolling - but the better reason is that
   three is a choice and six is a catalog. The three hold still for a visit and
   change when you move on. */
const CHARM_OFFER = 3;
function charmOffer(){
  const left = CHARMS.filter(c => !hasCharm(c.id));
  if(!S.charmOffer || !S.charmOffer.length || S.charmOffer.some(id => hasCharm(id)))
    S.charmOffer = left.slice().sort(() => Math.random() - .5).slice(0, CHARM_OFFER).map(c => c.id);
  return S.charmOffer.map(id => CH[id]).filter(Boolean);
}
function charmsHTML(){
  const offer = charmOffer();
  if(!offer.length) return `<p class="menu-note">You have every charm the merchant had.</p>`;
  return offer.map(c => `<button class="buy" data-act="buyCharm" data-charm="${c.id}" ${S.gold < c.price ? 'disabled' : ''}>
        <img class="ico" src="art/i_${c.icon}.webp" alt=""><b>${c.name}</b><span>${c.desc}</span>
        <span class="cost"><img src="art/i_coin.webp" alt="">${c.price}</span></button>`).join('')
    + ((S.charms || []).length ? `<p class="menu-note">Already yours:</p><div class="charmrow">${
        (S.charms || []).map(id => `<img src="art/i_${CH[id].icon}.webp" alt="${CH[id].name}" title="${CH[id].name}">`).join('')
      }</div>` : '');
}
function potsHTML(){
  const full = (S.pots || []).length >= POT_SLOTS;
  return POTIONS.map(p => `<button class="buy" data-act="buyPot" data-pot="${p.id}"
      ${S.gold < p.price || full ? 'disabled' : ''}>
      <img class="ico" src="art/i_${p.icon}.webp" alt=""><b>${p.name}</b>
      <span>${full ? 'You cannot carry any more.' : p.desc}</span>
      <span class="cost"><img src="art/i_coin.webp" alt="">${p.price}</span></button>`).join('')
    + `<p class="menu-note">You can carry ${POT_SLOTS} potions. You have ${(S.pots || []).length}.</p>`;
}
function spend(n){ S.gold -= n; coinSound(); }
const coinSound = () => { tone(1568, .08, 'triangle', .05); tone(2093, .12, 'triangle', .05, .07); tone(1760, .1, 'triangle', .04, .14); };

/* ---------- potions in a fight ---------- */
function renderPots(){
  const row = $('potRow'), pots = S.pots || [];
  row.hidden = !pots.length;
  if(!pots.length){ row.innerHTML = ''; return; }
  const seen = {};
  pots.forEach(id => seen[id] = (seen[id] || 0) + 1);
  row.innerHTML = Object.keys(seen).map(id => `<button class="pot" data-act="drink" data-pot="${id}"
      aria-label="Drink ${PO[id].name}" ${busy || !S.fight ? 'disabled' : ''}>
      <img src="art/i_${PO[id].icon}.webp" alt="">${seen[id] > 1 ? `<i>${seen[id]}</i>` : ''}</button>`).join('')
    + (S.ironskin ? `<span class="chip blk">Iron skin</span>` : '')
    + (S.rage ? `<span class="chip hit">Rage</span>` : '');
}
function drink(id){
  const pots = S.pots || [], at = pots.indexOf(id);
  if(at < 0 || busy) return;
  pots.splice(at, 1);
  if(id === 'heal'){
    const n = Math.min(S.maxHp - S.hp, Math.round(S.maxHp * .35));
    S.hp += n; pop($('heroBox'), `+${fmt(n)} health`, 'h'); tone(700, .25, 'sine', .06);
  } else if(id === 'iron'){ S.ironskin = true; pop($('heroBox'), 'Iron skin', 'b'); tone(420, .3, 'square', .05); }
  else { S.rage = true; pop($('heroBox'), 'Rage', 'p'); tone(180, .3, 'sawtooth', .07); }
  setMyBars(); renderPots(); renderWind();
}

buildTray();
storyPanel('start');

window.__FK = { phoneCSSLive, store, openPanel, closePanel, toast,
  get D(){ return D; }, get wind(){ return wind; }, get S(){ return S; },
  rollDice, doRoll, doStrike, newTurn, startFight, scoreOf, bestSplit, isFarkle, facesOf, rollIdx,
  setFaces(fs){ fs.forEach((f, i) => { D[i].f = f; D[i].where = 'live'; paintFace(D[i].el, f); }); started = true; placeDice(); } };
})();
</script>
