<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Axes &amp; Aces — exports</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Eczar:wght@700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
body{font-family:'Oswald',sans-serif;display:grid;place-items:center;width:100vw;height:100vh;overflow:hidden}
.pane{display:none}
body[data-v="wide"] #wide,body[data-v="banner"] #banner,body[data-v="icon"] #icon,body[data-v="mask"] #mask,body[data-v="small"] #small{display:grid;place-items:center}

/* ---- shared pieces, lifted from logo4.html ---- */
.word{position:relative;display:inline-block;line-height:.9;white-space:nowrap}
.word .lyr{display:block}
.word .out{position:absolute;inset:0;-webkit-text-stroke:15px #0e0702;color:#0e0702;z-index:0}
.word .face{position:relative;z-index:2;color:transparent;-webkit-background-clip:text;background-clip:text;
  background-image:linear-gradient(180deg,#fffaea 0%,#ffe8a8 13%,#f3c75f 32%,#dc9f31 50%,#9c6318 68%,#6b400f 83%,#dca93f 100%)}
.word .lip{position:absolute;inset:0;transform:translateY(-3px);z-index:3;color:transparent;
  -webkit-background-clip:text;background-clip:text;opacity:.52;
  background-image:linear-gradient(180deg,#fffdf4 0%,#fff4cf 14%,transparent 30%)}
.ecz{font-family:'Eczar',serif;font-weight:800;letter-spacing:.01em}

.ace{position:relative;flex:none;border-radius:12px;overflow:hidden;
  background-image:linear-gradient(162deg,#fffdf6 0%,#f8f1df 52%,#eadfc4 100%);
  box-shadow:0 14px 26px rgba(0,0,0,.8),0 0 0 4px #14100a,inset 0 0 0 2px rgba(0,0,0,.07)}
.ace .pip{position:absolute;inset:0;display:grid;place-items:center;color:#c0241c;
  font-family:'Segoe UI Symbol','Apple Symbols',serif;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.ace .ix{position:absolute;line-height:.76;text-align:center;color:#c0241c;font-family:'Eczar',serif;font-weight:800}
.ace .ix i{display:block;font-style:normal;font-family:'Segoe UI Symbol','Apple Symbols',serif;margin-top:2px}
.ace .ix.tl{top:7%;left:9%}
.ace .ix.br{bottom:7%;right:9%;transform:rotate(180deg)}
.axe img{display:block;filter:drop-shadow(0 10px 16px rgba(0,0,0,.85))}

/* A - the plaque */
.bar{position:relative;display:flex;align-items:center;gap:26px;padding:24px 42px 28px;border-radius:14px;
  background-image:linear-gradient(180deg,#352513 0%,#1f1409 46%,#120b05 100%);
  border:7px solid #0c0603;
  box-shadow:0 14px 0 -3px #080402,0 26px 46px rgba(0,0,0,.85),inset 0 2px 0 rgba(255,214,130,.2)}
.bar.notag{padding:20px 34px;gap:20px}
.bar .mid{display:flex;flex-direction:column;align-items:center}
.tag{margin-top:9px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;font-size:12px;
  color:#7fe3d4;text-shadow:0 2px 0 #05201c}

/* B - the emblem */
.emb{position:relative;display:grid;place-items:center}
.emb .ace{transform:translate(-14px,6px) rotate(-9deg)}
.emb .axe{position:absolute;left:50%;top:50%;transform:translate(-42%,-44%) rotate(-28deg);z-index:3}

.stage{background-image:radial-gradient(ellipse at 50% 42%,#2c1f15 0%,#160f09 58%,#0a0604 100%)}
</style></head>
<body>

<!-- A, no tagline: the hero + nav wordmark -->
<div class="pane" id="wide">
  <div class="bar notag" id="m-wide">
    <div class="axe"><img src="../../art/i_eq_axe_5.webp" width="158" alt=""></div>
    <div class="mid">
      <span class="word ecz" style="font-size:64px"><span class="lyr out">AXES</span><span class="lyr face">AXES</span><span class="lyr lip">AXES</span></span>
      <span class="word ecz" style="font-size:64px;margin-top:-2px"><span class="lyr out">&amp; ACES</span><span class="lyr face">&amp; ACES</span><span class="lyr lip">&amp; ACES</span></span>
    </div>
    <div class="ace" style="width:124px;height:184px;transform:rotate(7deg)">
      <span class="ix tl" style="font-size:22px">A<i style="font-size:15px">&hearts;</i></span>
      <span class="ix br" style="font-size:22px">A<i style="font-size:15px">&hearts;</i></span>
      <span class="pip" style="font-size:58px">&hearts;</span>
    </div>
  </div>
</div>

<!-- A, full, on the stage: share card and store banner -->
<div class="pane stage" id="banner" style="width:100vw;height:100vh">
  <div class="bar" style="transform:scale(1.42)">
    <div class="axe"><img src="../../art/i_eq_axe_5.webp" width="158" alt=""></div>
    <div class="mid">
      <span class="word ecz" style="font-size:64px"><span class="lyr out">AXES</span><span class="lyr face">AXES</span><span class="lyr lip">AXES</span></span>
      <span class="word ecz" style="font-size:64px;margin-top:-2px"><span class="lyr out">&amp; ACES</span><span class="lyr face">&amp; ACES</span><span class="lyr lip">&amp; ACES</span></span>
      <div class="tag">Fight monsters with poker hands</div>
    </div>
    <div class="ace" style="width:124px;height:184px;transform:rotate(7deg)">
      <span class="ix tl" style="font-size:22px">A<i style="font-size:15px">&hearts;</i></span>
      <span class="ix br" style="font-size:22px">A<i style="font-size:15px">&hearts;</i></span>
      <span class="pip" style="font-size:58px">&hearts;</span>
    </div>
  </div>
</div>

<!-- B, the emblem: app icon -->
<div class="pane stage" id="icon" style="width:100vw;height:100vh">
  <div class="emb" style="width:512px;height:512px;transform:translateY(-12px) scale(.93)">
    <div class="ace" style="width:272px;height:406px">
      <span class="ix tl" style="font-size:44px">A<i style="font-size:30px">&hearts;</i></span>
      <span class="ix br" style="font-size:44px">A<i style="font-size:30px">&hearts;</i></span>
    </div>
    <div class="axe"><img src="../../art/i_axe.webp" width="466" alt=""></div>
  </div>
</div>

<!-- B, cropped in: the small emblem for the two header bars -->
<div class="pane stage" id="small" style="width:100vw;height:100vh">
  <div class="emb" style="width:512px;height:512px;transform:translateY(-6px) scale(1.30)">
    <div class="ace" style="width:272px;height:406px">
      <span class="ix tl" style="font-size:44px">A<i style="font-size:30px">&hearts;</i></span>
      <span class="ix br" style="font-size:44px">A<i style="font-size:30px">&hearts;</i></span>
    </div>
    <div class="axe"><img src="../../art/i_axe.webp" width="466" alt=""></div>
  </div>
</div>

<!-- B again, pulled in for the maskable safe zone -->
<div class="pane stage" id="mask" style="width:100vw;height:100vh">
  <div class="emb" style="width:512px;height:512px;transform:translateY(-12px) scale(.66)">
    <div class="ace" style="width:272px;height:406px">
      <span class="ix tl" style="font-size:44px">A<i style="font-size:30px">&hearts;</i></span>
      <span class="ix br" style="font-size:44px">A<i style="font-size:30px">&hearts;</i></span>
    </div>
    <div class="axe"><img src="../../art/i_axe.webp" width="466" alt=""></div>
  </div>
</div>

<script>
document.body.dataset.v = (location.hash||'#wide').slice(1);
</script>
</body></html>
