<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Axes &amp; Aces — final lockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Eczar:wght@700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:860px;background:#0b0705;padding:22px;font-family:'Oswald',sans-serif}
.cell{margin-bottom:22px}
.stage{position:relative;border-radius:12px;display:grid;place-items:center;overflow:hidden;
  background-image:radial-gradient(ellipse at 50% 42%,#2c1f15 0%,#160f09 58%,#0a0604 100%)}
.cap{margin-top:8px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:11px;color:#7e6c52}
.cap b{color:#c9a961}

.word{position:relative;display:inline-block;line-height:.9;white-space:nowrap}
.word .lyr{display:block}
.word .out{position:absolute;inset:0;-webkit-text-stroke:15px #0e0702;color:#0e0702;z-index:0}
.word .face{position:relative;z-index:2;color:transparent;-webkit-background-clip:text;background-clip:text;
  background-image:linear-gradient(180deg,#fffaea 0%,#ffe8a8 13%,#f3c75f 32%,#dc9f31 50%,#9c6318 68%,#6b400f 83%,#dca93f 100%)}
.word .lip{position:absolute;inset:0;transform:translateY(-3px);z-index:3;color:transparent;
  -webkit-background-clip:text;background-clip:text;opacity:.52;
  background-image:linear-gradient(180deg,#fffdf4 0%,#fff4cf 14%,transparent 30%)}
.ecz{font-family:'Eczar',serif;font-weight:800;letter-spacing:.01em}

/* the ace, on the game's own card face. indices sit on the cream field,
   not on the filigree, or they vanish into the border. */
.ace{position:relative;flex:none;border-radius:10px;overflow:hidden;background:#f3ead3;
  box-shadow:0 14px 26px rgba(0,0,0,.8),0 0 0 3px #1a120a}
.ace img{display:block;width:100%;height:100%;object-fit:fill}
.ace .pip{position:absolute;inset:0;display:grid;place-items:center;color:#171009;
  font-family:'Segoe UI Symbol','Apple Symbols',serif;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.ace .ix{position:absolute;line-height:.78;text-align:center;color:#171009;font-family:'Eczar',serif;font-weight:800}
.ace .ix i{display:block;font-style:normal;font-family:'Segoe UI Symbol','Apple Symbols',serif;margin-top:1px}
.ace .ix.tl{top:15%;left:15%}
.ace .ix.br{bottom:15%;right:15%;transform:rotate(180deg)}
.axe img{display:block;filter:drop-shadow(0 10px 16px rgba(0,0,0,.85))}

/* ---------- A · primary horizontal lockup ---------- */
.bar{position:relative;display:flex;align-items:center;gap:26px;padding:24px 42px 28px;border-radius:14px;
  background-image:linear-gradient(180deg,#352513 0%,#1f1409 46%,#120b05 100%);
  border:7px solid #0c0603;
  box-shadow:0 14px 0 -3px #080402,0 26px 46px rgba(0,0,0,.85),inset 0 2px 0 rgba(255,214,130,.2)}
.bar .mid{display:flex;flex-direction:column;align-items:center}
.tag{margin-top:9px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;font-size:12px;
  color:#7fe3d4;text-shadow:0 2px 0 #05201c}

/* ---------- B · emblem, no words ---------- */
.emb{position:relative;width:330px;height:330px;display:grid;place-items:center}
.emb .ace{width:176px;height:262px;transform:rotate(-7deg)}
.emb .axe{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-28deg);z-index:3}

/* ---------- C · stacked, for a square ---------- */
.sq{position:relative;padding:22px 46px 28px;border-radius:14px;background-color:#393d44;
  background-image:repeating-linear-gradient(103deg,rgba(255,255,255,.045) 0 2px,transparent 2px 9px),
    radial-gradient(ellipse at 50% 0%,#5a616b 0%,#343940 46%,#1a1d22 100%);
  border:7px solid #0e1114;
  box-shadow:0 14px 0 -3px #07090b,0 24px 44px rgba(0,0,0,.8),inset 0 2px 0 rgba(255,255,255,.2);
  display:flex;flex-direction:column;align-items:center;gap:2px}
.rivet{position:absolute;width:14px;height:14px;border-radius:50%;
  background-image:radial-gradient(circle at 34% 30%,#fff3cf,#d7a33f 46%,#6d4210);
  box-shadow:0 2px 2px rgba(0,0,0,.8),inset 0 -2px 2px rgba(0,0,0,.45)}
.rivet.tl{top:10px;left:10px}.rivet.tr{top:10px;right:10px}.rivet.bl{bottom:10px;left:10px}.rivet.br{bottom:10px;right:10px}
.sq .embs{position:relative;width:208px;height:168px;margin-bottom:2px}
.sq .embs .ace{position:absolute;left:50%;top:0;width:104px;height:156px;transform:translateX(-50%) rotate(-7deg);z-index:2}
.sq .embs .axe{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-28deg);z-index:3}
.rule{display:flex;align-items:center;gap:12px;margin:-2px 0}
.rule i{display:block;width:66px;height:3px;border-radius:2px;
  background-image:linear-gradient(90deg,transparent,#b98f3c,transparent)}
.rule span{font-family:'Eczar',serif;font-weight:800;font-size:26px;color:#d7ab4d;text-shadow:0 2px 0 #0e0702}
</style></head>
<body>

<!-- A -->
<div class="cell"><div class="stage" style="height:330px">
  <div class="bar">
    <div class="axe"><img src="../../art/i_eq_axe_5.webp" width="158" alt=""></div>
    <div class="mid">
      <span class="word ecz" style="font-size:64px"><span class="lyr out">AXES</span><span class="lyr face">AXES</span><span class="lyr lip">AXES</span></span>
      <span class="word ecz" style="font-size:64px;margin-top:-2px"><span class="lyr out">&amp; ACES</span><span class="lyr face">&amp; ACES</span><span class="lyr lip">&amp; ACES</span></span>
      <div class="tag">Fight monsters with poker hands</div>
    </div>
    <div class="ace" style="width:124px;height:184px;transform:rotate(7deg)">
      <img src="../../art/card_face.webp" alt="">
      <span class="ix tl" style="font-size:22px">A<i style="font-size:15px">&spades;</i></span>
      <span class="ix br" style="font-size:22px">A<i style="font-size:15px">&spades;</i></span>
      <span class="pip" style="font-size:58px">&spades;</span>
    </div>
  </div>
</div><div class="cap"><b>A</b> · Primary lockup — site header, store banner</div></div>

<!-- B -->
<div class="cell"><div class="stage" style="height:380px">
  <div class="emb">
    <div class="ace">
      <img src="../../art/card_face.webp" alt="">
      <span class="ix tl" style="font-size:28px">A<i style="font-size:19px">&spades;</i></span>
      <span class="ix br" style="font-size:28px">A<i style="font-size:19px">&spades;</i></span>
    </div>
    <div class="axe"><img src="../../art/i_axe.webp" width="300" alt=""></div>
  </div>
</div><div class="cap"><b>B</b> · Emblem — app icon, favicon, no words needed</div></div>

<!-- C -->
<div class="cell"><div class="stage" style="height:470px">
  <div class="sq">
    <i class="rivet tl"></i><i class="rivet tr"></i><i class="rivet bl"></i><i class="rivet br"></i>
    <div class="embs">
      <div class="ace">
        <img src="../../art/card_face.webp" alt="">
        <span class="ix tl" style="font-size:17px">A<i style="font-size:12px">&spades;</i></span>
        <span class="ix br" style="font-size:17px">A<i style="font-size:12px">&spades;</i></span>
      </div>
      <div class="axe"><img src="../../art/i_axe.webp" width="196" alt=""></div>
    </div>
    <span class="word ecz" style="font-size:66px"><span class="lyr out">AXES</span><span class="lyr face">AXES</span><span class="lyr lip">AXES</span></span>
    <div class="rule"><i></i><span>&amp;</span><i></i></div>
    <span class="word ecz" style="font-size:66px"><span class="lyr out">ACES</span><span class="lyr face">ACES</span><span class="lyr lip">ACES</span></span>
  </div>
</div><div class="cap"><b>C</b> · Stacked — square spaces, splash screen</div></div>

</body></html>
