<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Axes &amp; Aces — built from the game's own art</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Eczar:wght@700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:760px;background:#0b0705;padding:20px;font-family:'Oswald',sans-serif}
.cell{margin-bottom:24px}
.stage{position:relative;height:430px;border-radius:12px;display:grid;place-items:center;overflow:hidden;
  background-image:radial-gradient(ellipse at 50% 40%,#2c1f15 0%,#160f09 58%,#0a0604 100%)}
.cap{margin-top:8px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:11px;color:#7e6c52}
.cap b{color:#c9a961}

/* gold letters: black outline, metal face, top lip */
.word{position:relative;display:inline-block;line-height:.9;white-space:nowrap}
.word .lyr{display:block}
.word .out{position:absolute;inset:0;-webkit-text-stroke:15px #0e0702;color:#0e0702;z-index:0}
.word .face{position:relative;z-index:2;color:transparent;-webkit-background-clip:text;background-clip:text;
  background-image:linear-gradient(180deg,#fffaea 0%,#ffe8a8 13%,#f3c75f 32%,#dc9f31 50%,#9c6318 68%,#6b400f 83%,#dca93f 100%)}
.word .lip{position:absolute;inset:0;transform:translateY(-3px);z-index:3;color:transparent;
  -webkit-background-clip:text;background-clip:text;opacity:.52;
  background-image:linear-gradient(180deg,#fffdf4 0%,#fff4cf 14%,transparent 30%)}
.ecz{font-family:'Eczar',serif;font-weight:800;letter-spacing:.01em}

/* the ace, on the game's own card face */
.ace{position:relative;flex:none;border-radius:11px;overflow:hidden;
  box-shadow:0 14px 26px rgba(0,0,0,.8);background:#f3ead3}
.ace img{display:block;width:100%;height:100%;object-fit:fill}
.ace .pip{position:absolute;inset:0;display:grid;place-items:center;color:#1d1510;line-height:.84;text-align:center}
.ace .pip b{display:block;font-family:'Eczar',serif;font-weight:800}
.ace .pip i{display:block;font-style:normal;font-family:'Segoe UI Symbol','Apple Symbols',serif}
.ace .ix{position:absolute;line-height:.8;text-align:center;color:#1d1510;font-family:'Eczar',serif;font-weight:800}
.ace .ix i{display:block;font-style:normal;font-family:'Segoe UI Symbol','Apple Symbols',serif}
.ace .ix.tl{top:8%;left:9%}
.ace .ix.br{bottom:8%;right:9%;transform:rotate(180deg)}

.axe img{display:block;filter:drop-shadow(0 10px 16px rgba(0,0,0,.8))}

/* 1 — iron plate, axe behind the ace, name below */
.p1{position:relative;padding:28px 54px 34px;border-radius:14px;background-color:#393d44;
  background-image:repeating-linear-gradient(103deg,rgba(255,255,255,.045) 0 2px,transparent 2px 9px),
    radial-gradient(ellipse at 50% 0%,#5a616b 0%,#343940 46%,#1a1d22 100%);
  border:7px solid #0e1114;
  box-shadow:0 16px 0 -4px #07090b,0 26px 46px rgba(0,0,0,.8),inset 0 2px 0 rgba(255,255,255,.2);
  display:flex;flex-direction:column;align-items:center;gap:6px}
.rivet{position:absolute;width:15px;height:15px;border-radius:50%;
  background-image:radial-gradient(circle at 34% 30%,#fff3cf,#d7a33f 46%,#6d4210);
  box-shadow:0 2px 2px rgba(0,0,0,.8),inset 0 -2px 2px rgba(0,0,0,.45)}
.rivet.tl{top:10px;left:10px}.rivet.tr{top:10px;right:10px}.rivet.bl{bottom:10px;left:10px}.rivet.br{bottom:10px;right:10px}
.emb1{position:relative;width:250px;height:186px}
.emb1 .axe{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-6deg);z-index:1}
.emb1 .ace{position:absolute;left:50%;top:4px;width:112px;height:166px;transform:translateX(-50%) rotate(7deg);z-index:2}
.rule{display:flex;align-items:center;gap:12px;margin:0 0 -2px}
.rule i{display:block;width:70px;height:3px;border-radius:2px;
  background-image:linear-gradient(90deg,transparent,#b98f3c,transparent)}
.rule span{font-family:'Eczar',serif;font-weight:800;font-size:28px;color:#d7ab4d;text-shadow:0 2px 0 #0e0702}

/* 2 — horizontal: axe, name, ace */
.p2{position:relative;display:flex;align-items:center;gap:22px;padding:22px 36px 26px;border-radius:12px;
  background-image:linear-gradient(180deg,#30220f 0%,#1d1308 46%,#120b05 100%);
  border:7px solid #0e0702;box-shadow:0 18px 38px rgba(0,0,0,.85),inset 0 2px 0 rgba(255,214,130,.16)}
.p2 .mid{display:flex;flex-direction:column;align-items:center}
.tag{margin-top:8px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;font-size:11px;color:#7fe3d4;text-shadow:0 2px 0 #05201c}

/* 3 — the ace is the stage, axe laid across it */
.p3{position:relative;width:400px;height:330px;display:grid;place-items:center}
.p3 .ace{width:214px;height:318px;transform:rotate(-5deg)}
.p3 .axe{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-30deg);z-index:3}
.p3 .nameover{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-5deg);text-align:center;z-index:4}
</style></head>
<body>

<!-- 1 -->
<div class="cell"><div class="stage">
  <div class="p1">
    <i class="rivet tl"></i><i class="rivet tr"></i><i class="rivet bl"></i><i class="rivet br"></i>
    <div class="emb1">
      <div class="axe"><img src="../../art/i_axe.webp" width="250" alt=""></div>
      <div class="ace">
        <img src="../../art/card_face.webp" alt="">
        <span class="ix tl" style="font-size:19px"><span>A</span><i style="font-size:13px">&spades;</i></span>
        <span class="ix br" style="font-size:19px"><span>A</span><i style="font-size:13px">&spades;</i></span>
        <span class="pip"><i style="font-size:52px">&spades;</i></span>
      </div>
    </div>
    <div class="stack" style="display:flex;flex-direction:column;align-items:center">
      <span class="word ecz" style="font-size:72px"><span class="lyr out">AXES</span><span class="lyr face">AXES</span><span class="lyr lip">AXES</span></span>
      <div class="rule"><i></i><span>&amp;</span><i></i></div>
      <span class="word ecz" style="font-size:72px"><span class="lyr out">ACES</span><span class="lyr face">ACES</span><span class="lyr lip">ACES</span></span>
    </div>
  </div>
</div><div class="cap"><b>1</b> · Iron plate — the game's own axe behind the ace</div></div>

<!-- 2 -->
<div class="cell"><div class="stage">
  <div class="p2">
    <div class="axe"><img src="../../art/i_eq_axe_5.webp" width="150" alt=""></div>
    <div class="mid">
      <span class="word ecz" style="font-size:62px"><span class="lyr out">AXES</span><span class="lyr face">AXES</span><span class="lyr lip">AXES</span></span>
      <span class="word ecz" style="font-size:62px;margin-top:-2px"><span class="lyr out">&amp; ACES</span><span class="lyr face">&amp; ACES</span><span class="lyr lip">&amp; ACES</span></span>
      <div class="tag">Fight monsters with poker hands</div>
    </div>
    <div class="ace" style="width:118px;height:176px;transform:rotate(7deg)">
      <img src="../../art/card_face.webp" alt="">
      <span class="ix tl" style="font-size:20px"><span>A</span><i style="font-size:13px">&spades;</i></span>
      <span class="ix br" style="font-size:20px"><span>A</span><i style="font-size:13px">&spades;</i></span>
      <span class="pip"><i style="font-size:56px">&spades;</i></span>
    </div>
  </div>
</div><div class="cap"><b>2</b> · Horizontal — axe left, ace right</div></div>

<!-- 3 -->
<div class="cell"><div class="stage">
  <div class="p3">
    <div class="ace">
      <img src="../../art/card_face.webp" alt="">
      <span class="ix tl" style="font-size:30px"><span>A</span><i style="font-size:20px">&spades;</i></span>
      <span class="ix br" style="font-size:30px"><span>A</span><i style="font-size:20px">&spades;</i></span>
    </div>
    <div class="axe"><img src="../../art/i_axe.webp" width="330" alt=""></div>
    <div class="nameover">
      <span class="word ecz" style="font-size:50px"><span class="lyr out">AXES</span><span class="lyr face">AXES</span><span class="lyr lip">AXES</span></span><br>
      <span class="word ecz" style="font-size:50px"><span class="lyr out">&amp; ACES</span><span class="lyr face">&amp; ACES</span><span class="lyr lip">&amp; ACES</span></span>
    </div>
  </div>
</div><div class="cap"><b>3</b> · The ace as the stage, axe laid across it</div></div>

</body></html>
