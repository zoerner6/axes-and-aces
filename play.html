<title>Axes &amp; Aces</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: a tavern table. Monster on top, you below it, your gear and spells, the attack math, then your hand of cards. Single dark wood look on purpose. */
:root{
  --wood:#241913; --wood-2:#33241b; --wood-3:#433025; --line:#5d4434;
  --parch:#f4e8cc; --parch-dim:#c7b28c;
  --gold:#e9b84e; --hp:#d8473a; --heal:#79c47c; --block:#76a9db; --mult:#e8795d; --pts:#e9b84e;
  --card:#fcf6e7; --card-edge:#e0d2b2; --ink:#1f1a16; --red:#b3282b;
  --bubble:#fbf1d9; --bubble-ink:#2b2119;
  --f-title:'Germania One','Palatino Linotype',Georgia,serif;
  --f-body:'Alegreya Sans','Segoe UI',system-ui,sans-serif;
  --f-num:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--wood);
  background-image:repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 2px, transparent 2px 46px),
                   radial-gradient(ellipse at 50% 0%, rgba(233,184,78,.12), transparent 60%);
  color:var(--parch);font-family:var(--f-body);font-size:16px;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{
  max-width:880px;margin:0 auto;height:100%;min-height:0;box-sizing:border-box;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:8px 10px;display:flex;flex-direction:column;gap:7px;
}
#app.shake{animation:shake .38s}
@keyframes shake{20%{transform:translate(-7px,2px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,-1px)}}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--f-title);font-size:1.5rem;line-height:1;color:var(--gold)}
.brand small{display:block;font-family:var(--f-body);font-weight:800;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--parch-dim);margin-top:4px}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tool{background:var(--wood-2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-weight:800;font-size:.8rem}

.stage{position:relative;flex:1 1 auto;min-height:112px;max-height:400px;border-radius:16px;overflow:hidden;border:3px solid #000;display:flex;flex-direction:column;
  background:linear-gradient(rgba(10,5,3,.55), rgba(10,5,3,.05) 38%, rgba(10,5,3,.05) 70%, rgba(10,5,3,.6)), var(--bgimg) center/cover no-repeat, var(--scene)}
.stage[data-area="0"]{--bgimg:url(art/bg_tavern.webp)} .stage[data-area="1"]{--bgimg:url(art/bg_cellar.webp)}
.stage[data-area="2"]{--bgimg:url(art/bg_forest.webp)} .stage[data-area="3"]{--bgimg:url(art/bg_castle.webp)}
.stage[data-area="0"]{--scene:radial-gradient(ellipse at 50% 105%, rgba(255,140,50,.42), transparent 55%), radial-gradient(ellipse at 15% 20%, rgba(255,190,90,.15), transparent 35%), linear-gradient(#3e2617, #170d07)}
.stage[data-area="1"]{--scene:radial-gradient(ellipse at 12% 35%, rgba(255,170,80,.28), transparent 32%), radial-gradient(ellipse at 88% 35%, rgba(255,170,80,.2), transparent 30%), linear-gradient(#2c2b30, #0f0e12)}
.stage[data-area="2"]{--scene:radial-gradient(circle at 82% 16%, rgba(225,235,255,.55) 0 22px, rgba(200,215,255,.18) 23px, transparent 90px), linear-gradient(#163126, #050e09)}
.stage[data-area="3"]{--scene:radial-gradient(ellipse at 50% -10%, rgba(210,40,40,.55), transparent 60%), linear-gradient(#2d1f35, #0c0710)}
.stage::after{content:"";position:absolute;left:50%;bottom:18%;width:46%;height:16px;transform:translateX(-50%);background:radial-gradient(ellipse, rgba(0,0,0,.55), transparent 70%);z-index:0}
.stage-top{padding:10px 44px 0 12px;display:flex;flex-direction:column;gap:6px;z-index:2}
.foe-title{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.foe-name{font-family:var(--f-title);font-size:1.35rem;line-height:1.1;text-shadow:0 2px 0 rgba(0,0,0,.6)}
.foe-hpnum{font-family:var(--f-num);font-weight:600;font-size:.95rem;color:#ffb0a6;text-shadow:0 1px 0 rgba(0,0,0,.7)}
.vbar{position:absolute;right:12px;top:12px;bottom:12px;width:18px;border-radius:999px;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.18);overflow:hidden;z-index:2}
.vbar .vnum{display:none;position:absolute;inset:0;place-items:center;font-family:var(--f-num);font-weight:700;font-size:1rem;letter-spacing:.06em;color:#fff;text-shadow:1px 1px 0 #000,0 0 4px #000;line-height:1;padding-bottom:2px;z-index:1}
.vbar i{position:absolute;left:0;right:0;bottom:0;height:100%;background:linear-gradient(0deg,#a92c22,var(--hp) 70%,#ff7a6a);transition:height .45s ease}
.stage-bottom{right:44px!important}
.foe-say{right:44px!important}
.foe-rule{font-size:.85rem;color:#ffb7a3;font-weight:800;text-shadow:0 1px 0 rgba(0,0,0,.6)}
.foe-icon{flex:1;min-height:0;display:grid;place-items:center;font-size:clamp(4.2rem,min(24vw,15vh),11.5rem);line-height:1;z-index:1;animation:breathe 3.2s ease-in-out infinite;filter:drop-shadow(0 14px 18px rgba(0,0,0,.65))}
.foe-icon img{display:block;height:clamp(96px,26vh,290px);max-width:78%;object-fit:contain}
.fc-ic img{display:block;width:88px;height:88px;object-fit:contain}
.vic-foe .vf img{display:block;height:110px;width:auto}
.story-art{width:100%;aspect-ratio:16/7;border-radius:12px;border:3px solid #000;background:center/cover no-repeat;display:grid;place-items:end start;padding:8px;box-sizing:border-box;font-size:2.6rem;line-height:1;max-width:100%}
.story-art span{filter:drop-shadow(0 3px 4px rgba(0,0,0,.8))}
@keyframes breathe{50%{transform:scale(1.04) translateY(-5px)}}
.foe-icon.hit{animation:hit .42s}
@keyframes hit{0%{filter:brightness(2.4) saturate(0) drop-shadow(0 0 0 #fff)}30%{transform:translateX(-14px) rotate(-7deg)}60%{transform:translateX(10px) rotate(5deg)}}
.foe-icon.dead{animation:die .8s forwards}
@keyframes die{0%{filter:brightness(2) saturate(0)}25%{transform:rotate(-10deg)}100%{transform:translateY(34px) rotate(90deg);opacity:0;filter:grayscale(1) brightness(.5)}}
.dropcoin{position:fixed;left:0;top:0;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;z-index:62;background:radial-gradient(circle at 35% 30%,#fff6c2,#f4c84e 45%,#c88a12);border:2px solid #7a5208;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);animation:coinfall 1s cubic-bezier(.35,0,.65,1) forwards}
@keyframes coinfall{0%{transform:translate(var(--x0),var(--y0)) scale(.4)}35%{transform:translate(calc(var(--x0) + var(--dx)*.55),calc(var(--y0) - 70px)) scale(1)}80%{transform:translate(calc(var(--x0) + var(--dx)),var(--y1)) scale(1);opacity:1}100%{transform:translate(calc(var(--x0) + var(--dx)),var(--y1)) scale(1);opacity:0}}
.lootlbl{position:fixed;transform:translate(-50%,-50%);z-index:63;font-family:var(--f-num);font-weight:700;font-size:1.6rem;color:#fff;text-shadow:0 2px 0 #2a1608,0 0 8px rgba(0,0,0,.6);white-space:nowrap;animation:rise 1.8s ease-out forwards}
.lootlbl.xp{color:#d9c4ff}
.foe-icon.lunge{animation:lunge .45s}
@keyframes lunge{40%{transform:scale(1.25) translateY(18px)}}
.stage-bottom{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
.banner{position:absolute;left:0;right:0;top:42%;text-align:center;font-family:var(--f-title);font-size:clamp(2rem,9vw,3rem);color:var(--gold);text-shadow:0 3px 0 #000,0 0 18px rgba(0,0,0,.8);opacity:0;pointer-events:none;z-index:3;text-transform:uppercase}
.banner.show{animation:bannerIn 1.3s ease forwards}
@keyframes bannerIn{0%{opacity:0;transform:scale(.5)}18%{opacity:1;transform:scale(1.12)}70%{opacity:1;transform:scale(1)}100%{opacity:0}}
.hpbar{height:14px;border-radius:999px;background:var(--wood-3);overflow:hidden;position:relative}
.hpbar i{display:block;height:100%;width:100%;border-radius:inherit;transition:width .45s ease}
.hpbar.foehp i{background:linear-gradient(90deg,#a92c22,var(--hp))}
.hpbar.mehp i{background:linear-gradient(90deg,#4f9a52,var(--heal))}
.hpbar span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-weight:600;font-size:.72rem;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7);font-variant-numeric:tabular-nums}
.foe-meta{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-weight:800;font-size:.82rem;background:var(--wood-3);font-variant-numeric:tabular-nums}
.chip.intent{background:#5a2a22;color:#ffd9cc}
.chip.intent.calm{background:#2f3b4f;color:#d6e6ff}
.chip.blk{background:#26394d;color:#cfe4ff}
.foe-say{position:absolute;left:10px;right:10px;bottom:48px;z-index:3;background:var(--bubble);color:var(--bubble-ink);border-radius:10px;padding:7px 11px;font-weight:700;font-size:.95rem;line-height:1.35}
.foe-say.new{animation:pop .3s ease}
.me{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:center;background:var(--wood-2);border:1px solid var(--line);padding:8px 12px;border-radius:14px}
.me-name{font-weight:800;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.me-name small{color:var(--parch-dim);font-weight:700}
.me-stats{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.chip.gold{color:var(--gold)}
.xpbar{grid-column:1/-1;height:6px;border-radius:999px;background:var(--wood-3);overflow:hidden}
.xpbar i{display:block;height:100%;background:#b48cf0;border-radius:inherit;transition:width .5s}
.me.flash{animation:flash .45s}
@keyframes flash{30%{background:rgba(216,71,58,.35)}}

.kit{display:grid;grid-template-columns:5fr 3fr;gap:10px}
.kit-label{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--parch-dim);font-weight:800;margin-bottom:4px;display:flex;justify-content:space-between}
.slots{display:grid;gap:5px}
.slots.g{grid-template-columns:repeat(5,1fr)} .slots.s{grid-template-columns:repeat(3,1fr)}
.slot{background:var(--card);color:var(--ink);border:0;border-radius:9px;min-height:44px;padding:4px 2px;display:grid;place-items:center;font-size:1.45rem;line-height:1;box-shadow:0 2px 0 rgba(0,0,0,.3);min-width:0}
.slot.spell{background:#e6dcf7}
.slot{position:relative}
.slot small{position:absolute;left:0;right:0;bottom:1px;font-size:.5rem;font-weight:800;letter-spacing:.02em;color:#6a5a48;font-family:var(--f-body);line-height:1;text-align:center;white-space:nowrap;overflow:hidden}
.slot.empty small{color:var(--parch-dim)}
.slot.used{opacity:.35}
.slot.book{background:#ffe9b8}
.slot.empty{background:transparent;border:1.5px dashed var(--line);box-shadow:none;cursor:default}
.slot.on{outline:3px solid var(--gold)}
.slot.wiggle{animation:wiggle .35s}
@keyframes wiggle{25%{transform:rotate(-9deg) scale(1.1)}75%{transform:rotate(9deg) scale(1.1)}}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{display:flex;align-items:center;gap:8px;background:var(--wood-2);border:1px solid var(--line);border-radius:12px;padding:6px 10px;min-width:0}
.tile .ti{font-size:1.5rem;line-height:1}
.tile b{display:block;font-family:var(--f-num);font-weight:600;font-size:1.15rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile small{display:block;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--parch-dim)}
.xpline{font-size:.85rem;color:var(--parch-dim);font-weight:700;margin-top:-4px}
.xpline b{color:#c9a8ff}
.info{min-height:22px;font-size:.9rem;color:var(--parch-dim);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.info b{color:var(--parch)}
.mini-btn{background:var(--wood-3);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.82rem;font-weight:800;color:var(--gold)}
.mini-btn.use{background:var(--gold);color:var(--ink);border:0}

.calcbox{background:var(--wood-2);border:1px solid var(--line);border-radius:14px;padding:9px 12px;display:flex;flex-direction:column;gap:6px;border-radius:14px}
.calc{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hand-name{font-family:var(--f-title);font-size:1.15rem}
.hand-name small{font-family:var(--f-body);font-size:.78rem;color:var(--parch-dim);font-weight:700;margin-left:4px}
.formula{display:flex;align-items:center;gap:5px;font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums}
.pill{min-width:48px;text-align:center;border-radius:9px;padding:3px 7px;font-size:1.05rem;color:var(--ink)}
.pill.p{background:var(--pts)} .pill.m{background:var(--mult)} .pill.d{background:var(--parch);min-width:56px}
.pill small{display:block;font-family:var(--f-body);font-size:.56rem;letter-spacing:.06em;text-transform:uppercase;font-weight:800;margin-top:-2px}
.op{color:var(--parch-dim)}
.suitkey{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:.82rem;color:var(--parch-dim);font-weight:700;border-radius:8px}
.suitkey span b{font-size:1rem}
.suitkey .r{color:#ff9c8f}
.extra{font-size:.85rem;font-weight:800;color:var(--heal);min-height:1.2em}
.played{display:flex;justify-content:center;gap:6px;min-height:0;align-items:center}
.played:not(:empty){min-height:80px}

.hand{display:flex;justify-content:center;gap:4px;padding-top:16px}
.card{
  --w:clamp(37px, calc((100% - 36px) / var(--n, 8)), 82px);
  width:var(--w);flex:0 0 var(--w);aspect-ratio:5/7;max-width:100%;
  background:#fffaf0;border:2.5px solid #14100e;border-radius:8px;padding:0;position:relative;color:var(--ink);overflow:visible;
  box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .15s ease, box-shadow .15s;
  display:flex;align-items:center;justify-content:center;
}
.card.red{color:var(--red)}
.card.king{border:2px solid var(--gold);box-shadow:inset 0 0 0 1px #c9962e,0 0 8px rgba(233,184,78,.45),0 3px 0 rgba(0,0,0,.35)}
.played .card{--w:clamp(40px, 15%, 76px)}
.card .cn{position:absolute;top:3px;left:4px;display:flex;flex-direction:column;align-items:center;font-family:var(--f-num);font-weight:700;line-height:.9;font-size:clamp(19px,5.4vw,28px);letter-spacing:-.02em}
.card .cn i{font-style:normal;font-size:.85em}
.card .cn.br{top:auto;left:auto;bottom:3px;right:4px;transform:rotate(180deg)}
.card .md{font-size:clamp(30px,8.6vw,50px);line-height:1;margin-top:34%}
.card.red{color:#c8161d}
.card .md.face{font-family:var(--f-title);width:100%;margin-top:18%}
.card .md.face img{display:block;width:72%;margin:0 auto;border-radius:5px}
.card.sel{transform:translateY(-14px);box-shadow:0 0 0 3px var(--gold),0 6px 0 rgba(0,0,0,.3)}
.card.lift{transform:translateY(-10px) scale(1.06);box-shadow:0 0 0 3px var(--gold)}
.card.off::after{content:"✖";position:absolute;bottom:-6px;right:-6px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;color:#fff;background:var(--hp);box-shadow:0 1px 3px rgba(0,0,0,.5)}
.card.dim{opacity:.4}
.card.flipout{transform:rotateY(90deg) scale(.95);transition:transform .14s ease-in}
.card.flipin{animation:flipin .2s ease-out}
@keyframes flipin{from{transform:rotateY(90deg) scale(.95)}to{transform:none}}
.card.fly{transform:translateY(-160px) scale(.5) rotate(-8deg);opacity:0;transition:transform .38s ease-in, opacity .38s ease-in}
.card.glow{animation:glow 1.1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px var(--gold),0 0 18px var(--gold)}}
@media (max-width:520px){ .card .cn.br{display:none} }

.actions{display:grid;grid-template-columns:auto auto auto auto auto 1fr 1.3fr;gap:8px}
.btn{border:0;border-radius:12px;padding:12px 10px;font-weight:800;font-size:1.05rem}
.btn.atk{background:var(--hp);color:#fff;font-family:var(--f-title);font-size:1.2rem;font-weight:400}
.btn.disc{background:var(--wood-3);border:1px solid var(--line)}
.btn.ghost{background:var(--wood-2);border:1px solid var(--line);font-size:.82rem;padding:8px 10px}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.big{background:var(--gold);color:var(--ink);width:100%;font-size:1.15rem;padding:14px}

#bubble{position:fixed;z-index:40;background:var(--bubble);color:var(--bubble-ink);border-radius:16px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.45);font-size:1rem;line-height:1.4;box-sizing:border-box;animation:pop .22s ease}
#bubble b{color:#000}
#bubble .who{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:#8a5a20;margin-bottom:2px}
#bubble .bb{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
#bubble button{border:0;border-radius:999px;background:var(--wood);color:var(--parch);font-weight:800;padding:7px 14px;font-size:.88rem}
#bubble button.skip{background:transparent;color:#7a6650;padding-inline:6px}
#bubble .arrow{position:absolute;width:16px;height:16px;background:var(--bubble);transform:rotate(45deg)}
#bubble.above .arrow{bottom:-7px} #bubble.below .arrow{top:-7px}
.coach-glow{box-shadow:0 0 0 3px var(--gold),0 0 22px rgba(233,184,78,.55)!important;position:relative;z-index:1}
.tipbox{background:var(--bubble);color:var(--bubble-ink);border-radius:14px;padding:10px 12px;font-size:.95rem;line-height:1.4}
.tipbox b{color:#000}
.tipbox::before{content:"Old Bram says";display:block;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:#8a5a20}

#overlay{position:fixed;inset:0;background:rgba(15,9,6,.78);display:grid;place-items:center;z-index:50;
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.panel{background:var(--wood-2);border:2px solid var(--line);border-radius:18px;width:100%;max-width:520px;max-height:100%;overflow:auto;padding:18px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;animation:pop .22s ease}
@keyframes pop{from{transform:scale(.94);opacity:.4}}
.panel h2{margin:0;font-family:var(--f-title);font-weight:400;font-size:1.75rem;color:var(--gold);text-wrap:balance}
.panel p{margin:0;line-height:1.5;color:var(--parch-dim);font-size:1.02rem}
.panel p b{color:var(--parch)}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--parch-dim)}
.big-icon{font-size:3.6rem;line-height:1}

.row{display:flex;gap:8px;flex-wrap:wrap}

.link{background:none;border:0;color:var(--gold);font-weight:800;text-decoration:underline;padding:0}

#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.pop{position:fixed;transform:translate(-50%,-50%);font-family:var(--f-num);font-weight:700;font-size:1.05rem;padding:2px 8px;border-radius:8px;white-space:nowrap;animation:rise 1s ease-out forwards;color:var(--ink)}
.pop.p{background:var(--pts)} .pop.m{background:var(--mult)} .pop.h{background:var(--heal)} .pop.b{background:var(--block)} .pop.g{background:var(--gold)}
.pop.dim{background:var(--wood-3);color:var(--parch-dim)}
.pop.dmg{background:var(--hp);color:#fff;font-size:clamp(2.2rem,10vw,3.4rem);padding:2px 14px;border-radius:12px;box-shadow:0 4px 0 rgba(0,0,0,.4)}
.boom{position:fixed;transform:translate(-50%,-50%);z-index:61;width:58px;height:58px;animation:boom .65s ease-out forwards}
.hurtnum{position:fixed;transform:translate(-50%,-50%);z-index:62;font-family:var(--f-num);font-weight:700;font-size:1.7rem;color:#fff;text-shadow:0 2px 0 #9a1a12,0 0 6px #e2361f;animation:hurtrise 1.25s ease-out forwards}
@keyframes hurtrise{0%{opacity:0;margin-top:0}15%{opacity:1}100%{opacity:0;margin-top:-70px}}
.boom::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,#ffe36b 0 30%,#ff8a1f 55%,#e2361f 100%);clip-path:polygon(50% 0,61% 30%,95% 15%,72% 42%,100% 55%,68% 62%,82% 95%,52% 72%,30% 100%,32% 68%,0 72%,26% 50%,4% 25%,36% 32%);z-index:-1}
@keyframes boom{0%{transform:translate(-50%,-50%) scale(.2) rotate(-20deg)}25%{transform:translate(-50%,-50%) scale(1.15) rotate(5deg)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(.9)}}
.pop.hurt{background:#fff;color:var(--hp);font-size:1.4rem}
@keyframes rise{0%{opacity:0;margin-top:6px}15%{opacity:1}100%{opacity:0;margin-top:-50px}}
.confetti{position:fixed;top:-30px;font-size:22px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--card);color:var(--ink);font-weight:800;padding:9px 14px;border-radius:999px;z-index:70;font-size:.92rem;box-shadow:0 4px 0 rgba(0,0,0,.35);max-width:90vw;text-align:center}

@media (max-width:460px){
  .actions{grid-template-columns:1fr 1fr 1fr}
  .actions .breath{grid-column:1 / span 2}
  .actions .atk{grid-column:1 / -1}
  .brand{font-size:1.3rem}
}
/* ===== Dark comic pass: ink outlines, hard shadows, crimson / gold / teal, real icons ===== */
:root{--wood:#14100d;--wood-2:#211813;--wood-3:#2f231b;--line:#000;--gold:#f2b632;--hp:#c8241f;--heal:#3fa04f;--block:#2f7fa3;--mult:#e0622f;--pts:#f2b632;
  --parch:#f3e6c8;--parch-dim:#b9a483;--f-num:'Oswald','Arial Narrow',system-ui,sans-serif;--ink:#0b0908;--steel:#2f6f8f;--teal:#2bb3a6}
body{background-color:#100c0a;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.3px),radial-gradient(ellipse at 50% 0%,rgba(200,36,31,.14),transparent 60%);background-size:6px 6px,auto}
.ico{display:inline-block;width:1.3em;height:1.3em;object-fit:contain;vertical-align:-.3em;filter:drop-shadow(0 1px 0 rgba(0,0,0,.45))}
.coinv{display:inline-flex;align-items:center;gap:2px;font-family:var(--f-num);font-weight:700;white-space:nowrap;vertical-align:middle}
.coinv .ico{width:1.35em;height:1.35em;vertical-align:0}
.tool{background:#1b1410;border:2px solid #000;box-shadow:2px 2px 0 #000}
.sndmenu{border:3px solid #000;box-shadow:4px 4px 0 #000}
/* stage: the whole monster always fits; it can lunge out of the frame */
.stage{box-shadow:5px 5px 0 #000;overflow:visible;z-index:2;min-height:150px}
.foe-icon{position:relative}
.foe-icon img{position:absolute;inset:4px 0 2px;margin:auto;width:100%;height:calc(100% - 6px);max-width:none;object-fit:contain}
.foe-icon.lunge{animation:lunge2 .62s cubic-bezier(.3,0,.3,1)}
@keyframes lunge2{0%{transform:none}25%{transform:scale(.9) translateY(-8px)}55%{transform:scale(1.5) translateY(36px) rotate(-5deg);filter:drop-shadow(0 0 18px rgba(255,40,20,.75))}100%{transform:none}}
.claw{position:fixed;width:260px;height:12px;margin:-6px 0 0 -130px;z-index:64;pointer-events:none;transform:rotate(-58deg) scaleX(0);background:linear-gradient(90deg,transparent,#ff4a3a 20%,#fff 50%,#ff4a3a 80%,transparent);border-radius:999px;box-shadow:0 0 12px #ff2a1a;animation:claw .55s ease-out forwards}
@keyframes claw{0%{transform:rotate(-58deg) scaleX(0);opacity:1}40%{transform:rotate(-58deg) scaleX(1);opacity:1}100%{transform:rotate(-58deg) scaleX(1.05) translateY(6px);opacity:0}}
.redflash{position:fixed;inset:0;z-index:59;pointer-events:none;background:radial-gradient(ellipse at 50% 60%,rgba(200,20,10,0),rgba(200,20,10,.45));animation:rf .45s ease-out forwards}
@keyframes rf{to{opacity:0}}
/* your health: one slim bar */

.stage.boss::before{content:"";position:absolute;inset:0;border-radius:13px;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 55%, transparent 40%, rgba(120,0,0,.55) 100%);animation:bossPulse 2.6s ease-in-out infinite}
@keyframes bossPulse{0%,100%{opacity:.65}50%{opacity:1}}
.stage.boss{border-color:#7d0d0a;box-shadow:5px 5px 0 #000,0 0 22px rgba(200,20,10,.55)}
.foe-vidwrap{position:absolute;inset:0;border-radius:13px;overflow:hidden;z-index:0;opacity:0;transition:opacity .4s;pointer-events:none}
.stage.hasvid .foe-vidwrap{opacity:1}
.stage.hasvid .foe-vidwrap.gone{opacity:0}

.stage.hasvid::after{display:none}

/* wide screens: show the whole clip at full height instead of zooming in; soft blurred scene fills the sides */
.foe-vidwrap::before{content:"";position:absolute;inset:-24px;background:var(--bgimg) center/cover;filter:blur(16px) brightness(.5)}
.foe-vidwrap video{left:50%;right:auto;translate:-50% 0;width:auto;max-width:none;aspect-ratio:16/9;-webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
@media (max-aspect-ratio:1/1){.foe-vidwrap video{-webkit-mask-image:none;mask-image:none}}
.foe-vidwrap video.atk{opacity:0;transition:opacity .25s ease}
.foe-vidwrap video.atk.on{opacity:1}
.foe-vidwrap.hit{animation:vidHit .42s}
@keyframes vidHit{0%{filter:brightness(2.2) saturate(.3)}30%{transform:translateX(-10px)}60%{transform:translateX(8px)}100%{transform:none;filter:none}}
.foe-vidwrap.healglow{animation:vidHeal 1.2s}
@keyframes vidHeal{40%{filter:brightness(1.3) drop-shadow(0 0 0 #000) hue-rotate(40deg)}}
.foe-vidwrap.shieldglow{animation:vidShield 1.2s}
@keyframes vidShield{40%{filter:brightness(1.2) saturate(.6) hue-rotate(160deg)}}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important;transition-duration:.01ms!important} }

  #app>.stage .foe-title{font-size:1.7rem;justify-content:center}

  #app>.stage .vbar{top:calc(var(--handtop,75vh) - 46px);left:50%;right:auto;bottom:auto;transform:translateX(-50%);width:min(40vw,640px);height:30px;border:3px solid #000;box-shadow:3px 3px 0 #000}
  #app>.stage .vbar i{top:0;bottom:0;right:auto;height:100%!important;width:var(--pct,100%);background:linear-gradient(90deg,#4e0c0a,#b3221a);transition:width .45s ease}
  #app>.stage .vbar .vnum{display:grid}
  #app>.stage .stage-bottom{left:50%;right:auto;bottom:auto;top:46px;transform:translateX(-50%)}
  #app>.info{grid-row:2!important;margin-bottom:64px}
  #app .foe-vidwrap,#app .stage.boss::before{border-radius:0}
  /* the whole clip fits above the cards; its sides melt into the room picture */
  #app .foe-vidwrap video{left:50%;translate:-50% 0;top:0;height:calc(var(--handtop,75vh) + 60px);width:auto;max-width:none;aspect-ratio:16/9;object-fit:cover;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
  #app .foe-vidwrap::before{inset:0;filter:brightness(.62) saturate(.9);background:var(--bgimg) center top/cover}
  #app .foe-icon{inset:6% 0 auto 0;height:calc(var(--handtop,75vh) - 6vh)}
  #app>.stage::after{display:block;content:"";position:absolute;left:0;right:0;bottom:0;top:auto;width:auto;height:46vh;margin:0;transform:none;border-radius:0;background:linear-gradient(transparent,rgba(0,0,0,.82) 62%);pointer-events:none;z-index:1}
  #app>header.top{grid-column:1/-1;grid-row:1;position:relative;z-index:3}
  #app>.me{grid-column:1;grid-row:3;position:relative;z-index:3;background:rgba(20,14,10,.82)}
  #app>.satchel{grid-column:1;grid-row:4;position:relative;z-index:3;background-color:rgba(20,14,10,.82)}
  #app>.info{grid-column:2;grid-row:3;position:relative;z-index:3;align-self:end;justify-self:center;font-size:1.25rem;line-height:1.35;color:var(--parch);background:rgba(20,14,10,.88);border:3px solid #000;border-radius:12px;box-shadow:4px 4px 0 #000;padding:10px 16px;max-width:760px}
  #app>.info .btn,#app>.info button,#app>.info .mini-btn{font-size:1.05rem;padding:8px 18px}
  #app>.info .ico{width:34px;height:34px;vertical-align:middle}
  #app>.handwrap{grid-column:2;grid-row:4;align-self:end;position:relative;z-index:3;max-width:760px;width:100%;justify-self:center}
  #app>.handwrap{min-width:0}
  #app>.handwrap .card{--w:clamp(44px,calc((100vw - 900px) / (var(--n,7) + .8)),104px)}
  /* the damage read-out sits at the right of the hand, clear of the monster's name */
  #app>.handwrap .hand-tag{left:auto;right:0;transform:translateY(-100%);max-width:min(40vw,400px)}
  @keyframes tagBobR{50%{transform:translateY(calc(-100% - 5px))}}
  #app>.handwrap .hand-tag{animation-name:tagBobR}
  #app>.actions{grid-column:3;grid-row:3/5;align-self:end;position:relative;z-index:3;grid-template-columns:1fr 1fr}
  #app>.actions .disc,#app>.actions .atk{grid-column:1/3}
}

/* ---- casting a spell ---- */
.spellfx{position:absolute;inset:0;z-index:14;pointer-events:none;overflow:hidden;border-radius:13px}

  filter:drop-shadow(0 0 30px var(--sfc)) drop-shadow(0 0 60px var(--sfc));animation:sfFly .46s cubic-bezier(.3,0,.15,1) forwards}

  0%{transform:translate(-210%,70%) scale(.3) rotate(-40deg);opacity:0}
  20%{opacity:1}
  72%{transform:translate(-50%,-50%) scale(1.3) rotate(8deg);opacity:1}
  100%{transform:translate(-50%,-50%) scale(1.9) rotate(0deg);opacity:0}}

@keyframes sfFlash{0%{opacity:.72}30%{opacity:.28}100%{opacity:0}}

/* damage numbers burst out of a comic "POW" star instead of a box */

.pop.dmg::after{content:"";position:absolute;inset:-12% -8%;clip-path:polygon(50.0% 0.0%,56.8% 15.7%,69.1% 3.8%,71.1% 18.4%,85.4% 14.6%,79.1% 30.6%,96.2% 30.9%,87.3% 42.6%,100.0% 50.0%,84.3% 56.8%,96.2% 69.1%,81.6% 71.1%,85.4% 85.4%,69.4% 79.1%,69.1% 96.2%,57.4% 87.3%,50.0% 100.0%,43.2% 84.3%,30.9% 96.2%,28.9% 81.6%,14.6% 85.4%,20.9% 69.4%,3.8% 69.1%,12.7% 57.4%,0.0% 50.0%,15.7% 43.2%,3.8% 30.9%,18.4% 28.9%,14.6% 14.6%,30.6% 20.9%,30.9% 3.8%,42.6% 12.7%);z-index:-1}
.pop.dmg::after{background:radial-gradient(circle,#ffe27a 0 25%,#f08a24 55%,#d0281c 100%);animation:burstSpin 1.2s ease-out forwards}
.pop.dmg.t0::after,.pop.dmg.t1::after{background:radial-gradient(circle,#ff7a5a 0 30%,#c8241f 75%)}
.pop.dmg.t3::after,.pop.dmg.t4::after,.pop.dmg.t5::after{background:radial-gradient(circle,#fff6c2 0 20%,#ffcf3d 45%,#f08a24 70%,#d0281c 100%)}
@keyframes burstSpin{0%{transform:rotate(-20deg) scale(.4)}20%{transform:rotate(4deg) scale(1.05)}100%{transform:rotate(10deg) scale(1)}}

function genBoss(def, L){
  const hp=Math.round(monsterHP(L)*2.3/10)*10, atk=(4+2.6*(L-1))*1.25*FOE_PUNCH;
  const moves=def.pat.map(v=> v==='B'?{k:'blk',n:Math.round(hp*.12)} : v==='H'?{k:'heal',n:Math.round(hp*.15)} : {k:'atk',n:Math.max(10,Math.round(atk*v)*10)});
  return Object.assign({def:foeArmorFor(L,true), name:def.name, icon:'', boss:true, lvl:L, hp, xp:Math.round((6+5*L)*3.6), gold:Math.ceil(L*.7)+3, moves}, ruleOf(def.rule));
}

  if(b===0){
    POOLS=W1.pools; QUEST_STEPS=W1.steps; PLACES=W1.places; WPFX=''; BGF=a=>'bg_'+W1.bg[a];
    AREAS=W1.areas.map((a,i)=>({name:a.name, icon:a.icon, foes:['gen','gen','boss_'+i]}));
    W1.bosses.forEach((d,i)=>{ MONSTERS['boss_'+i]=genBoss(d,bossLv[i]); });

    QUEST_STEPS=D.steps.map(([go,why])=>({go,why})); PLACES=D.areas.map(a=>a.place);
    WPFX=D.id+'_'; BGF=a=>`bg_${D.id}_${a}`;
    STORIES={start:D.intro, a1:[D.story.a1], a2:[D.story.a2], a3:[D.story.a3], end:D.story.end};

    const base = b===0 ? W1.stories : STORIES, nm=worldName(w);
    STORIES={start:[{title:`Endless Quest · Depth ${w-9}`, text:`The shadows rise again in ${b===0?'the lands of the Gilded Ace':WORLDS[b-1].name}. The monsters are stronger than ever, Sir Edward. How far can you go?`}],
      a1:base.a1, a2:base.a2, a3:base.a3, end:[{title:`Depth ${w-9} cleared!`, text:`The last guardian falls. But deeper in the dark, something even stronger stirs...`}]};
  }
}

function mNote(f,t,dur,voice,vol){
  const o=ac.createOscillator(), g=ac.createGain(); o.connect(g); g.connect(musicGain);
  if(voice==='pluck'){ o.type='triangle'; o.frequency.value=f; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+Math.min(.6,dur*1.6)); }
  else if(voice==='flute'){ o.type='sine'; o.frequency.value=f; const l=ac.createOscillator(), lg=ac.createGain(); l.frequency.value=5; lg.gain.value=f*.006; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t+dur+.3);

  else { o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); }
  o.start(t); o.stop(t+dur+.4);
}
function mDrum(t,vol){ const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.setValueAtTime(110,t); o.frequency.exponentialRampToValueAtTime(50,t+.18);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+.3); o.connect(g); g.connect(musicGain); o.start(t); o.stop(t+.35); }
function musicTick(){
  const tr=TRACKS[musicArea]; if(!tr||!ac) return; const step=60/tr.bpm/2;
  while(mTime < ac.currentTime+.15){
    const m=tr.mel[mStep%tr.mel.length]; if(m) mNote(N[m],mTime,step*1.6,tr.voice,tr.vol);
    if(mStep%2===0){ const b=tr.bass[(mStep/2)%tr.bass.length]; if(b) mNote(N[b],mTime,step*3,'bass',tr.vol*1.2); }
    if(tr.drone && mStep%32===0) mNote(N[tr.drone],mTime,step*32,'bass',tr.vol*.7);
    if(tr.drum[mStep%tr.drum.length]) mDrum(mTime,tr.vol*2.2);
    mTime+=step; mStep++;
  }
}

function brass(f, t0, dur, vol=.055){
  if(!soundOn||!ac) return;

    o.type='sawtooth'; o.frequency.value=f; o.detune.value=d; lfo.frequency.value=5.2; lg.gain.value=f*.005;
    lfo.connect(lg); lg.connect(o.frequency); o.connect(lp); o.start(t); o.stop(t+dur+.2); lfo.start(t+.15); lfo.stop(t+dur+.2); });

/* speaks text; calls onTime(seconds) with how long it should take so captions can keep pace */
function narrate(text, id, onTime){
  stopVoice(); if(!voiceOn) return false; audio();
  if(id && VO.includes(id)){ const a=new Audio(`art/${id}.mp3`); vo=a;
    a.addEventListener('loadedmetadata',()=>{ if(vo===a&&isFinite(a.duration)) onTime&&onTime(a.duration); });
    a.addEventListener('ended',()=>{ if(vo===a){ vo=null; duck(false); } });
    a.play().then(()=>duck(true)).catch(()=>{ const b=document.querySelector('.cine-voice'); if(b) b.hidden=false; }); return true; }
  if(!('speechSynthesis' in window)) return false;
  try{ const u=new SpeechSynthesisUtterance(text.replace(/<[^>]+>/g,'')), v=pickVoice(); if(v) u.voice=v; u.rate=.94; u.pitch=.82;
    u.onend=()=>{ if(vo===u){ vo=null; duck(false); } }; vo=u; duck(true); speechSynthesis.speak(u); onTime&&onTime(text.length/13.5); return true; }catch(e){ return false; }
}
function typeCaption(text, secs, delay=0){ text=nm(text);
  const el=$('capTxt'); if(!el) return; clearInterval(typeTimer); clearTimeout(typeDelay);
  /* no letter-by-letter typing: each sentence fades in quickly, so the whole thing is readable in about a second */
  el.dataset.full=text; const parts=text.match(/[^.!?…]+[.!?…]+["”']?\s*|[^.!?…]+$/g)||[text];
  el.innerHTML=parts.map((p,i)=>`<span class="sen" style="animation-delay:${Math.min(delay,400)/1000+i*.18}s">${p.replace(/</g,'&lt;')}</span>`).join('');
}
function finishCaption(){ const el=$('capTxt'); if(!el) return; clearInterval(typeTimer); clearTimeout(typeDelay); el.querySelectorAll('.sen').forEach(x=>x.style.animation='none'); }

function runCine(id, title, text){

/* monster loot: about 1 in 6 fights drops gear you can use, about 1 in 3 a Healing Potion */
function gearDrops(){

    if(!cur) out.push({slot,type,tier:1});
    else if(cur.type===type && cur.tier<Math.min(5,cap)) out.push({slot,type,tier:cur.tier+1}); };
  up('main', S.eq.main?S.eq.main.type:'sword');
  if(!twoHanded()) up('off','dagger');
  up('shield','shield'); up('helm','helm'); up('armor','armor');
  return out;
}
function rollDrop(){
  if(S.coach>=0 && S.idx===0) return null;
  const r=Math.random(), g=gearDrops();
  if(r<1/6 && g.length){ const it=g[rnd(g.length)], old=S.eq[it.slot]; if(old){ (S.oldGear=S.oldGear||[]).push({type:old.type,tier:old.tier}); } S.eq[it.slot]={type:it.type,tier:it.tier}; return {kind:'gear', type:it.type, tier:it.tier, old:old?eqName(old.type,old.tier):null}; }

  return null;
}

function eqOffer(type){
  const e=EQUIP[type], cur=S.eq[e.slot];
  const tier = cur ? Math.min(5, cur.tier + (cur.type===type?1:0)) : 1;
  const same = cur && cur.type===type && cur.tier===tier;
  const refund = cur && !same ? Math.floor(EQUIP[cur.type].price[cur.tier]/2) : 0;
  const dropDagger = e.hands===2 && S.eq.off ? Math.floor(EQUIP[S.eq.off.type].price[S.eq.off.tier]/2) : 0;
  const cost = e.price[tier] - refund - dropDagger;
  let block='';
  if(same) block = tier>=5 ? 'Best there is' : 'You have this';
  else if(tier>tierCap()) block='Better ones in the next area';
  else if(type==='dagger'&&twoHanded()) block='Your Battle Axe needs both hands';
  else if(S.gold<cost) block=`Need ${coin(cost)}`;
  return {type, tier, cur, refund:refund+dropDagger, cost:Math.max(0,cost), block, dropDagger};
}

    else { const g=2+rnd(4); S.gold+=g; f={gold:g,scene:'chest',icon:I('chest'),title:'A treasure chest!',text:`You pry it open and find <b>${g} gold coins</b>.`}; }
  } else if(r<.4){

    else { S.gold+=3; f={gold:3,scene:'fallen',icon:I('skull'),title:'A fallen adventurer',text:'Their old gear is worse than yours, so you sell it to the next traveler for <b>3 gold coins</b>.'}; }

                '"Behind the cracked cellar wall there\'s a tunnel. It leads to the Dark Forest."',
                '"They\'re taking her to Castle Grimstone. Follow the smoke above the trees."',
                '"She\'s locked in the tallest tower. The master is a dragon. Save your best hand for it."'][areaOf()];
    const people=[['hermit','An old hermit','he','his'],['villager','A frightened villager','she','her'],['minstrel','A traveling minstrel','he','his'],['knight','A wandering knight','he','his']], [scene,title,pr,pos]=people[rnd(people.length)];

    else { const g=3+rnd(3); S.gold+=g; giftGold=g; gift=`<b>${g} gold coins</b> to help you on your way`; }
    f={gold:giftGold,give:giftItem,sip:sipHeal,scene,icon:'',title,text:`${clue}<br><br>Before you go, ${pr} gives you ${gift}.`};
  } else if(r<.85){

const SONG_BAD = new Set();
let musBus=null, song=null;
function songWant(){
  if(!musicOn || !S) return null;
  const fightish = S.phase==='play'||S.phase==='intro';
  let boss=false; try{ boss = fightish && !S.huntFoe && foeDef() && foeDef().boss; }catch(e){}
  if(boss) return 'boss';
  if(fightish) return 'fight'+(1+((S.idx||0)%2));
  return 'w'+(((S.world||0)%10)+1);
}
function songStart(id){
  if(!musBus){ musBus=ac.createGain(); musBus.gain.value=.55; musBus.connect(ac.destination); }
  const a=new Audio(`music/${id}.mp3`); a.preload='auto';
  let node; try{ node=ac.createMediaElementSource(a); }catch(e){ SONG_BAD.add(id); return null; }
  const g=ac.createGain(); g.gain.value=0; node.connect(g); g.connect(musBus);
  const me={id,a,g,next:false};
  a.addEventListener('error',()=>{ SONG_BAD.add(id); if(song===me){ song=null; updateMusic(); } });
  a.addEventListener('timeupdate',()=>{ if(song===me && !me.next && a.duration && a.currentTime>a.duration-4){ me.next=true; songSwap(id); } });
  a.play().then(()=>{ g.gain.setTargetAtTime(1,ac.currentTime,.7); }).catch(()=>{});
  return me;
}
function songStop(me){ if(!me) return; try{ me.g.gain.setTargetAtTime(0,ac.currentTime,.6); }catch(e){} setTimeout(()=>{ try{ me.a.pause(); me.g.disconnect(); }catch(e){} },3500); }

  openPanel(`<div class="eyebrow">Your legend</div><h2>Achievements ${n} / ${ACH.length}</h2>
    <div class="lines stats-lines"><div><span>Fights won</span><b>${fmt(L.wins)}</b></div><div><span>Bosses defeated</span><b>${fmt(L.bosses)}</b></div>
      <div><span>Biggest hit</span><b>${fmt(L.best)}${L.bestName?' ('+L.bestName+')':''}</b></div><div><span>Hands played</span><b>${fmt(L.hands)}</b></div>
      <div><span>Highest level</span><b>${L.level}</b></div><div><span>Quests completed</span><b>${L.quests}</b></div><div><span>Best daily score</span><b>${fmt(L.dailyBest)}</b></div></div>
    <div class="ach-grid">${ACH.map(a=>`<div class="ach ${have[a.id]?'got':''}"><span class="ach-ic">${have[a.id]?I(a.icon):I('lock')}</span><span><b>${nm(a.name)}</b><small>${nm(a.desc)}</small></span>${have[a.id]?`<button data-act="brag" data-kind="ach" data-id="${a.id}">Brag</button>`:''}</div>`).join('')}</div>
    <button class="btn big" data-act="close">Back</button>`);
}
/* ---------- start ---------- */
/* someone shared a challenge link with us */
function readChallenge(){ try{ const q=new URLSearchParams(location.search), c=q.get('c'); if(!c) return null; const r={c, s:+q.get('s')||0, d:q.get('d')||'', w:+q.get('w')||1}; history.replaceState(null,'',location.pathname); return r; }catch(e){ return null; } }
function challengePanel(ch, after){
  const daily=ch.c==='daily'&&ch.d===todayKey();
  if(daily) store.set('aa_beat',{d:ch.d,s:ch.s});
  openPanel(`<div class="cine-scene"><img src="art/sc_merchant.webp" alt=""><span class="cine-title">You've been challenged!</span></div>
    <h2>${daily?`Beat ${fmt(ch.s)} points`:ch.c==='daily'?'A friend took on the Daily Challenge':`A friend reached level ${ch.s}`}</h2>
    <p>${daily?'A friend scored this in today\'s Daily Challenge. Same monsters, same cards. Your turn to try.':ch.c==='daily'?'That challenge has ended, but today\'s is waiting. Give it a go.':`They made it to level ${ch.s} in Quest ${ch.w}. Think you can go further?`}</p>
    ${ch.c==='daily'?'<button class="btn big daily-btn" data-act="daily">Take the Daily Challenge</button>':''}
    <button class="btn big ${ch.c==='daily'?'ghost':''}" data-act="chGo">${ch.c==='daily'?'Play the adventure instead':'Start my adventure'}</button>`);
  $('panel').classList.add('cine'); S.chAfter=after;
}
function start(data){
  if(data&&data.S&&data.S.v===2){ S=data.S; upgradeIdx(S); loadWorld(S.world||0); if(S.maxHp<200){ S.maxHp*=10; S.hp*=10; } if(S.genFoe) MONSTERS.gen=S.genFoe; S.books=(S.books||[]).map(b=>b==='heal'?'cleric1':b).filter(b=>BK[b]); S.handSize=Math.min(7,S.handSize); sel=data.sel||[]; busy=false; render(); if(S.phase==='play'&&S.fight){ closePanel(); if(S.fight.hp<=0){ busy=true; victory(); } else { drawUp(); render(); } } else resumePhase(); return; }
  migrateSaves(); const ch=readChallenge();
  /* the website's Continue button opens a hero's save directly */
  try{ const q=new URLSearchParams(location.search), n=+q.get('slot'); if(!ch && n>=1 && n<=3){ history.replaceState(null,'',location.pathname); const sv=loadSave(n)||loadSaved(n); if(sv){ setSlot(n); canSave=true; start({S:JSON.parse(JSON.stringify(sv.S))}); return; } } }catch(e){}
  if(anySlots()){ canSave=false; newRun(false); render(); if(ch){ challengePanel(ch,'title'); return; } slotsPanel(); return; }
  const first=!store.get('tutorialDone',false);
  canSave=false; newRun(first); render(); if(ch){ challengePanel(ch,'name'); return; } namePanel(1);
}
setInterval(()=>{ if(busy && Date.now()-busySince>15000){ busy=false;
  if(S.phase==='play'&&S.fight&&S.fight.hp<=0) victory(); else { if(S.fight&&S.phase==='play') drawUp(); render(); } } }, 2000);
window.claude?.hot?.snapshot?.(()=>({S, sel}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
