[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/play.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/daily.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/farkle.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/farkle.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/art/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/vid/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
    Access-Control-Allow-Origin = "*"

# The games read music through the Web Audio API, which needs the element to
# be CORS-clean - createMediaElementSource refuses a tainted one. On the web
# that is same-origin and fine, but the phone apps serve the game from
# capacitor:// and fetch the songs from here, so without this header every
# song is blocked and the game is silent with nothing in the console a player
# would ever see. Found while checking Monster Solitaire; Monster Farkle uses
# the same code and has the same problem waiting for it on iOS.
[[headers]]
  for = "/music/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
    Access-Control-Allow-Origin = "*"

[[redirects]]
  from = "https://www.axesandaces.com/*"
  to = "https://axesandaces.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/store/*"
  to = "/404.html"
  status = 404
  force = true
