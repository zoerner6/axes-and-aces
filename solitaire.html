/* ===================== how a fight starts =====================
   Four kinds of meeting, as in dev/game.html and dev/farkle.html, with the
   words changed to suit a reading rather than a hand of cards or a set of
   dice: Old Bram's deck tells you what is coming, so "you spot it first" is
   the cards warning you. */
const ENC = {
  ambush:{ title:'Ambush!',            text:'It was on you before the cards were down.' },
  spot:  { title:'The cards warn you', text:'It has not seen you yet.' },
  path:  { title:'Blocked',            text:'It will not let you past.' },
  boss:  { title:'',                   text:'It guards the way forward.' }
};
const SAY = {
  ambush:['Gotcha!', 'Fresh meat!', 'Surprise, hero!'],
  path:['You shall not pass.', 'Turn back, little hero.', 'This path is mine.'],
  boss:['Your quest ends here.', 'You will go no further.', 'Turn back, or fall like the others.']
};
const pickOne = a => a[rndInt(a.length)];

/* A typed line, so it arrives rather than just being there. The timers are
   held because an intro schedules its lines a second into the future, and a
   panel replaced before then had the old intro's words typed into it - which
   showed up as a monster that spots you saying "You shall not pass." */
/* One handle per element, not one for the whole page. An intro types two
   lines - what it says, then what is happening - and the second started four
   hundred milliseconds after the first. Sharing a single interval meant the
   caption killed the line mid-word, so every monster in the game was saying
   things like "Turn back, litt" and "You will go no". */
let typers = new Map(), introTimers = [];
function clearIntroTimers(){
  introTimers.forEach(clearTimeout); introTimers = [];
  typers.forEach(clearInterval); typers.clear();
}
const laterInIntro = (fn, ms) => introTimers.push(setTimeout(fn, ms));
function typeInto(el, text, speed = 26){
  if(!el) return;
  clearInterval(typers.get(el));
  if(reduced()){ el.textContent = text; return; }
  let n = 0;
  el.textContent = '';
  const id = setInterval(() => {
    if(!document.body.contains(el)){ clearInterval(id); typers.delete(el); return; }
    el.textContent = text.slice(0, ++n);
    if(n >= text.length){ clearInterval(id); typers.delete(el); }
  }, speed);
  typers.set(el, id);
}

/* The tape compares whole boards, not single blows, and the first version of
   it compared single blows and lied.

   dev/farkle.html can put one blow against one hit because a turn there is
   exactly that: you wind up, you strike, it answers. Here a board is eleven
   strikes, most of them a scratch - the measured median run is worth 21 and
   the mean 75 - and a third of a board's damage arrives as peak and clear
   bonuses that are not strikes at all. Against the first area boss, the
   per-blow tape read "you 19, it 35", which a player would correctly take to
   mean they lose. dev/gen/slbalance.cjs says they win that fight 68% of the
   time. Any per-blow number here, median or mean, tells the same lie.

   So the row is a whole board, which is also the unit the fight is fought in:
   one reading per monster. */
function tapeHTML(d){
  const board = Math.round((ROUND_AVG + BONUS_AVG) * lvlMult(S.level) * atkMult());
  const theirs = d.moves.filter(m => m.k === 'atk');
  const hit = theirs.length ? theirs.reduce((a, b) => a + b.n, 0) / theirs.length : 0;
  /* what it lands over the same board: one answer per strike, and only the
     attacking moves in its pattern actually land */
  const back = takeFrom(hit) * STRIKES * (theirs.length / d.moves.length);
  return `<div class="tape">
    <span class="who">You</span><span class="mid"></span><span class="who r">It</span>
    <b class="mine">${fmt(S.hp)}</b><span class="mid">Health</span><b class="theirs">${fmt(d.hp)}</b>
    <b class="mine">${fmt(armored(board, d))}</b><span class="mid">A whole board</span><b class="theirs">${fmt(back)}</b>
    <b class="mine">+${defense()}</b><span class="mid">Armor</span><b class="theirs">+${foeArmor(d)}</b>
  </div>`;
}

/* force lets dev/gen/slpanels.cjs open each of the four without playing until
   the right one happens to come up */
function fightIntro(force){
  clearIntroTimers();
  const d = S.fight;
  const kind = force || (d.boss ? 'boss' : ['ambush', 'spot', 'path'][rndInt(3)]);
  S.enc = kind;
  const t = ENC[kind];
  const title = kind === 'boss' ? `The ${d.name}!` : t.title;
  const line = kind === 'spot' ? 'The cards came up black.' : pickOne(SAY[kind] || SAY.path);
  openPanel(`
    <div class="scene">
      <img class="bg" src="art/${bgOf()}.webp" alt="">
      <img class="foe" src="art/${d.slug}.webp" alt="${d.name}">
      <span class="tag">${title}</span>
      ${kind === 'spot' ? '<span class="mark">?</span>' : ''}
    </div>
    <div class="say ${kind === 'spot' ? 'you' : ''}" id="encSay"></div>
    ${tapeHTML(d)}
    ${d.boss ? `<div class="tipbox"><b>${d.name}</b> fights by its own rule: ${d.rule.text}</div>` : ''}
    <p id="encCap"></p>
    <button class="btn big" data-act="fight">Fight!</button>`);
  laterInIntro(() => typeInto($('encSay'), line), kind === 'spot' ? 350 : 700);
  laterInIntro(() => typeInto($('encCap'), t.text, 18), 1100);
  if(kind === 'ambush') laterInIntro(() => { deadthud(); shake(); }, 300);
  if(kind === 'boss') laterInIntro(() => shake(2), 450);
  if(kind === 'spot') laterInIntro(() => { tone(880, .12, 'square', .05); tone(1320, .12, 'square', .05, .08); }, 1500);
}

/* ---------- starting one ---------- */
function startFight(){
  dailySeedOn();        /* on for the whole of what a fight draws from chance */
  const a = curArea(), [lo, hi] = AREA_LV(), boss = isBossStep();
  const L = boss ? hi : lo + Math.round(posIn() * (hi - lo) / Math.max(1, AREA_FIGHTS - 1));
  const kind = boss ? a.boss : a.pool[rndInt(a.pool.length)];
  const f = makeFoe(kind, L, boss);
  f.mv = 0; f.block = 0;
  if(boss) f.rule = bossRule();
  S.fight = f;
  S.block = 0;
  /* what the victory screen will want to know about how it was won */
  S.tookHit = false;
  S.ranDry = false;
  S.cleanRead = false;
  S.ironskin = false;            /* a potion lasts a fight, not a campaign */
  S.rage = false;

  $('stage').style.setProperty('--bgimg', `url(art/${bgOf()}.webp)`);
  document.body.className = 'w' + ((S.world || 0) % 10);
  $('foeName').textContent = f.name;
  const [k, t] = threatOf(f);
  $('lvTag').hidden = false;
  $('lvTag').className = 'lvtag ' + k;
  $('lvTag').textContent = `Lv ${f.lvl} · ${t}`;
  $('foeRule').hidden = !boss;
  if(boss) $('foeRule').textContent = f.rule.text;
  $('foePic').innerHTML = `<img src="art/${f.slug}.webp" alt="${f.name}" draggable="false">`;
  setFoeVideo(f.slug);
  setFoeBars(); setMyBars();
  S.phase = 'fight'; updateMusic();

  /* the board this fight is read on, bent by the boss rule if there is one */
  R = dealRound(boss ? f.rule.deal : {});
  openBoard();

  /* The very first board a new player ever sees has nothing in front of it.
     Everything else here opens behind a panel - two story beats and a fight
     intro - and that is three full screens of knights and kidnapping before
     a single card, to somebody who clicked a link that said Solitaire. The
     story is not cut, it is moved: it plays once the first fight is won, by
     which point a player knows what the game is and will read it. */
  if(!S.openingSeen && !S.daily){
    busy = false;
    coachMaybe();
  } else {
    busy = true;                 /* the board waits behind the intro */
    fightIntro();
  }
  dailySeedOff();
}


/* ===================== the round ===================== */
let R = null;        /* the round in play */

/* ===================== the board: Klondike =====================
   Seven columns, four foundations, aces up to kings. The one people mean
   when they say solitaire, so nothing here needs explaining to anybody.

   It was Tri-Peaks until it reached a player, who said what should have been
   obvious: you cannot call a thing Monster Solitaire and open on a game
   nobody knows, with a barkeep explaining its rules. Tri-Peaks is still here,
   further down, as something to meet later.

   The fight did not have to change at all, which is the sign the mapping is
   the right one:
     a chain of cards sent up    is the run you are winding up
     drawing from the stock      breaks it, and the blow lands
     a finished foundation       is the peak-down moment
     all four                    is the clear

   dev/gen/klondike.cjs measured it over thousands of games: an ordinary
   player wins 29.1%, sends 22.9 of the 52 cards up, and plays 95 moves. */

const RED_SUIT = s => s === 1 || s === 2;         /* hearts and diamonds */

function dealKlondike(opts = {}){
  const d = shuffle(freshDeck(), opts.rnd);
  /* A boss rule can bury the longest columns one card deeper. All seven at
     once measured at a 39% win rate, harsher than anything Tri-Peaks has, so
     the rule names how many. */
  const buried = opts.deeper === true ? 7 : (opts.deeper | 0);
  const cols = [];
  let k = 0;
  for(let c = 0; c < 7; c++){
    const col = { down: [], up: [] };
    const n = c + (c >= 7 - buried ? 1 : 0);
    for(let i = 0; i <= n && k < d.length; i++) (i === n ? col.up : col.down).push(d[k++]);
    cols.push(col);
  }

  /* Marked Deck: one column is dealt a card SHALLOWER - one fewer card in it
     altogether, which is a card you never have to dig out. */
  if(hasCharm('marked')){
    const deep = cols.filter(c => c.down.length);
    if(deep.length) deep[rndInt(deep.length)].down.pop();
  }
  /* Reader's Glass: the column with the most buried cards has its top buried
     card dealt FACE UP instead. The same depth, one more thing you can see,
     which is why it is the cheaper of the two. On Tri-Peaks this happens in
     openBoard, because there the card is marked on top of the board rather
     than lifted out of a column. */
  if(hasCharm('glass')){
    let worst = null;
    for(const c of cols) if(c.down.length && (!worst || c.down.length > worst.down.length)) worst = c;
    if(worst) worst.up.unshift(worst.down.pop());
  }

  /* Deep Deck: three more cards in the stock per copy. Fifty-two cards are
     exactly 28 dealt and 24 in the stock, so there is nothing spare in the
     deck to give - the extras come off a second shuffle, which is the same
     answer dealPeaks reached. */
  const stock = d.slice(k);
  const extra = 3 * perkCount('deep');
  if(extra) stock.push(...shuffle(freshDeck(), opts.rnd).slice(0, extra));

  return {
    kind: 'klondike',
    cols, found: [0, 0, 0, 0],
    stock, waste: [],
    passes: 0, maxPass: opts.passes || 3,
    run: 0, runVal: 0,
    done: [],                     /* foundations already finished, so each lands once */
    cap: opts.cap || RUN_CAP,     /* a boss can shorten it; it is never off */
    wild: hasPerk('wild'),
    coin: hasCharm('jester'),
    picked: null,                 /* a card the player has tapped and not yet placed */
  };
}

/* ---------- the rules ---------- */
const colTop = col => col.up[col.up.length - 1];
const wasteTop = () => R.waste[R.waste.length - 1];
const foundOK = c => c && R.found[c.s] === c.r - 1;
const stackOK = (c, onto) => onto && onto.r === c.r + 1 && RED_SUIT(c.s) !== RED_SUIT(onto.s);
/* a king goes to an empty column, and Wild Ace lets anything go there once */
const emptyOK = (c, col) => !col.up.length && !col.down.length && (c.r === 13 || R.wild);

/* Where a tapped card wants to go. Foundations first, because that is what a
   player means by tapping a card, then a column that will take it. Tap to
   move rather than drag: a drag on a 41px card is a miss waiting to happen. */
function bestMove(from){
  const c = from.card;
  if(foundOK(c)) return { to:'found' };
  for(let j = 0; j < 7; j++){
    if(from.col === j) continue;
    const col = R.cols[j];
    /* moving the whole of a column onto an empty one achieves nothing */
    if(!col.up.length && !col.down.length && from.col >= 0 &&
       from.n === 0 && !R.cols[from.col].down.length) continue;
    if(col.up.length ? stackOK(c, colTop(col)) : emptyOK(c, col)) return { to:'col', j };
  }
  return null;
}

/* everything the player could legally do right now */
function klondikeLegal(){
  const out = [];
  const w = wasteTop();
  if(w && (foundOK(w) || R.cols.some((col, j) => col.up.length ? stackOK(w, colTop(col)) : emptyOK(w, col))))
    out.push({ col:-1, n:-1, card:w });
  R.cols.forEach((col, i) => {
    col.up.forEach((card, n) => {
      const from = { col:i, n, card };
      if(bestMove(from)) out.push(from);
    });
  });
  return out;
}

const klondikeCleared = () => R.found.every(f => f === 13);
const klondikeStuck = () => !klondikeLegal().length &&
  !R.stock.length && (R.passes >= R.maxPass || !R.waste.length);

/* ---------- drawing it ----------
   The tableau is a fixed height and the columns compress to fit it. A column
   runs 11.3 cards deep on average and 18 at the worst, which no fixed step
   survives on a 568-tall phone: at 18px a card the worst column is 364px and
   there is no phone that holds that plus a monster. So each column works out
   its own step. Face-down cards take 5px - you only need to see that they are
   there - and the face-up ones share what is left, never below 9px and never
   above 18. The worst case measured still gives every face-up card 14.7px. */
const KL_TAB_H = 250;

function klCardHTML(c, cls, attrs){
  return `<button class="pk kl ${cls}${RED_SUIT(c.s) ? ' red' : ''}" ${attrs}>${cardFace(c)}</button>`;
}
function klBackHTML(cls, attrs){
  return `<button class="pk kl down ${cls}" ${attrs}></button>`;
}

function drawKlondike(){
  /* the row that is not the tableau: stock, waste, then the four homes */
  const stock = R.stock.length
    ? `<button class="pk kl down" data-act="draw">${peek()}</button>
       <span class="stockn">${R.stock.length}</span>`
    : (R.passes < R.maxPass && R.waste.length
        ? `<button class="kl-slot again" data-act="draw" aria-label="Turn the pile back over">
             <span>${R.maxPass - R.passes}</span></button>`
        : `<div class="kl-slot empty"></div>`);
  const w = wasteTop();
  const waste = w
    ? klCardHTML(w, '', `data-from="w" aria-label="${RANKS[w.r]} of ${SUITS[w.s].name}"`)
    : `<div class="kl-slot empty"></div>`;

  const homes = R.found.map((top, s) => {
    const cls = R.done.includes(s) ? ' done' : '';
    const inner = top
      ? klCardHTML({ r:top, s }, 'home' + cls, `data-home="${s}"`)
      : `<div class="kl-slot home${cls}" data-home="${s}"><span>${SUITS[s].ch}</span></div>`;
    return `<div class="kl-cell">${inner}</div>`;
  }).join('');

  /* seven cells across, matching the columns below: the deck, the card it
     turned over, a gap, then the four homes */
  const top = `<div class="kl-top">
      <div class="kl-cell">${stock}</div>
      <div class="kl-cell">${waste}</div>
      <div class="kl-cell"></div>
      ${homes}
    </div>`;

  /* The columns carry only what they are, not where they sit. A card's
     position depends on the card HEIGHT, which depends on the column width,
     which nothing knows until this is in the document - so layoutKlondike
     places them immediately afterwards, and sizes the tableau to the deepest
     column rather than to the worst case. A fixed 250px box left a lake of
     empty space under a fresh deal, where every column is one card tall. */
  const cols = R.cols.map((col, i) => {
    const down = col.down.map(() =>
      klBackHTML('', `data-kind="down" tabindex="-1" aria-hidden="true"`)).join('');
    const up = col.up.map((card, n) => {
      const live = !!bestMove({ col:i, n, card });
      return klCardHTML(card, live ? 'live' : '',
        `data-kind="up" data-from="c" data-col="${i}" data-n="${n}"` + (live ? '' : ' tabindex="-1"'));
    }).join('');
    return `<div class="kl-col" data-col="${i}">${down}${up}</div>`;
  }).join('');

  return top + `<div class="kl-cols" id="klCols">${cols}</div>` + drawRunBox();
}

/* Where every card in every column actually sits. Face-down cards take a
   ninth of a card each - you only need to see they are there - and the
   face-up ones share what is left of the tableau, never closer than a sixth
   of a card and never further than a third. A column runs 11.3 deep on
   average and 18 at the worst, so the step has to give. */
const KL_DOWN_F = 0.09, KL_UP_MIN_F = 0.16, KL_UP_MAX_F = 0.31;
function layoutKlondike(){
  const wrap = $('klCols');
  if(!wrap) return;
  const first = wrap.querySelector('.kl-col');
  if(!first) return;
  const cw = first.getBoundingClientRect().width;
  if(cw < 2) return;
  const ch = cw * 1.4;
  /* How tall the tableau is ALLOWED to be. This was a fraction of the window
     and the fraction was a guess: 0.42 came to 238px on a 320x568 phone, the
     board came out 239, and the run box - the number the whole fight is about
     - ended twelve pixels below the screen on a deep board.
     So measure instead. The room is from the top of the columns to the bottom
     of the window, less whatever sits under them, and `room` is read again
     after the height is set because a taller board can move its own top. */
  const room = () => {
    const top = wrap.getBoundingClientRect().top;
    const run = $('runbox');
    const under = run ? Math.ceil(run.getBoundingClientRect().height) + 12 : 12;
    return Math.max(ch, innerHeight - top - under);
  };
  let capH = Math.min(KL_TAB_H, room());

  let tallest = ch;
  const plans = [...wrap.querySelectorAll('.kl-col')].map(col => {
    const cards = [...col.children];
    const nDown = cards.filter(e => e.dataset.kind === 'down').length;
    const nUp = cards.length - nDown;
    const downY = nDown * KL_DOWN_F * ch;
    /* what the column would like, then what it is allowed */
    const want = downY + Math.max(0, nUp - 1) * KL_UP_MAX_F * ch + ch;
    const allowed = Math.min(want, capH);
    const step = nUp > 1
      ? Math.max(KL_UP_MIN_F * ch, Math.min(KL_UP_MAX_F * ch, (allowed - ch - downY) / (nUp - 1)))
      : 0;
    const height = downY + Math.max(0, nUp - 1) * step + ch;
    if(height > tallest) tallest = height;
    return { cards, nDown, step, ch };
  });

  const place = () => plans.forEach(({ cards, ch }, i) => {
    let y = 0;
    cards.forEach(el => {
      el.style.top = y + 'px';
      if(el.dataset.kind === 'down') y += KL_DOWN_F * ch;
      else y += plans[i].step;
    });
    /* the sliver this column's covered cards get, so the corner can size
       itself to what is actually visible of it */
    if(cards[0]) cards[0].parentNode.style.setProperty('--step', Math.round(plans[i].step) + 'px');
  });
  place();
  wrap.style.height = Math.ceil(tallest) + 'px';

  /* Second pass, only when the first one overflowed. Setting the height can
     move the columns' own top, so the room has to be asked again with the
     board at its real size - and if there is now less of it, everything is
     worked out once more against the smaller number. One extra pass is
     enough: the board only ever shrinks here, which can only give room back. */
  const left = Math.min(KL_TAB_H, room());
  if(left < tallest - 1){
    capH = left;
    tallest = ch;
    plans.forEach(pl => {
      const nUp = pl.cards.length - pl.nDown;
      const downY = pl.nDown * KL_DOWN_F * ch;
      const want = downY + Math.max(0, nUp - 1) * KL_UP_MAX_F * ch + ch;
      const allowed = Math.min(want, capH);
      pl.step = nUp > 1
        ? Math.max(KL_UP_MIN_F * ch, Math.min(KL_UP_MAX_F * ch, (allowed - ch - downY) / (nUp - 1)))
        : 0;
      const height = downY + Math.max(0, nUp - 1) * pl.step + ch;
      if(height > tallest) tallest = height;
    });
    place();
    wrap.style.height = Math.ceil(tallest) + 'px';
  }
}

function drawRunBox(){
  return `<div class="runbox ${R.run >= 8 ? 'wild' : R.run >= 5 ? 'hot' : ''}" id="runbox" style="--r:${R.run}">
      <b>${R.run}</b><small>Run</small></div>`;
}

/* ---------- playing it ---------- */
async function klondikeTap(from){
  if(busy) return;
  const m = bestMove(from);
  if(!m){ return; }
  busy = true;

  const card = from.card;
  let run = [];
  if(from.col < 0) { R.waste.pop(); run = [card]; }
  else run = R.cols[from.col].up.splice(from.n);

  if(m.to === 'found'){
    R.found[card.s] = card.r;
    R.run++; R.runVal += valueOf(card.r);
    if(from.col >= 0) klFlip(R.cols[from.col]);
    render(); bumpRun(); cardSnap(R.run);
    coachDone('play');

    /* a finished suit is this game's peak coming down */
    if(R.found[card.s] === 13 && !R.done.includes(card.s)){
      R.done.push(card.s);
      await suitHome(card.s);
      if(S.fight.hp <= 0){ await won(); return; }
    }
    if(R.cap && R.run >= R.cap && !klondikeCleared()){
      /* Reaching the board's own cap is the top of the meter, so it reads as
         the thing you were building. A boss cap is shorter than the board's,
         and that one reads as being cut off - which is what it is. */
      if(R.cap < RUN_CAP) banner('Cut short', `A run cannot pass ${R.cap}`);
      else banner(`${R.cap} in a row`, 'That is all one swing will carry');
      await wait(520);
      await doStrike();
      if(S.fight.hp <= 0){ await won(); return; }
      if(S.hp <= 0){ await lost(); return; }
    }
  } else {
    /* onto a column: no blow, but it is how the board opens up */
    if(R.wild && !(card.r === 13) && !R.cols[m.j].up.length && !R.cols[m.j].down.length){
      R.wild = false;
      banner('Wild Ace', 'Any card can take an empty column, once');
      tone(988, .18, 'triangle', .06);
    }
    R.cols[m.j].up.push(...run);
    if(from.col >= 0) klFlip(R.cols[from.col]);
    render(); cardSnap();
    /* The mark says "tap a card to move it", so moving a card is what ends
       it. This only fired when a card went HOME, which left the mark stuck
       on screen for anyone whose first tap was onto a column - and on a
       320px board three of the opening cards move to a column and none goes
       home, so that was most first taps. */
    coachDone('play');
  }
  busy = false;
  afterMove();
  coachMaybe();
}
const klFlip = col => { if(!col.up.length && col.down.length) col.up.push(col.down.pop()); };

/* a whole suit home: the moment this game has instead of a peak coming down */
async function suitHome(s){
  const el = document.querySelector(`[data-home="${s}"]`);
  if(el){
    const r = el.getBoundingClientRect();
    goldBurst(r.left + r.width / 2, r.top + r.height / 2, 150);
  }
  tone(660, .18, 'triangle', .07); tone(880, .2, 'sine', .05, .08);
  banner(`${SUITS[s].name} home`, `${4 - R.done.length} suits left`);
  if(R.done.length < 4) setTimeout(() => coachShow('clear'), 1600);
  await wait(420);
  await bonusBlow(PEAK_BONUS, 2);
  coachDone('clear');
}

/* Turning a card is how a run ends, so this is where the blow lands. */
async function klondikeDraw(){
  if(busy) return;
  busy = true;
  if(R.run){
    await doStrike();
    if(S.fight.hp <= 0){ await won(); return; }
    if(S.hp <= 0){ await lost(); return; }
  }
  if(R.stock.length){
    R.waste.push(R.stock.pop());
  } else if(R.passes < R.maxPass && R.waste.length){
    R.stock = R.waste.reverse(); R.waste = []; R.passes++;
    banner('Round again', `${R.maxPass - R.passes} ${R.maxPass - R.passes === 1 ? 'pass' : 'passes'} left`);
  }
  cardSnap();
  render();
  coachDone('stock');
  busy = false;
  afterMove();
  coachMaybe();
}

/* ===================== the board: Tri-Peaks =====================
   The game this used to be, kept whole. It is a better fight than Klondike
   and a worse first impression, which is the trade it lost on: a player who
   clicks Solitaire has to recognise what they are looking at. It comes back
   later as something to unlock. */
function dealPeaks(opts = {}){
  const wrap = opts.wrap !== false;
  /* Deep Deck: three more cards in the stock, and it stacks if taken twice */
  const stockSize = (opts.stock || 24) + 3 * perkCount('deep');
  const d = shuffle(freshDeck(), opts.rnd);
  const tableau = d.slice(0, 28).map((c, i) => ({...c, i, gone: false}));
  /* A deck is 52 and the tableau takes 28, which leaves exactly the 24 a
     standard stock wants and not one card more. So Deep Deck cannot simply
     ask for 27: the cards are not there, and asking for them silently gave
     back 24, which is a perk that does nothing. They come off a second
     shuffle instead - the ranks are a ring of thirteen with four of each
     already, so another five of a rank changes nothing about how the board
     reads. */
  let stock = d.slice(28, 28 + stockSize);
  if(stock.length < stockSize){
    stock = stock.concat(shuffle(freshDeck(), opts.rnd).slice(0, stockSize - stock.length));
  }
  /* Marked Deck takes the tip off one peak, so that peak is five cards deep
     rather than six and the two under it are free from the start. */
  if(hasCharm('marked')) tableau[rndInt(3)].gone = true;

  return {
    kind: 'peaks',
    wrap, tableau, stock,
    si: 1,                        /* the first stock card starts the waste */
    waste: [stock[0]],
    run: 0, runVal: 0,
    down: [],                     /* peaks already taken down, so each lands once */
    hidden: opts.hidden || [],    /* peaks dealt face down, for boss rules */
    shown: [],                    /* cards Reader's Glass turned over anyway */
    cap: opts.cap || 0,           /* a boss rule that breaks the run at a length */
    wild: hasPerk('wild'),        /* Wild Ace, still unspent on this board */
    coin: hasCharm('jester'),     /* Jester's Coin, still unspent on this board */
  };
}

/* Which board a fight is played on, and the one door every deal goes through.
   useBoard is called here rather than at the start of a fight because this is
   the only place that cannot be skipped: a deal from a loaded save, from the
   daily, from a boss rule and from the opening board all arrive here, and the
   fight maths has to be the right board's before the first card is turned. */
function dealRound(opts = {}){
  if(S.nextBoard){ S.board = S.nextBoard; S.nextBoard = null; }
  const kind = opts.kind || boardKind();
  useBoard(kind);
  return kind === 'peaks' ? dealPeaks(opts) : dealKlondike(opts);
}
const isPeaks = () => R.kind !== 'klondike';

const isGone = i => R.tableau[i].gone;
const isExposed = i => !isGone(i) && LAYOUT.covers[i].every(isGone);
/* Wild Ace: with the perk, and once a board, an ace on the waste takes
   anything. It is checked here rather than in takes() so the rule stays about
   the ranks and this stays about what the player is carrying. */
const wildOn = () => R.wild && wasteTop().r === 1;
const canPlay = i => isExposed(i) && isFaceUp(i) &&
  (takes(R.tableau[i].r, wasteTop().r, R.wrap) || wildOn());

/* A card is face up once nothing covers it. Boss rounds can deal a whole peak
   face down, which only means its cards stay hidden until uncovered. */
function isFaceUp(i){
  if(!R.hidden.includes(LAYOUT.peak[i])) return true;
  if((R.shown || []).includes(i)) return true;      /* Reader's Glass turned this one */
  return LAYOUT.covers[i].every(isGone);
}

/* ===================== drawing ===================== */
function cardFace(c){
  const s = SUITS[c.s];
  const art = FACE_ART[c.r];
  /* the corner carries rank and suit on every card; the painted face is extra,
     and the CSS above hides it on a card too narrow to show it properly */
  return `<span class="cn">${RANKS[c.r]}<i>${s.ch}</i></span>` +
         (art ? `<span class="mid"><img src="${art}" alt=""></span>` : '');
}

function drawPeaks(){
  const out = [];
  for(let i = 0; i < 28; i++){
    const c = R.tableau[i], p = LAYOUT.pos[i];
    if(c.gone){ continue; }
    const up = isFaceUp(i), free = canPlay(i);
    const cls = ['pk'];
    if(!up) cls.push('down');
    else if(SUITS[c.s].red) cls.push('red');
    if(free) cls.push('free');
    out.push(
      `<button class="${cls.join(' ')}" data-i="${i}" data-row="${p.row}" ` +
      `style="--x:${p.x};--row:${p.row}" ${free ? '' : 'tabindex="-1" aria-disabled="true"'}>` +
      (up ? cardFace(c) : '') + `</button>`
    );
  }
  return out.join('');
}

function drawTable(){
  const w = wasteTop();
  return `<div class="table">
    <div class="slot" id="stock">
      ${R.si < R.stock.length ? `<button class="pk down" data-act="turn" style="--x:0;--row:0">${peek()}</button>` : '<div class="slot empty"></div>'}
      ${R.si < R.stock.length ? `<span class="stockn">${R.stock.length - R.si}</span>` : ''}
    </div>
    <div class="runbox ${R.run >= 8 ? 'wild' : R.run >= 5 ? 'hot' : ''}" id="runbox" style="--r:${R.run}">
      <b>${R.run}</b><small>Run</small>
    </div>
    <div class="slot${R.coin && R.waste.length > 1 ? ' usable' : ''}" id="wasteslot">
      <div class="pk ${SUITS[w.s].red ? 'red' : ''}" style="--x:0;--row:0">${cardFace(w)}</div>
      ${R.coin && R.waste.length > 1
        ? `<button class="coinmark" data-act="coin" aria-label="Jester's Coin: put this card back">
             <img src="art/i_coin.webp" alt=""></button>` : ''}
    </div>
  </div>`;
}

/* Second Sight: the next stock card, shown small on the back of the deck. It
   is the only perk that changes nothing about the numbers and everything
   about the decision - knowing what is coming is the difference between
   gambling on a longer run and knowing it is there. */
function peek(){
  if(!hasPerk('sight')) return '';
  /* The two boards keep their stock the opposite way round: Tri-Peaks walks
     an index forward through it, Klondike pops off the end. The next card is
     the next card either way, and reading it the wrong way round would show
     the card at the BOTTOM of the deck - a perk that lies rather than one
     that does nothing, which is worse. */
  const c = isPeaks()
    ? (R.si < R.stock.length ? R.stock[R.si] : null)
    : R.stock[R.stock.length - 1];
  if(!c) return '';
  const s = SUITS[c.s];
  return `<span class="peek${s.red ? ' red' : ''}">${RANKS[c.r]}${s.ch}</span>`;
}

function render(){
  coachClear();
  $('board').innerHTML = isPeaks()
    ? `<div class="peaks" id="peaks">${drawPeaks()}</div>` + drawTable()
    : drawKlondike();
  if(!isPeaks()) layoutKlondike();
}

/* ===================== sound =====================
   Cards, not dice: a short paper snap off a band-passed noise burst, built the
   same way dev/game.html and dev/farkle.html build theirs, so nothing has to
   ship as an audio file. */
let ac = null, noiseBuf = null;
let soundOn = store.get('sound', true);
function audio(){
  if(!ac){ try{ ac = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  if(ac && ac.state === 'suspended') ac.resume();
  return ac;
}
function noise(){
  if(!noiseBuf){
    noiseBuf = ac.createBuffer(1, ac.sampleRate * .4, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const s = ac.createBufferSource(); s.buffer = noiseBuf; return s;
}
function tone(f, dur, type = 'triangle', vol = .07, delay = 0){
  if(!soundOn || !audio()) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .012);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + .02);
}
/* one card landing on the pile. It rises in pitch with the run, so a player
   hears the chain building before they look at the number. */
function cardSnap(step = 0){
  if(!soundOn || !audio()) return;
  const t = ac.currentTime, n = noise(), f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'bandpass'; f.frequency.value = 2200 + Math.min(step, 10) * 190; f.Q.value = 1.1;
  g.gain.setValueAtTime(.13, t); g.gain.exponentialRampToValueAtTime(.0001, t + .07);
  n.connect(f); f.connect(g); g.connect(ac.destination); n.start(t); n.stop(t + .09);
  tone(320 + Math.min(step, 10) * 36, .06, 'sine', .035);
}
function swoosh(){
  if(!soundOn || !audio()) return;
  const t = ac.currentTime, n = noise(), f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'bandpass'; f.frequency.setValueAtTime(2600, t); f.frequency.exponentialRampToValueAtTime(380, t + .22);
  g.gain.setValueAtTime(.1, t); g.gain.exponentialRampToValueAtTime(.0001, t + .24);
  n.connect(f); f.connect(g); g.connect(ac.destination); n.start(t); n.stop(t + .26);
}
const deadthud = () => { tone(104, .26, 'sawtooth', .09); tone(66, .34, 'sine', .11, .02); };

/* ===================== music =====================
   The same recorded songs the other two games use, with the same trick for
   looping without a gap: a loop overlaps itself on purpose, but moving to a
   DIFFERENT song clears the old one out first, because two tunes in two keys
   at once is just a mess. */
let musicOn = store.get('music', true);
let musBus = null, song = null, songPending = null;
const SONG_BAD = new Set();
function songWant(){
  if(!musicOn || !S) return null;
  if(S.phase === 'fight'){
    if(S.fight && S.fight.boss) return 'boss';
    return 'fight' + (1 + ((S.step || 0) % 2));
  }
  return 'w' + (((S.world || 0) % 10) + 1);
}
function songStart(id){
  if(!audio() || SONG_BAD.has(id)) return null;
  if(!musBus){ musBus = ac.createGain(); musBus.gain.value = .5; musBus.connect(ac.destination); }
  const a = new Audio(`${REMOTE}music/${id}.mp3`);
  a.preload = 'auto'; a.crossOrigin = 'anonymous';
  let node; try{ node = ac.createMediaElementSource(a); }catch(e){ SONG_BAD.add(id); return null; }
  const g = ac.createGain(); g.gain.value = 0;
  node.connect(g); g.connect(musBus);
  const me = { id, a, g, next:false };
  a.addEventListener('error', () => { SONG_BAD.add(id); if(song === me){ song = null; updateMusic(); } });
  a.addEventListener('timeupdate', () => {
    if(song === me && !me.next && a.duration && a.currentTime > a.duration - 4){ me.next = true; songSwap(id, true); }
  });
  a.play().then(() => g.gain.setTargetAtTime(1, ac.currentTime, .7)).catch(() => {});
  return me;
}
function songStop(me, after, tc){
  if(!me) return;
  try{ me.g.gain.setTargetAtTime(0, ac.currentTime, tc || .6); }catch(e){}
  setTimeout(() => { try{ me.a.pause(); me.g.disconnect(); }catch(e){} }, after || 3500);
}
function songSwap(id, loop){
  const old = song;
  if(loop){ song = songStart(id); songStop(old); return; }
  songStop(old, 420, .13); song = null; songPending = id;
  setTimeout(() => {
    if(songPending !== id) return;
    songPending = null;
    if(!song && songWant() === id) song = songStart(id);
  }, 400);
}
function updateMusic(){
  const want = songWant();
  if(!want){ songStop(song); song = null; return; }
  if(song && song.id === want) return;
  songSwap(want, false);
}
const bigBoom = t => { tone(55, .5 + t * .1, 'sine', .17); tone(42, .7, 'sawtooth', .06, .03); if(t >= 3) tone(30, .9, 'sine', .13, .06); };

/* ===================== things that fly across the screen ===================== */
const wait = ms => new Promise(r => setTimeout(r, ms));
function anim(el, cls){
  if(!el) return;
  if(el === $('foePic') && $('stage').classList.contains('hasvid')) el = $('foeVidWrap');
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), 1300);
}
function shake(t = 1){
  if(reduced()) return;
  const a = $('app');
  a.classList.remove('shake', 'shake2', 'shake3'); void a.offsetWidth;
  a.classList.add(t >= 3 ? 'shake3' : t >= 2 ? 'shake2' : 'shake');
  setTimeout(() => a.classList.remove('shake', 'shake2', 'shake3'), 700);
}
function banner(t, small){
  const b = $('banner');
  b.innerHTML = small ? `${t}<small>${small}</small>` : t;
  b.className = 'banner'; void b.offsetWidth; b.classList.add('show');
}
function pop(el, text, cls){
  if(!el) return;
  const r = el.getBoundingClientRect(), s = document.createElement('div');
  s.className = 'pop ' + cls; s.textContent = text;
  s.style.left = (r.left + r.width / 2 + (Math.random() * 18 - 9)) + 'px';
  s.style.top = r.top + 'px';
  $('fx').appendChild(s); setTimeout(() => s.remove(), 1050);
}
function stageCenter(){
  const r = $('stage').getBoundingClientRect();
  return { x:r.left + r.width / 2, y:r.top + r.height * .55, r };
}
/* the axe going through it, once per tier of the hit */
async function slashes(n){
  const { x, y, r } = stageCenter();
  for(let i = 0; i < n; i++){
    if(!reduced()){
      const el = document.createElement('div');
      el.className = 'slash';
      const a = (i % 2 ? 148 : 32) + (Math.random() * 34 - 17);
      const w = Math.max(200, Math.min(900, Math.min(r.width, r.height * 1.6) * .8)), h = Math.max(6, Math.round(w / 38));
      el.style.width = w + 'px'; el.style.height = h + 'px';
      el.style.margin = `${-h / 2}px 0 0 ${-w / 2}px`;
      el.style.left = (x + Math.random() * w / 5 - w / 10) + 'px';
      el.style.top = (y + Math.random() * 60 - 30) + 'px';
      el.style.setProperty('--a', a + 'deg');
      $('fx').appendChild(el); setTimeout(() => el.remove(), 420);
    }
    swoosh(); anim($('foePic'), 'hit');
    await wait(n > 3 ? 92 : 118);
  }
}
function damageBurst(n, tier){
  const { x, y } = stageCenter();
  if(!reduced()){
    const b = document.createElement('div');
    b.className = 'boom'; b.style.left = x + 'px'; b.style.top = y + 'px';
    b.style.width = b.style.height = (120 + tier * 34) + 'px';
    $('fx').appendChild(b); setTimeout(() => b.remove(), 700);
  }
  const t = document.createElement('div');
  t.className = 'dmgnum'; t.style.left = x + 'px'; t.style.top = y + 'px';
  t.textContent = '0'; $('fx').appendChild(t);
  const ms = reduced() ? 1 : 420, t0 = performance.now();
  (function step(now){
    const k = Math.min(1, (now - t0) / ms);
    t.textContent = fmt(Math.round(n * (1 - Math.pow(1 - k, 3))));
    if(k < 1) requestAnimationFrame(step);
    else { t.textContent = fmt(n); t.classList.add('out'); setTimeout(() => t.remove(), 700); }
  })(t0);
}
function claws(){
  if(reduced()) return;
  const r = $('heroBox').getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const fl = document.createElement('div'); fl.className = 'redflash';
  $('fx').appendChild(fl); setTimeout(() => fl.remove(), 460);
  [-1, 0, 1].forEach((k, i) => {
    const c = document.createElement('div'); c.className = 'claw';
    c.style.left = (cx + k * 32) + 'px'; c.style.top = (cy - 10 + k * 9) + 'px';
    c.style.animationDelay = (i * 45) + 'ms';
    $('fx').appendChild(c); setTimeout(() => c.remove(), 700);
  });
}

/* ===================== the strike =====================
   The blow is the run's total card value times its length. That shape is the
   whole game in one line: a second card is worth more than twice a first,
   because it multiplies everything before it as well as adding to it.

   The tiers are set off the measured spread rather than picked. One blow came
   out at a median of 21 and a 90th percentile of 200 over 200,000 rounds, so
   most strikes are a scratch and the rare long run is the event - which is the
   feeling the game is for. A run of eight comes to about 470 and gets the full
   treatment; a run of one is worth seven and stays out of the way. */
const STRIKE_TIERS = [
  [0,   'Hit!'],
  [0.6, 'Solid hit!'],
  [1.6, 'Brutal!'],
  [3.3, 'Devastating!'],
  [6,   'Legendary!'],
];
const strikeTier = w => {
  let t = 0;
  STRIKE_TIERS.forEach((x, i) => { if(w / BLOW_AVG >= x[0]) t = i; });
  return t;
};
const runBlow = () => R.runVal * R.run * SCALE;
const strikeDamage = w =>
  armored(Math.round(w * lvlMult(S.level) * atkMult() * (S.rage ? 1.5 : 1)), S.fight);

/* The waste pile is where the run has been kept, so when the blow lands that
   is the pile that goes into it. A number appearing out of nowhere reads as a
   number; cards flying into the monster reads as the thing you built. */
function sweepWaste(n){
  const slot = $('wasteslot');
  if(reduced() || !slot) return wait(60);
  const { x, y } = stageCenter();
  const r = slot.getBoundingClientRect();
  const many = Math.min(n, 6);
  for(let k = 0; k < many; k++){
    const f = document.createElement('div');
    f.className = 'flyer';
    f.style.left = r.left + 'px'; f.style.top = r.top + 'px';
    f.style.width = r.width + 'px'; f.style.height = r.height + 'px';
    $('fx').appendChild(f);
    f.animate([
      { transform:'none', opacity:1 },
      { transform:`translate(${x - r.left - r.width / 2}px, ${y - r.top - r.height / 2}px) ` +
                  `scale(.4) rotate(${120 + rndInt(200)}deg)`, opacity:0 }
    ], { duration:360, delay:k * 46, easing:'cubic-bezier(.5,0,.75,.2)', fill:'forwards' });
    setTimeout(() => f.remove(), 400 + k * 46);
  }
  return wait(360 + many * 46);
}

/* opts.answer false means the monster does not get its move back - used when
   the board was cleared, because clearing is already the reward */
async function doStrike(opts = {}){
  /* Long Memory: a run of five or more lands twice as hard */
  const long = hasPerk('long') && R.run >= 5;
  const ring = hasCharm('ring') && R.run >= 6;      /* Gambler's Ring */
  const w = runBlow() * (long ? 2 : 1) * (ring ? 1.25 : 1);
  if(!w) return;
  const tier = strikeTier(w), dmg = strikeDamage(w);
  const len = R.run;
  if(len > (S.bestRun || 0)) S.bestRun = len;     /* the thing worth bragging about */
  R.run = 0; R.runVal = 0;
  /* drawn straight away, before the cards start flying: the run is spent the
     moment the blow begins, and leaving the old count on screen through the
     sweep showed a number the player no longer had */
  render();

  await sweepWaste(len);
  banner(STRIKE_TIERS[tier][1], long ? `Run of ${len} &middot; Long Memory` : `Run of ${len}`);
  await slashes(tier + 1);

  const f = S.fight, absorbed = Math.min(f.block, dmg);
  f.block -= absorbed; f.hp -= dmg - absorbed;
  if(S.daily) S.daily.score += dmg - absorbed;
  damageBurst(dmg - absorbed, tier);
  if(absorbed) pop($('foeBlock'), `${fmt(absorbed)} blocked`, 'b');
  if(tier >= 2){ bigBoom(tier); shake(tier >= 3 ? 3 : 2); }
  else if(dmg - absorbed >= f.max * .25) shake(1);
  setFoeBars();
  render();
  await wait(tier >= 3 ? 900 : 640);

  if(f.hp <= 0) return;
  if(opts.answer !== false) await foeTurn();
}

/* ===================== the monster's move =====================
   One a strike, not one a stock turn. A stock turn taken while already stuck
   at a run of nothing is hunting for a card, and hunting is not something to
   be punished for - see STRIKES at the top of this file for what happens when
   it is. */
async function foeTurn(mult){
  const f = S.fight;
  const atks = f.moves.filter(m => m.k === 'atk');
  const mv = mult
    ? { k:'atk', n:Math.round(atks.reduce((a, b) => a + b.n, 0) / Math.max(1, atks.length) * mult) }
    : f.moves[f.mv++ % f.moves.length];
  await wait(200);

  if(mv.k === 'atk'){
    const hitMs = playFoeAttack();
    if(!hitMs){ anim($('foePic'), 'lunge'); swoosh(); }
    await wait(hitMs || 320);
    swoosh(); claws();
    const after = Math.max(1, Math.round(takeFrom(mv.n) * (S.ironskin ? .5 : 1)));
    const absorbed = Math.min(S.block, after); S.block -= absorbed;
    const dmg = Math.max(0, after - absorbed);
    S.hp = Math.max(0, S.hp - dmg);
    if(dmg > 0) S.tookHit = true;
    if(absorbed) pop($('heroBox'), `${fmt(absorbed)} blocked`, 'b');
    if(dmg > 0){
      setMyBars(); anim($('heroBox'), 'flash'); deadthud();
      const r = $('heroBox').getBoundingClientRect();
      const t = document.createElement('div');
      t.className = 'hurtnum'; t.textContent = '-' + fmt(dmg);
      t.style.left = (r.left + r.width / 2) + 'px'; t.style.top = r.top + 'px';
      $('fx').appendChild(t); setTimeout(() => t.remove(), 1250);
      shake(mult ? 2 : 1);
    }
    await wait(620);
  } else if(mv.k === 'blk'){
    f.block += mv.n;
    anim($('foeVidWrap'), 'shieldglow');
    pop($('foeBlock'), `Guard +${fmt(mv.n)}`, 'b');
    tone(330, .22, 'triangle', .06); tone(495, .2, 'sine', .04, .07);
    setFoeBars();
    await wait(560);
  } else {
    f.hp = Math.min(f.max, f.hp + mv.n);
    anim($('foeVidWrap'), 'healglow');
    pop($('foePic'), `+${fmt(mv.n)}`, 'h');
    tone(523, .2, 'sine', .05); tone(784, .22, 'sine', .04, .08);
    setFoeBars();
    await wait(560);
  }
  setFoeBars();
}

/* ===================== the level ladder =====================
   The same ladder the other two games climb, so a player who has met Sir
   Edward before knows what a level is worth. */
const xpNeed = L => Math.round(40 * Math.pow(1.35, Math.max(1, L) - 1));
const cumNeed = L => { let t = 0; for(let i = 1; i <= L; i++) t += xpNeed(i); return t; };

/* The six from dev/plans/solitaire.md, step 11, each wired to something the
   next round actually does - a perk a player cannot feel is a worse reward
   than no perk at all.

   One correction: the plan gives Tough as Nails +10 health. Against a base of
   400 that is two and a half percent, next to a perk that doubles every long
   run, so nobody would ever take it and the choice would be a choice of two.
   It is +40 here, the same as dev/farkle.html, which is a tenth. */
const PERKS = [
  {id:'long',  name:'Long Memory',    icon:'attack', desc:'A run of five or more lands twice as hard.'},
  {id:'sight', name:'Second Sight',   icon:'map',    desc:'See the next card before you turn it.'},
  {id:'deep',  name:'Deep Deck',      icon:'chest',  desc:'Three more cards in the stock.'},
  {id:'wild',  name:'Wild Ace',       icon:'bolt',   desc:'Once a board, play any card onto an ace.'},
  {id:'tough', name:'Tough as Nails', icon:'heart',  desc:'+40 health, now and every level.'},
  {id:'study', name:'Training',       icon:'xp',     desc:'A quarter more experience.'}
];
const hasPerk = id => (S.perks || []).indexOf(id) >= 0;
const perkCount = id => (S.perks || []).filter(p => p === id).length;

/* a number that arrives rather than appearing */
function countTo(el, from, to, ms, delay = 0){
  if(!el) return;
  if(reduced()){ el.textContent = fmt(to); return; }
  setTimeout(() => {
    const t0 = performance.now();
    (function step(now){
      const k = Math.min(1, (now - t0) / ms);
      el.textContent = fmt(Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3))));
      if(k < 1) requestAnimationFrame(step); else el.textContent = fmt(to);
    })(t0);
  }, delay);
}
function xpFill(oldLv, oldXp, delay){
  const base = cumNeed(oldLv - 1) || 0, need = xpNeed(oldLv);
  const from = Math.max(0, Math.min(1, (oldXp - base) / need));
  const to = S.level > oldLv ? 1 : Math.max(0, Math.min(1, (S.xp - base) / need));
  const bar = $('vXp'), txt = $('vXpTxt');
  if(!bar) return;
  bar.style.width = (from * 100) + '%';
  if(txt) txt.textContent = `${fmt(Math.max(0, S.xp - base))} / ${fmt(need)}`;
  setTimeout(() => {
    bar.style.width = (to * 100) + '%';
    if(S.level > oldLv) setTimeout(() => {
      const l = $('vLv'); if(l) l.textContent = `Level ${S.level}`;
      tone(1046.5, .35, 'triangle', .06);
    }, 900);
  }, delay);
}
function levelUp(){
  S.level++;
  const was = S.maxHp;
  S.maxHp = heroMaxHP(S.level) + (S.bonusHp || 0);
  S.hp = Math.min(S.maxHp, S.hp + (S.maxHp - was));
  S.pendingLv = (S.pendingLv || 0) + 1;
}
function levelPanel(){
  const was = heroMaxHP(S.level - 1) + (S.bonusHp || 0);
  const offer = PERKS.slice().sort(() => Math.random() - .5).slice(0, 3);
  openPanel(`
    <div class="eyebrow">You grew stronger</div>
    <h2 style="text-align:center">Level up!</h2>
    <div class="lu-medal"><b>${S.level}</b></div>

/* ===================== keeping your hero =====================

   whatever JSON they are handed, so they needed no change for a third game -
   only the leaderboard did, and that was two names added to a fixed list. */
let SLOT = (() => { try{ return +JSON.parse(localStorage.getItem('sl_slot') || '1') || 1; }catch(e){ return 1; } })();

}
function loadSave(n){ try{ return JSON.parse(localStorage.getItem(SK('save', n)) || 'null'); }catch(e){ return null; } }
function slotLine(n){

  return { n, empty:false, name:L.name || 'Edward', level:L.level || 1,
           where:(w.areas[Math.min(3, L.area | 0)] || {}).name || '',
           world:w.name };
}

const API = REMOTE + '.netlify/functions/';
async function api(path, body){

    ? { method:'POST', headers:{ 'content-type':'application/json' }, body:JSON.stringify(body) }
    : undefined);

  if(!r.ok) throw new Error(j.error || 'That did not work. Try again in a moment.');

}

function cloudCode(){

    store.set('cloud', c);

}

       Monster Farkle one in the same store */

/* ===================== brag pictures =====================
   The card game's 1200x630 comic card, drawn for the reading: scene behind, a
   figure on the right, a gold headline, and the address spelled the one way
   it is ever spelled. The mark is three little cards drawn on the canvas
   rather than a picture, so this needs no art of its own. */
const SITE = 'https://axesandaces.com/';
/* The art is same-origin in every place this actually runs - the website and
   both phone apps bundle it - so asking for CORS costs nothing and keeps the
   canvas clean. Under file:// neither setting works: with it the images do
   not load, without it they taint the canvas and toDataURL throws, because
   file:// has an opaque origin. That is why dev/gen/slbrag.cjs serves the
   page over http to check these rather than opening it off disk. */
function imgLoad(src){
  return new Promise(r => { const i = new Image(); i.crossOrigin = 'anonymous';
    i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
}
/* The mark: three little cards in a peak, drawn on the canvas rather than
   loaded, so a brag picture needs no art of its own. */
function drawMark(x, left, top, size){
  const w = size * .42, h = size * .62;
  [[0, size * .32], [size * .29, 0], [size * .58, size * .32]].forEach(([dx, dy]) => {
    x.save();
    x.fillStyle = '#fffaf0'; x.strokeStyle = '#000'; x.lineWidth = size * .07;
    x.beginPath();
    const r = size * .07, X = left + dx, Y = top + dy;
    if(x.roundRect) x.roundRect(X, Y, w, h, r); else x.rect(X, Y, w, h);
    x.fill(); x.stroke();
    x.restore();
  });
}
async function bragCard(o){
  try{
    await document.fonts.load('80px "Germania One"');
    await document.fonts.load('700 40px Oswald');
    await document.fonts.load('38px "Alfa Slab One"');
  }catch(e){}
  const c = document.createElement('canvas'); c.width = 1200; c.height = 630;
  const x = c.getContext('2d');
  const bg = await imgLoad(o.bg || 'art/bg_tavern.webp');
  if(bg){ const sc = Math.max(1200 / bg.width, 630 / bg.height);
    x.drawImage(bg, (1200 - bg.width * sc) / 2, (630 - bg.height * sc) / 2, bg.width * sc, bg.height * sc); }
  else { x.fillStyle = '#2a1608'; x.fillRect(0, 0, 1200, 630); }
  const gr = x.createLinearGradient(0, 0, 1200, 0);
  gr.addColorStop(0, 'rgba(10,5,3,.94)'); gr.addColorStop(.55, 'rgba(10,5,3,.78)'); gr.addColorStop(1, 'rgba(10,5,3,.15)');
  x.fillStyle = gr; x.fillRect(0, 0, 1200, 630);
  const fig = o.fig ? await imgLoad(o.fig) : null;
  if(fig){ const k = Math.min(500 / fig.width, 520 / fig.height), w = fig.width * k, h = fig.height * k;
    x.save(); x.shadowColor = 'rgba(0,0,0,.85)'; x.shadowBlur = 30; x.drawImage(fig, 1180 - w, 610 - h, w, h); x.restore(); }
  x.fillStyle = '#000'; x.fillRect(0, 0, 1200, 12); x.fillRect(0, 618, 1200, 12);
  x.textBaseline = 'alphabetic';
  drawMark(x, 48, 44, 78);
  const gold = x.createLinearGradient(0, 56, 0, 104);
  gold.addColorStop(0, '#fff8e0'); gold.addColorStop(.2, '#ffd964');
  gold.addColorStop(.56, '#f2b632'); gold.addColorStop(1, '#ab6d14');
  x.font = '38px "Alfa Slab One", Rockwell, Georgia, serif';
  x.lineJoin = 'round'; x.lineWidth = 8; x.strokeStyle = '#000'; x.fillStyle = gold;
  x.strokeText('MONSTER SOLITAIRE', 146, 98); x.fillText('MONSTER SOLITAIRE', 146, 98);
  x.font = '700 22px Oswald, Arial'; x.fillStyle = '#e8d9bb';
  x.fillText((o.eyebrow || '').toUpperCase(), 148, 132);
  x.font = '74px "Germania One", Georgia, serif'; x.lineWidth = 10; x.strokeStyle = '#000';
  x.fillStyle = '#fff3d0'; x.lineJoin = 'round';
  const wrap = (t, w) => { const out = []; let l = '';
    for(const word of String(t).split(' ')){ const n = l ? l + ' ' + word : word;
      if(x.measureText(n).width > w && l){ out.push(l); l = word; } else l = n; }
    if(l) out.push(l); return out; };
  let y = 212;
  for(const l of wrap(o.title, 640).slice(0, 2)){ x.strokeText(l, 56, y); x.fillText(l, 56, y); y += 80; }
  if(o.big){ x.font = '700 84px Oswald, Arial'; x.fillStyle = '#f2b632';
    x.strokeText(o.big, 56, y + 22); x.fillText(o.big, 56, y + 22); y += 86; }
  x.font = '500 28px "Alegreya Sans", Arial, sans-serif'; x.fillStyle = '#e8d9bb'; x.lineWidth = 5;
  wrap(o.sub || '', 620).slice(0, Math.max(1, Math.floor((480 - (y + 10)) / 34) + 1))
    .forEach((l, i) => { x.strokeText(l, 58, y + 10 + i * 34); x.fillText(l, 58, y + 10 + i * 34); });
  x.lineJoin = 'round'; x.strokeStyle = '#000';
  x.font = '34px "Germania One", Georgia, serif'; x.lineWidth = 7; x.fillStyle = '#ffd35c';
  x.strokeText('Play free at', 58, 540); x.fillText('Play free at', 58, 540);
  x.font = '64px "Germania One", Georgia, serif'; x.lineWidth = 10; x.fillStyle = '#ffffff';
  x.strokeText('AxesAndAces.com', 56, 600); x.fillText('AxesAndAces.com', 56, 600);
  const em = await imgLoad('img/emblem-64.webp');

}

/* ===================== the daily challenge =====================
   Five fights, and everybody who plays today gets the same monsters and the
   same deals. That only works if every shuffle comes from a seed instead of
   Math.random, so the daily swaps Math.random out while a board is being
   dealt, exactly the way the other two games do it.

   The window has to cover the monster pick AND the deal AND the kind of
   meeting, because all three draw from the same stream: seed only the
   shuffle and two players get the same cards against different monsters. */
const realRandom = Math.random;
function seeded(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const DAILY_FIGHTS = 5;
const todayKey = () => new Date().toISOString().slice(0, 10);
const dayNumber = () => Math.floor(Date.parse(todayKey()) / 86400000);
function dailySeedOn(){
  if(!S.daily) return;
  Math.random = seeded(S.daily.seed * 7919 + S.daily.n * 131 + (S.daily.roll = (S.daily.roll || 0) + 1));
}
const dailySeedOff = () => { Math.random = realRandom; };

function startDaily(){
  S = freshHero();
  S.daily = { seed:dayNumber(), n:0, score:0, date:todayKey() };
  S.level = 3; S.maxHp = heroMaxHP(3); S.hp = S.maxHp;
  S.eq = { main:{type:'sword',tier:2}, off:{type:'dagger',tier:2},
           shield:{type:'shield',tier:2}, helm:{type:'helm',tier:2}, armor:{type:'armor',tier:2} };
  S.pots = ['heal'];
  closePanel();
  dailyIntro();
}
function dailyIntro(){
  openPanel(`<div class="eyebrow">Daily challenge &middot; ${S.daily.date}</div>
    <h2>Today's reading</h2>
    <p>Five fights. <b>Everybody gets the same monsters and the same cards today.</b>
      You start at level 3 with a full set of gear and one potion. Your score is the damage you land.</p>
    <div class="tipbox">No merchant, no levels, no second chances. Just the cards you are dealt.</div>
    <button class="btn big" data-act="dailyGo">Begin</button>
    <button class="btn big ghost" data-act="closeMenu">Back</button>`);
}
/* Where the nth fight of a daily sits. Driving it off S.step alone let the
   levels wander - 1, 2, 5, 3, 6, with the boss third of five - because the
   area and the position inside it both move at once. Setting them apart gives
   a climb: 1, 2, 3, 4, and a level 7 boss at the end, against a hero who
   starts at 3 with a full set of tier-two gear. */
function dailyStep(){
  const n = S.daily.n, last = n === DAILY_FIGHTS - 1;
  S.area = Math.min(2, Math.floor(n / 2));
  S.step = last ? AREA_FIGHTS - 1 : (n % 2);
}
function dailyNext(){
  S.daily.n++;
  if(S.daily.n >= DAILY_FIGHTS) return dailyDone();
  dailyStep();
  startFight();
}
function nameRow(){
  return `<div class="name-row"><label for="lbName">Your name</label>
    <input id="lbName" maxlength="20" value="${(store.get('name', '') || '').replace(/"/g, '&quot;')}" placeholder="Edward"></div>`;
}
function dailyDone(){
  const r = S.dailyResult = { date:S.daily.date, score:S.daily.score, wins:S.wins || 0 };
  S.phase = 'camp'; updateMusic();
  openPanel(`<div class="eyebrow">Daily challenge &middot; ${r.date}</div>
    <h2>${r.wins >= DAILY_FIGHTS ? 'You cleared it!' : `You won ${r.wins} of ${DAILY_FIGHTS}`}</h2>
    <div class="lu-medal"><b>${r.wins}</b></div>
    <p>You landed <b>${fmt(r.score)}</b> damage on today's cards.</p>
    ${nameRow()}
    <div id="lbList"></div>
    <button class="btn big" data-act="postDaily">Post my score</button>
    <button class="btn big ghost" data-act="brag" data-kind="daily">Brag about it</button>

/* ===================== what you can buy =====================

   thing. A charm whose words describe a peak, bought by a player who has never

const POT_SLOTS = 3;
const REST_PRICE = 4, REST_SHARE = .5;

/* ---------- the merchant ---------- */
const TABS = [['rest','Rest'], ['smith','Smith'], ['charms','Charms'], ['pots','Potions']];
function shopPanel(tab){

function restHTML(){

const SLOT_ORDER = [['main','Weapon'], ['off','Second weapon'], ['shield','Shield'], ['helm','Helmet'], ['armor','Armor']];
function smithHTML(){
  const cap = Math.min(5, 1 + Math.floor(S.level / 2));
  return SLOT_ORDER.map(([slot, label]) => {
    const have = S.eq[slot];

               : slot === 'off' ? 'dagger' : slot;
    const tier = (have ? have.tier : 0) + 1;
    if(tier > cap) return `<button class="buy owned" disabled><img class="ico" src="art/i_eq_${type}_${Math.max(1, tier - 1)}.webp" alt="">

      <span class="cost">Yours</span></button>`;
    const e = EQUIP[type], price = e.price[tier];

/* Three at a time, not all five. The reason is the same as in
   dev/farkle.html: six rows cannot fit a 320x568 screen without scrolling,
   and no popup may need scrolling - but the better reason is that three is a

const CHARM_OFFER = 3;
function charmOffer(){
  const left = CHARMS.filter(c => !hasCharm(c.id));
  if(!S.charmOffer || !S.charmOffer.length || S.charmOffer.some(id => hasCharm(id)))
    S.charmOffer = left.slice().sort(() => Math.random() - .5).slice(0, CHARM_OFFER).map(c => c.id);
  return S.charmOffer.map(id => CH[id]).filter(Boolean);
}
function charmsHTML(){
  const offer = charmOffer();
  if(!offer.length) return `<p class="menu-note">You have every charm the merchant had.</p>`;
  return offer.map(c => `<button class="buy" data-act="buyCharm" data-charm="${c.id}" ${S.gold < c.price ? 'disabled' : ''}>
