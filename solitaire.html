<title>Monster Solitaire</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Germania+One&family=Alfa+Slab+One&family=Oswald:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Monster Solitaire. Three peaks of cards over a waste pile, and a monster
   waiting behind them. Clear a card onto the waste when it is one rank above
   or below - aces wrap both ways - and the run grows. A run is the blow you
   are winding up, and it lands when the run breaks.

   Monster Farkle is push-your-luck: bank it or lose it. This is the long
   chain: keep it going or settle for what you have. Two different feelings
   off the same art, which is why both are worth building.

   Colors, type and shapes come from BRAND.md, the same as the other two
   games: soot black and dark leather, gold headlines, crimson for the
   monster, green for you, teal for magic, 3px black borders with hard offset
   shadows, no emoji anywhere a player can see. Germania One for titles,
   Oswald for numbers and buttons, Alegreya Sans for anything you read.
   Card suits are allowed - they are part of the cards. */
:root{
  --soot:#14100d; --leather:#1b1410; --wood:#241913; --wood-2:#33241b; --wood-3:#433025; --line:#5d4434;
  --parch:#f3e6c8; --parch-dim:#c7b28c;
  --gold:#f2b632; --gold-hi:#ffd35c;
  --hp:#c8241f; --heal:#3fae4a; --heal-hi:#7be38a; --teal:#7fe3d8; --boss:#a63de0;
  --steel:#76a9db; --ink:#16100d; --red:#c8161d;
  --bubble:#f3e6c8; --bubble-ink:#16100d;
  --f-title:'Germania One','Palatino Linotype',Georgia,serif;
  --f-num:'Oswald','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Alegreya Sans','Segoe UI',system-ui,sans-serif;
  --f-logo:'Alfa Slab One', Rockwell, Georgia, serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0;background:var(--soot);
  background-image:repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 2px, transparent 2px 46px),
                   radial-gradient(ellipse at 50% 0%, rgba(242,182,50,.12), transparent 60%);
  color:var(--parch);font-family:var(--f-body);font-size:16px;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;
}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
img{max-width:100%}
[hidden]{display:none!important}

/* ===================== the shape of the screen =====================
   A solitaire layout wants width and the monster wants height, and on a phone
   they are fighting over the same screen. So they do not share a direction:

   On a phone it is one column - monster band on top, you under it, then the
   peaks and the waste. The peaks are the one part whose height is fixed by
   arithmetic rather than taste: ten cards have to fit across, which sets the
   pitch, which sets the height through the board's aspect ratio. Everything
   else is flex:none at its own height and the monster takes what is left.
   That leaves the monster 454px at 390x844 and still 236px at 320x568, which
   is twice what Monster Farkle's band gets, because a card board is shorter
   than two rows of dice and buttons.

   On a desktop they stop competing: the peaks take the left and the monster
   fills the right, full height, which is what BRAND.md asks for. 820px is
   where there is enough width to give the peaks 450px and still leave the
   monster a column worth looking at. */
#app{
  max-width:880px;margin:0 auto;height:100%;min-height:0;
  padding-left:max(14px, env(safe-area-inset-left, 0px));
  padding-right:max(14px, env(safe-area-inset-right, 0px));
  padding-block:8px 10px;display:flex;flex-direction:column;gap:7px;
}
#board{display:flex;flex-direction:column;flex:0 0 auto;min-width:0}

@media (min-width:820px){
  #app{
    max-width:1180px;display:grid;gap:10px 16px;
    grid-template-columns:minmax(0,1fr) minmax(0,.76fr);
    grid-template-rows:auto minmax(0,1fr);
  }
  .top{grid-column:1 / -1}
  #board{grid-column:1;grid-row:2;justify-content:center;gap:10px}
  #side{grid-column:2;grid-row:2;display:flex;flex-direction:column;gap:8px;min-height:0}
  .stage{min-height:260px}
  .peaks{width:100%}
}
/* phone: the monster and you sit above the board, in that order */
@media (max-width:819px){
  #side{display:contents}
}
#app.shake{animation:shake .38s}
@keyframes shake{20%{transform:translate(-7px,2px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,-1px)}}

/* This rule exists so the build can be checked: at 320 wide
   matchMedia('(max-width:560px)') must be true, and if it is not, the test
   page was built without the viewport meta and no phone CSS in this file is
   live at all. dev/gen/vpcheck.cjs reads --phone to say so out loud. */
@media (max-width:560px){
  :root{ --phone:1; }
  #app{ padding-inline:max(9px, env(safe-area-inset-left, 0px)); }
}

/* ===================== the top bar ===================== */
.top{display:flex;align-items:center;gap:9px;flex:none}
.brand{display:flex;align-items:center;gap:7px;font-family:var(--f-title);font-size:1.18rem;
  color:var(--gold-hi);text-shadow:2px 2px 0 #000;line-height:1;white-space:nowrap}
.brand img{width:30px;height:30px;border-radius:7px;border:2px solid #000;box-shadow:2px 2px 0 #000}
.tools{margin-left:auto;display:flex;gap:6px}
.tool{background:var(--leather);border:2px solid #000;box-shadow:2px 2px 0 #000;border-radius:999px;
  padding:6px 11px;min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--f-num);font-weight:600;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase}
@media (max-width:420px){ .wide-only{display:none} .tool{padding:6px 9px;font-size:.72rem} }

/* ===================== the monster =====================
   Lifted from dev/farkle.html, which lifted it from dev/game.html: area
   background, still art, looping idle clip, the vertical health bar, the name,
   the level badge, the threat color and the next-move chip. The one thing that
   changes here is the shape of the box it lives in - a wide short band on a
   phone, a tall column on a desktop - so the clip's framing has to survive
   both. See .foe-vidwrap video below. */
.stage{position:relative;flex:1 1 auto;min-height:104px;min-width:0;
  border-radius:14px;overflow:hidden;border:3px solid #000;box-shadow:4px 4px 0 #000;
  display:flex;flex-direction:column;
  background:linear-gradient(rgba(10,5,3,.55), rgba(10,5,3,.05) 38%, rgba(10,5,3,.05) 70%, rgba(10,5,3,.6)),
             var(--bgimg) center/cover no-repeat, linear-gradient(#3e2617,#170d07)}
.stage-top{padding:9px 42px 0 11px;display:flex;flex-direction:column;gap:5px;z-index:2}
.foe-title{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.foe-name{font-family:var(--f-title);font-size:1.3rem;line-height:1.1;text-shadow:0 2px 0 rgba(0,0,0,.7)}
.foe-rule{font-family:var(--f-num);font-weight:600;font-size:.8rem;letter-spacing:.03em;color:#ffb7a3;text-shadow:0 1px 0 rgba(0,0,0,.6)}
.foe-pic{flex:1;min-height:0;display:grid;place-items:center;z-index:1;filter:drop-shadow(0 14px 18px rgba(0,0,0,.65));
  animation:breathe 3.2s ease-in-out infinite}
.foe-pic img{display:block;height:clamp(84px,22vh,250px);max-width:76%;object-fit:contain}
@keyframes breathe{50%{transform:scale(1.04) translateY(-5px)}}
.foe-pic.hit{animation:foeHit .42s}
@keyframes foeHit{0%{filter:brightness(2.4) saturate(0)}30%{transform:translateX(-14px) rotate(-7deg)}60%{transform:translateX(10px) rotate(5deg)}}

/* The clips are 16:9 and this box is neither. On a phone it is a short wide
   band, where cover trims the sides and the head has to be held up in frame;
   on a desktop it is a tall column, where cover trims top and bottom instead
   and the head would be the first thing to go. So the framing moves with the
   box rather than being one number for both. Never crop a head. */
.foe-vidwrap{position:absolute;inset:0;overflow:hidden;z-index:0;opacity:0;transition:opacity .4s;pointer-events:none}
.stage.hasvid .foe-vidwrap{opacity:1}
.stage.hasvid .foe-pic{visibility:hidden}
.foe-vidwrap::before{content:"";position:absolute;inset:-20px;background:var(--bgimg) center/cover;filter:blur(15px) brightness(.5)}
.foe-vidwrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 38%;
  filter:contrast(1.06) saturate(1.06)}
@media (min-width:820px){ .foe-vidwrap video{object-position:50% 26%} }
.foe-vidwrap video.atk{opacity:0;transition:opacity .22s ease}
.foe-vidwrap video.atk.on{opacity:1}
.foe-vidwrap.hit{animation:vidHit .42s}
@keyframes vidHit{0%{filter:brightness(2.6) saturate(0)}35%{transform:translateX(-12px)}70%{transform:translateX(9px)}}
.foe-vidwrap.healglow{animation:vidHeal 1.1s}
@keyframes vidHeal{40%{filter:brightness(1.3) sepia(.5) hue-rotate(60deg)}}
.foe-vidwrap.shieldglow{animation:vidShield 1.1s}
@keyframes vidShield{40%{filter:brightness(1.25) sepia(.6) hue-rotate(175deg)}}

/* the level badge and how dangerous this one is */
.lvtag{display:inline-flex;align-items:center;gap:4px;border:2px solid #000;border-radius:999px;padding:2px 9px;
  font-family:var(--f-num);font-weight:700;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;
  background:var(--wood-3);color:var(--parch);box-shadow:2px 2px 0 #000}
.lvtag.easy{background:#2c5230;color:#cfeccf} .lvtag.even{background:#4a3a1c;color:#ffe3a6}
.lvtag.hard{background:#5e2a1e;color:#ffd0c2} .lvtag.boss{background:var(--boss);color:#fff}
.vbar{position:absolute;right:11px;top:11px;bottom:11px;width:17px;border-radius:999px;
  background:rgba(0,0,0,.45);border:2px solid #000;overflow:hidden;z-index:2}
.vbar i{position:absolute;left:0;right:0;bottom:0;height:100%;background:linear-gradient(0deg,#8e1a16,var(--hp) 70%,#ff7a6a);transition:height .45s ease}
.stage-foot{position:absolute;left:10px;right:40px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}

/* ===================== you ===================== */
.hero{display:flex;align-items:center;gap:7px;flex:none;
  background:var(--leather);border:3px solid #000;box-shadow:3px 3px 0 #000;border-radius:12px;padding:6px 9px}
.hero .me{width:34px;height:34px;flex:0 0 auto;object-fit:contain;object-position:bottom;
  background:radial-gradient(circle at 50% 62%,#3a2a1d,#14100d);border:2px solid #000;border-radius:8px}
.hpbar{flex:1;min-width:0;height:20px;border-radius:999px;background:#120d0b;border:2px solid #000;overflow:hidden;position:relative}
.hpbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#2d7f36,var(--heal-hi));transition:width .45s ease}
.hpbar span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-weight:600;
  font-size:.76rem;letter-spacing:.04em;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.85);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;
  font-family:var(--f-num);font-weight:600;font-size:.78rem;letter-spacing:.03em;
  background:var(--wood-3);border:2px solid #000;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .ico{width:15px;height:15px;object-fit:contain}
.chip.gold{color:var(--gold-hi)}
.chip.blk{background:#26394d;color:#cfe4ff}
.chip.hit{background:#5a2a22;color:#ffd9cc}
.chip.calm{background:#2f3b4f;color:#d6e6ff}
/* On a phone the strip is one row and has to hold its line, so the two
   smallest numbers go once there is no room for them. */
@media (max-width:400px){ .hero .sm{display:none} }
/* On a desktop you sit under the monster in the right-hand column, where
   there is room to stack rather than squeeze. */
@media (min-width:820px){
  .hero{flex-wrap:wrap;gap:6px 8px}
  .hero .hpbar{flex:1 0 100%;order:-1;height:22px}
}

/* ===================== the peaks =====================
   Three overlapping peaks over a row of ten, the standard 28-card Tri-Peaks
   tableau. The whole thing is laid out in one unit - the pitch, the distance
   from one bottom-row card to the next - so it scales to any width without a
   single number in JavaScript.

   Across: ten bottom cards at one pitch apart, and each card 1.42 pitches
   wide, so cards overlap sideways by about 30%. The last card's right edge
   lands exactly on the container's: 9 pitches of travel plus 1.42 of card is
   10.42, which is --span.

   Down: a card is 1.4 times its width, so 1.988 pitches tall, and each row
   steps exactly one pitch - just over half a card - so the row below covers a
   card's bottom and never its top-left corner. That step is set by the corner,
   not by taste: the rank and its suit stack about half a card tall, and at 320
   wide a step any shorter clips the bottom of the suit pip. Four rows come to
   4.988 pitches, which gives the container its aspect ratio, 10.42 by 4.988,
   and every card can then be placed in plain percentages.

   Why the overlap. At 320px wide there are ten cards across a 302px board,
   which is 30px of pitch. Ten separate 44px cards would need 440px and the
   phone does not have it - that is arithmetic, not a style choice. Overlapping
   buys each card 41px of width for its rank corner, which is the part a player
   actually reads, and the corner sits in the left-hand strip that is never
   covered by its neighbor. */
.peaks{
  --span:10.42; --rows:4.988;
  position:relative;width:calc(100% - 10px);aspect-ratio:var(--span)/var(--rows);
  margin:0 auto;flex:0 0 auto;
  /* a playable card grows 14% and lifts, so the ones at either end need
     somewhere to grow into or they leave the screen */
}
.pk{
  position:absolute;
  left:calc(var(--x) / var(--span) * 100%);
  top:calc(var(--row) * 1 / var(--rows) * 100%);
  width:calc(1.42 / var(--span) * 100%);
  height:calc(1.988 / var(--rows) * 100%);
  border-radius:7px;border:2.5px solid #14100e;padding:0;
  background:#fffaf0;color:var(--ink);
  box-shadow:0 3px 0 rgba(0,0,0,.45);
  display:flex;align-items:flex-start;justify-content:flex-start;
  transition:transform .16s ease, box-shadow .16s ease, opacity .2s;
  overflow:hidden;
  /* the rank corner sizes off the card, not the screen, so it stays right
     whether the board is 302px wide on a phone or 600 on a desktop */
  container-type:inline-size;
}
.pk.red{color:var(--red)}

/* The rank corner is the whole of what a player reads at this size, so it gets
   the room. It sits in the left strip, which the card on top never covers. */
.pk .cn{
  position:absolute;top:2px;left:3px;
  display:flex;flex-direction:column;align-items:center;line-height:.86;
  font-family:var(--f-num);font-weight:700;letter-spacing:-.03em;
  font-size:min(40cqw, 23px);
}
.pk .cn i{font-style:normal;font-size:.84em;margin-top:.04em}

/* Only one corner of a card is ever reliably visible, and it is worth being
   exact about which. The row below covers a card from one pitch down, which
   is its bottom half. Its neighbor along the same row starts one pitch to
   the right, which is 1/1.42 of a card, so it covers the right 30%. What is
   left is the top-left - top half, left 70% - and that is the whole of what
   this layout can be trusted to show.

   So the rank corner sits there, and the painted face sits beside it inside
   the same safe strip. Top-right looked right in a mock-up and was wrong on
   the board: every card except the last of its row had its face sliced down
   the middle by its neighbor.

   The art only appears once a card is wide enough to carry it. At the 41px a
   phone gives a card, dev/game.html's painted jack is a smudge, and the rank
   corner already carries rank and suit together, so below 72px a card shows
   its corner and nothing else. */
.pk .mid{position:absolute;top:5%;left:27%;display:none;line-height:0}
/* It has to end by 59% of the card, not 70%. A neighbor that happens to be
   legal grows 14% from its own top center, which moves its left edge 7% back
   over this card, so the usual 70% safe edge is only 63% on those deals. */
.pk .mid img{display:block;width:min(32cqw,38px);border-radius:4px}
@container (min-width:72px){ .pk .mid{display:block} }

/* face down: the deck back, which is the one thing per world that is allowed
   to change. The faces never change - a face harder to read at 320px is wrong
   whatever it looks like. */
.pk.down{
  background:
    repeating-linear-gradient(45deg, rgba(0,0,0,.26) 0 3px, transparent 3px 7px),
    linear-gradient(160deg, var(--back-a,#4a2d1d), var(--back-b,#2a160e));
  box-shadow:inset 0 0 0 2px rgba(242,182,50,.28), 0 3px 0 rgba(0,0,0,.45);
}
.pk.down .cn,.pk.down .mid{display:none}

/* A card you can play right now lifts and grows, which does two jobs: the
   player is never hunting for the legal move, and the only cards worth tapping
   are the ones with a big target. A card that cannot be played does nothing
   when tapped, so it does not need 44px. */
/* It grows from its own top edge and never upward. The obvious version lifted
   it five pixels and scaled it from the middle, which at 390 wide put its top
   ten pixels higher than it belongs - and the pitch between rows is 34.7px
   with a 31px rank corner sitting in it, so a lifted card quietly swallowed
   the corner of the card above. It only happened on deals where that card
   was the legal one, which is exactly why it had to be measured rather than
   looked at. The ring and the hard shadow carry the lift instead. */
.pk.free{
  z-index:30;transform-origin:50% 0;transform:scale(1.14);
  box-shadow:0 0 0 3px var(--gold), 0 0 14px rgba(242,182,50,.55), 0 5px 0 rgba(0,0,0,.45);
}
.pk.gone{opacity:0;transform:scale(.6) translateY(-30px);pointer-events:none}
.pk.flip{animation:pkflip .22s ease-out}
@keyframes pkflip{from{transform:rotateY(85deg) scale(.94)}to{transform:none}}

/* Said out loud, briefly, over the monster - which is where a player is
   already looking when a blow lands. One element reused, not a new one each
   time, so two shouts in quick succession replace each other instead of
   stacking up on top of one another. */
.banner{position:absolute;left:16px;right:16px;top:20%;text-align:center;font-family:var(--f-title);
  font-size:clamp(1.9rem,8.5vw,3rem);color:var(--gold);text-shadow:0 3px 0 #000,0 0 18px rgba(0,0,0,.85);
  opacity:0;pointer-events:none;z-index:3;text-transform:uppercase;line-height:1.05}
.banner small{display:block;font-family:var(--f-num);font-weight:600;font-size:.42em;letter-spacing:.06em;color:var(--parch)}
.banner.show{animation:bannerIn 1.4s ease forwards}
@keyframes bannerIn{0%{opacity:0;transform:scale(.55)}18%{opacity:1;transform:scale(1.06)}72%{opacity:1;transform:scale(1)}100%{opacity:0}}
@media (min-width:820px){ .banner{font-size:clamp(1.9rem,3.4vw,3rem)} }

/* ===================== things that fly across the screen =====================
   The same set dev/farkle.html uses, so a blow in one game reads like a blow
   in the other: the axe through it, the comic star, the number counting up out
   of the star, and the claws when it is your turn to be hit. */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.slash{position:fixed;z-index:62;border-radius:999px;
  background:linear-gradient(90deg,transparent,#fff 45%,#ffe9a8 55%,transparent);
  filter:drop-shadow(0 0 7px var(--gold-hi));animation:slash .3s ease-out forwards}
@keyframes slash{0%{transform:rotate(var(--a)) scaleX(0);opacity:0}28%{opacity:1}100%{transform:rotate(var(--a)) scaleX(1);opacity:0}}
.boom{position:fixed;transform:translate(-50%,-50%);z-index:61;width:58px;height:58px;animation:boom .65s ease-out forwards}
.boom::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,#ffe36b 0 30%,#ff8a1f 55%,#e2361f 100%);
  clip-path:polygon(50% 0,61% 30%,95% 15%,72% 42%,100% 55%,68% 62%,82% 95%,52% 72%,30% 100%,32% 68%,0 72%,26% 50%,4% 25%,36% 32%);z-index:-1}
@keyframes boom{0%{transform:translate(-50%,-50%) scale(.2) rotate(-20deg)}25%{transform:translate(-50%,-50%) scale(1.15) rotate(5deg)}
  70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(.9)}}
/* The number that comes out of it, counting up. The outline is drawn behind
   the fill and it is thick, because this lands in the same instant the monster
   flashes white - a pale number with a thin shadow vanished into it. */
.dmgnum{position:fixed;transform:translate(-50%,-50%);z-index:63;font-family:var(--f-title);
  font-size:clamp(2.1rem,10vw,3.4rem);line-height:1;color:var(--gold-hi);
  -webkit-text-stroke:6px #000;paint-order:stroke fill;
  text-shadow:0 0 20px rgba(0,0,0,.95),0 5px 0 rgba(0,0,0,.55);
  white-space:nowrap;font-variant-numeric:tabular-nums}
.dmgnum.out{animation:dmgOut .6s ease-in forwards}
@keyframes dmgOut{to{opacity:0;transform:translate(-50%,-150%) scale(.8)}}
.hurtnum{position:fixed;transform:translate(-50%,-50%);z-index:62;font-family:var(--f-num);font-weight:700;font-size:1.7rem;

/* ===================== what a round is worth =====================
   Measured, not guessed, by dev/gen/peakdeal.cjs over 200,000 deals played by
   a deliberately ordinary greedy player - the same discipline that set
   HAND_AVG = 121 in dev/game.html and WINDUP_AVG = 545 in dev/farkle.html.
   Monster health and monster hits are built off this, so neither side is
   stronger than the other by default. Re-run peakdeal.cjs and update these if
   the scoring or the layout ever changes.

   Ordinary rounds, aces wrapping:
     clearable with perfect play   93.9%
     an ordinary player clears     47.0%
     cards cleared                 26.8 of 28
     peaks down                    2.27 of 3
     longest run    avg/med/90th   6.63 / 6 / 9
     ROUND DAMAGE   avg/med/90th    838 / 785 / 1196

   Boss rounds, aces not wrapping - the headline boss rule:
     clearable with perfect play   70.0%
     an ordinary player clears     18.3%
     longest run    avg/med/90th   5.91 / 6 / 8
     ROUND DAMAGE   avg/med/90th    674 / 640 / 964

   drops the clear rate from a half to under a fifth. That one rule is worth
   more than the other four boss rules together, which is worth knowing before
   stacking them.

   A correction to dev/plans/solitaire.md, step 2: it asks for the deal to be
   biased - reshuffled until a solver says it is clearable - so a player never
   gets a dead board. The measurement says do not bother. Dead boards, where a
   player clears fewer than four cards, came out at 0.0% of 200,000 deals, and
   an ordinary player averages 26.8 of 28 cards even when they lose. Failing to
   clear is not a dead board; it is the designed way to lose a round, and it
   happens about half the time on purpose. Biasing would have cost a full
   solver run on every deal to fix a problem that does not exist. */

const ROUND_MED = 785;     /* the median, which is what the fight is tuned to */

   take its move. Measured, that is 20.9 moves a round - and at Monster
   Farkle's rate of a tenth of your health a hit, a single board would deal
   836 damage to a hero with 400. The player would die in half a board, every
   time, and no amount of tuning the hit size fixes it: at a survivable size
   each hit is worth 8 and reads as nothing.

   ends a real run is a strike, and the monster answers it. A stock turn taken
   while already stuck at nothing is hunting, and costs you only the card. That
   is 11.14 moves a round instead of 20.9, and it reads the way a fight should:

   or one heal would undo a whole board. */

   Ranks are 1..13 with 1 meaning ace. In Tri-Peaks an ace wraps both ways, so
   a king takes an ace and an ace takes a two, which is why this is a ring

  {k:'s', ch:'♠', red:false},
  {k:'h', ch:'♥', red:true},
  {k:'d', ch:'♦', red:true},
  {k:'c', ch:'♣', red:false},

   pay like it. dev/gen/peakdeal.cjs measures with exactly this. */

function takes(a, b, wrap = true){
  if(a == null || b == null) return false;
  const d = Math.abs(a - b);
  return d === 1 || (wrap && d === 12);
}

function freshDeck(){
  const d = [];
  for(let s = 0; s < 4; s++) for(let r = 1; r <= 13; r++) d.push({r, s});
  return d;
}

/* Fisher-Yates against a supplied random, so a seeded daily deal and a casual
   one run the same code. */
function shuffle(d, rnd = Math.random){
  for(let i = d.length - 1; i > 0; i--){
    const j = (rnd() * (i + 1)) | 0;
    [d[i], d[j]] = [d[j], d[i]];
  }
  return d;

/* ===================== the tableau =====================

   COVERS says which two cards sit on top of each card; a card is playable once
   both of them are gone, and the bottom row is covered by nothing.

  const pos = new Array(28);
  const peak = new Array(28).fill(-1);

  for(let i = 0; i < 10; i++) pos[18+i] = {x: i, row: 3};

/* Build the monster a fight is against, out of its kind and the level it is
   met at. Same shape as dev/farkle.html's makeFoe, with the pattern array
   read the same way: a number is an attack at that weight, B is a guard and H
   is a heal. */
function makeFoe(kind, L, boss){
  /* A boss is defined by a slug, a name and a pattern and nothing else, so it
     has no health or attack of its own to read a temperament off. Pinning it
     at .3 and bulking it by hand is what dev/farkle.html does, and leaving
     that out here was measurable: dev/gen/slbalance.cjs had bosses coming out
     EASIER than the ordinary monsters guarding the way to them. */
  const tp = boss ? .3 : temper(kind);
  const def = foeArmorFor(L, boss, tp);
  const hp = monsterHP(L, (kind.hp || 1) * (boss ? 1.45 : 1), def);
  const hit = foeHit(L, tp) * (kind.atk || 1) * (boss ? 1.15 : 1);
  const nums = (kind.pat || [1]).filter(v => typeof v === 'number');
  const mean = nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : 1;
  const moves = (kind.pat || [1]).map(v =>
    v === 'B' ? { k:'blk',  n:Math.round(blowDamage(L) * GUARD_SHARE / 5) * 5 } :
    v === 'H' ? { k:'heal', n:Math.round(blowDamage(L) * HEAL_SHARE / 5) * 5 } :
                { k:'atk',  n:Math.max(5, Math.round(hit * (v / mean) / 5) * 5) });
  return { slug:kind.slug, name:kind.name, lvl:L, tp, boss:!!boss, hp, max:hp, moves, def,
           xp:Math.round((6 + 5 * L) * 1.8 * (boss ? 2.4 : 1)),
           gold:(Math.ceil(L * 1.2) + 3) * (boss ? 3 : 1) };
}
/* ===== END FIGHT MATHS ===== */

/* ===================== where you are =====================
   Ten worlds of four areas, three fights each, the last of them a boss. The
   same shape as the other two games, so the art, the place names and the level
   bands all line up. */
const AREA_FIGHTS = 3;
const S = {
  level:1, hp:400, maxHp:400, gold:3, xp:0,
  eq:{}, world:0, area:0, step:0,
  fight:null, block:0,
};
const worldOf = () => WORLDS[(S.world || 0) % 10];
const areaOf = () => Math.min(3, S.area | 0);
const curArea = () => worldOf().areas[areaOf()];
const posIn = () => (S.step | 0) % AREA_FIGHTS;
const isBossStep = () => posIn() === AREA_FIGHTS - 1;
const AREA_LV = () => { const off = (S.world || 0) * 8; return [[1,3],[3,5],[5,7],[7,9]][areaOf()].map(x => x + off); };
const bgOf = (a = areaOf()) => (S.world || 0) % 10 === 0
  ? `bg_${['tavern','cellar','forest','castle'][a]}` : `bg_${worldOf().id}_${a}`;
const rndInt = n => Math.random() * n | 0;

/* A boss fights by a rule that changes the deal itself. The card game's bosses
   kill a suit and the dice game's bend the dice; these bend the reading. All
   four are expressed through dealRound, so none of them is special-cased in
   the play loop.

   They are ordered by what they actually cost, which is measured rather than
   felt: dev/gen/peakdeal.cjs says turning the ace wrap off drops an ordinary
   player's clear rate from 47% to 18% and their damage by a fifth, which is
   more than the other three together. So it is the last one, the rule the
   quest boss fights by. */
const BOSS_RULES = [
  {text:'One peak is dealt face down',  deal:{hidden:[1]}},
  {text:'The stock runs short',         deal:{stock:18}},
  {text:'Two peaks are dealt face down',deal:{hidden:[0,2]}},
  {text:'Aces no longer wrap',          deal:{wrap:false}},
];
const bossRule = () => BOSS_RULES[areaOf()];

/* ---------- the monster on the stage ---------- */
function setFoeVideo(slug){
  const st = $('stage'), v = $('foeVid'), a = $('foeAtk');
  a.classList.remove('on');
  if(!slug || !VIDS.has(slug) || reduced()){ st.classList.remove('hasvid'); stopFoeVideo(); return; }
  v.src = `${REMOTE}vid/${slug}_idle.mp4`;
  a.src = `${REMOTE}vid/${slug}_attack.mp4`;
  st.classList.add('hasvid');
  const p = v.play(); if(p && p.catch) p.catch(() => {});
  v.onerror = () => st.classList.remove('hasvid');
}
function stopFoeVideo(){ ['foeVid','foeAtk'].forEach(id => { try{ $(id).pause(); }catch(e){} }); }

/* play the attack clip, and say when its blow actually lands */
function playFoeAttack(){
  if(!$('stage').classList.contains('hasvid')) return 0;
  const a = $('foeAtk'), v = $('foeVid');
  a.currentTime = 0; a.classList.add('on');
  const p = a.play(); if(p && p.catch) p.catch(() => a.classList.remove('on'));
  a.onended = () => { a.classList.remove('on'); v.currentTime = 0; const q = v.play(); if(q && q.catch) q.catch(() => {}); };
  return Math.round(((HIT_AT[S.fight.slug] || 1.5) - 0.1) * 1000);
}

function threatOf(d){
  if(d.boss) return ['boss', 'Boss'];
  const g = (d.lvl || S.level) - S.level;
  return g <= -2 ? ['easy', 'Easy'] : g >= 2 ? ['hard', 'Tough'] : ['even', 'Even'];
}
function intentText(mv){
  if(!mv) return '';
  return mv.k === 'atk' ? `Next: hits for ${fmt(takeFrom(mv.n))}`
       : mv.k === 'blk' ? 'Next: raises its guard'
       : 'Next: heals itself';
}
function setFoeBars(){
  const f = S.fight; if(!f) return;
  $('foeBar').style.height = Math.max(0, f.hp / f.max * 100) + '%';
  $('foeBlock').hidden = !(f.block > 0);
  if(f.block > 0) $('foeBlock').textContent = `Guard ${fmt(f.block)}`;
  const mv = f.moves[f.mv % f.moves.length];
  $('intent').hidden = false;
  $('intent').className = 'chip ' + (mv.k === 'atk' ? 'hit' : 'calm');
  $('intent').textContent = intentText(mv);
}
function setMyBars(){
  $('myBar').style.width = Math.max(0, S.hp / S.maxHp * 100) + '%';
  $('myHp').textContent = `HP ${fmt(Math.max(0, S.hp))} / ${fmt(S.maxHp)}`;
  $('lvNum').textContent = S.level;
  $('goldNum').textContent = fmt(S.gold);
  $('atkNum').textContent = weaponPts();
  $('defNum').textContent = defense();
  $('mePic').src = `art/hero_t${heroTier()}.webp`;
}

/* ---------- starting one ---------- */
function startFight(){
  const a = curArea(), [lo, hi] = AREA_LV(), boss = isBossStep();
  const L = boss ? hi : lo + Math.round(posIn() * (hi - lo) / Math.max(1, AREA_FIGHTS - 1));
  const kind = boss ? a.boss : a.pool[rndInt(a.pool.length)];
  const f = makeFoe(kind, L, boss);
  f.mv = 0; f.block = 0;
  if(boss) f.rule = bossRule();
  S.fight = f;
  S.block = 0;

  $('stage').style.setProperty('--bgimg', `url(art/${bgOf()}.webp)`);
  document.body.className = 'w' + ((S.world || 0) % 10);
  $('foeName').textContent = f.name;
  const [k, t] = threatOf(f);
  $('lvTag').hidden = false;
  $('lvTag').className = 'lvtag ' + k;
  $('lvTag').textContent = `Lv ${f.lvl} · ${t}`;
  $('foeRule').hidden = !boss;
  if(boss) $('foeRule').textContent = f.rule.text;
  $('foePic').innerHTML = `<img src="art/${f.slug}.webp" alt="${f.name}" draggable="false">`;
  setFoeVideo(f.slug);
  setFoeBars(); setMyBars();

  /* the board this fight is read on, bent by the boss rule if there is one */
  R = dealRound(boss ? f.rule.deal : {});
  render();
}


/* ===================== the round ===================== */
let R = null;        /* the round in play */

function dealRound(opts = {}){
  const wrap = opts.wrap !== false;
  const stockSize = opts.stock || 24;
  const d = shuffle(freshDeck(), opts.rnd);
  const tableau = d.slice(0, 28).map((c, i) => ({...c, i, gone: false}));
  const stock = d.slice(28, 28 + stockSize);
  return {
    wrap, tableau, stock,
    si: 1,                        /* the first stock card starts the waste */
    waste: [stock[0]],
    run: 0, runVal: 0,
    down: [],                     /* peaks already taken down, so each lands once */
    hidden: opts.hidden || [],    /* peaks dealt face down, for boss rules */
  };
}

const isGone = i => R.tableau[i].gone;
const isExposed = i => !isGone(i) && LAYOUT.covers[i].every(isGone);
const wasteTop = () => R.waste[R.waste.length - 1];
const canPlay = i => isExposed(i) && isFaceUp(i) && takes(R.tableau[i].r, wasteTop().r, R.wrap);

/* A card is face up once nothing covers it. Boss rounds can deal a whole peak
   face down, which only means its cards stay hidden until uncovered. */
function isFaceUp(i){
  if(!R.hidden.includes(LAYOUT.peak[i])) return true;
  return LAYOUT.covers[i].every(isGone);
}

/* ===================== drawing ===================== */
function cardFace(c){
  const s = SUITS[c.s];
  const art = FACE_ART[c.r];
  /* the corner carries rank and suit on every card; the painted face is extra,
     and the CSS above hides it on a card too narrow to show it properly */
  return `<span class="cn">${RANKS[c.r]}<i>${s.ch}</i></span>` +
         (art ? `<span class="mid"><img src="${art}" alt=""></span>` : '');
}

function drawPeaks(){
  const out = [];
  for(let i = 0; i < 28; i++){
    const c = R.tableau[i], p = LAYOUT.pos[i];
    if(c.gone){ continue; }
    const up = isFaceUp(i), free = canPlay(i);
    const cls = ['pk'];
    if(!up) cls.push('down');
    else if(SUITS[c.s].red) cls.push('red');
    if(free) cls.push('free');
    out.push(
      `<button class="${cls.join(' ')}" data-i="${i}" data-row="${p.row}" ` +
      `style="--x:${p.x};--row:${p.row}" ${free ? '' : 'tabindex="-1" aria-disabled="true"'}>` +
      (up ? cardFace(c) : '') + `</button>`
    );
  }
  return out.join('');
}

function drawTable(){
  const w = wasteTop();
  return `<div class="table">
    <div class="slot" id="stock">
      ${R.si < R.stock.length ? `<button class="pk down" data-act="turn" style="--x:0;--row:0"></button>` : '<div class="slot empty"></div>'}
      ${R.si < R.stock.length ? `<span class="stockn">${R.stock.length - R.si}</span>` : ''}
    </div>
    <div class="runbox ${R.run >= 8 ? 'wild' : R.run >= 5 ? 'hot' : ''}" id="runbox" style="--r:${R.run}">
      <b>${R.run}</b><small>Run</small>
    </div>
    <div class="slot" id="wasteslot">
      <div class="pk ${SUITS[w.s].red ? 'red' : ''}" style="--x:0;--row:0">${cardFace(w)}</div>
    </div>
  </div>`;
}

function render(){
  $('board').innerHTML =
    `<div class="peaks" id="peaks">${drawPeaks()}</div>` + drawTable();
}

/* ===================== sound =====================
   Cards, not dice: a short paper snap off a band-passed noise burst, built the
   same way dev/game.html and dev/farkle.html build theirs, so nothing has to
   ship as an audio file. */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('sl_' + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('sl_' + k, JSON.stringify(v)); }catch(e){} }
};
let ac = null, noiseBuf = null;
let soundOn = store.get('sound', true);
function audio(){
  if(!ac){ try{ ac = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  if(ac && ac.state === 'suspended') ac.resume();
  return ac;
}
function noise(){
  if(!noiseBuf){
    noiseBuf = ac.createBuffer(1, ac.sampleRate * .4, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const s = ac.createBufferSource(); s.buffer = noiseBuf; return s;
}
function tone(f, dur, type = 'triangle', vol = .07, delay = 0){
  if(!soundOn || !audio()) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .012);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + .02);
}
/* one card landing on the pile. It rises in pitch with the run, so a player
   hears the chain building before they look at the number. */
function cardSnap(step = 0){
  if(!soundOn || !audio()) return;
  const t = ac.currentTime, n = noise(), f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'bandpass'; f.frequency.value = 2200 + Math.min(step, 10) * 190; f.Q.value = 1.1;
  g.gain.setValueAtTime(.13, t); g.gain.exponentialRampToValueAtTime(.0001, t + .07);
  n.connect(f); f.connect(g); g.connect(ac.destination); n.start(t); n.stop(t + .09);
  tone(320 + Math.min(step, 10) * 36, .06, 'sine', .035);
}
function swoosh(){
  if(!soundOn || !audio()) return;
  const t = ac.currentTime, n = noise(), f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'bandpass'; f.frequency.setValueAtTime(2600, t); f.frequency.exponentialRampToValueAtTime(380, t + .22);
  g.gain.setValueAtTime(.1, t); g.gain.exponentialRampToValueAtTime(.0001, t + .24);
  n.connect(f); f.connect(g); g.connect(ac.destination); n.start(t); n.stop(t + .26);
}
const deadthud = () => { tone(104, .26, 'sawtooth', .09); tone(66, .34, 'sine', .11, .02); };
const bigBoom = t => { tone(55, .5 + t * .1, 'sine', .17); tone(42, .7, 'sawtooth', .06, .03); if(t >= 3) tone(30, .9, 'sine', .13, .06); };

/* ===================== things that fly across the screen ===================== */
const wait = ms => new Promise(r => setTimeout(r, ms));
function anim(el, cls){
  if(!el) return;
  if(el === $('foePic') && $('stage').classList.contains('hasvid')) el = $('foeVidWrap');
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), 1300);
}
function shake(t = 1){
  if(reduced()) return;
  const a = $('app');
  a.classList.remove('shake', 'shake2', 'shake3'); void a.offsetWidth;
  a.classList.add(t >= 3 ? 'shake3' : t >= 2 ? 'shake2' : 'shake');
  setTimeout(() => a.classList.remove('shake', 'shake2', 'shake3'), 700);
}
function banner(t, small){
  const b = $('banner');
  b.innerHTML = small ? `${t}<small>${small}</small>` : t;
  b.className = 'banner'; void b.offsetWidth; b.classList.add('show');
}
function pop(el, text, cls){
  if(!el) return;
  const r = el.getBoundingClientRect(), s = document.createElement('div');
  s.className = 'pop ' + cls; s.textContent = text;
  s.style.left = (r.left + r.width / 2 + (Math.random() * 18 - 9)) + 'px';
  s.style.top = r.top + 'px';
  $('fx').appendChild(s); setTimeout(() => s.remove(), 1050);
}
function stageCenter(){
  const r = $('stage').getBoundingClientRect();
  return { x:r.left + r.width / 2, y:r.top + r.height * .55, r };
}
/* the axe going through it, once per tier of the hit */
async function slashes(n){
  const { x, y, r } = stageCenter();
  for(let i = 0; i < n; i++){
    if(!reduced()){
      const el = document.createElement('div');
      el.className = 'slash';
      const a = (i % 2 ? 148 : 32) + (Math.random() * 34 - 17);
      const w = Math.max(200, Math.min(900, Math.min(r.width, r.height * 1.6) * .8)), h = Math.max(6, Math.round(w / 38));
      el.style.width = w + 'px'; el.style.height = h + 'px';
      el.style.margin = `${-h / 2}px 0 0 ${-w / 2}px`;
      el.style.left = (x + Math.random() * w / 5 - w / 10) + 'px';
      el.style.top = (y + Math.random() * 60 - 30) + 'px';
      el.style.setProperty('--a', a + 'deg');
      $('fx').appendChild(el); setTimeout(() => el.remove(), 420);
    }
    swoosh(); anim($('foePic'), 'hit');
    await wait(n > 3 ? 92 : 118);
  }
}
function damageBurst(n, tier){
  const { x, y } = stageCenter();
  if(!reduced()){
    const b = document.createElement('div');
    b.className = 'boom'; b.style.left = x + 'px'; b.style.top = y + 'px';
    b.style.width = b.style.height = (120 + tier * 34) + 'px';
    $('fx').appendChild(b); setTimeout(() => b.remove(), 700);
  }
  const t = document.createElement('div');
  t.className = 'dmgnum'; t.style.left = x + 'px'; t.style.top = y + 'px';
  t.textContent = '0'; $('fx').appendChild(t);
  const ms = reduced() ? 1 : 420, t0 = performance.now();
  (function step(now){
    const k = Math.min(1, (now - t0) / ms);
    t.textContent = fmt(Math.round(n * (1 - Math.pow(1 - k, 3))));
    if(k < 1) requestAnimationFrame(step);
    else { t.textContent = fmt(n); t.classList.add('out'); setTimeout(() => t.remove(), 700); }
  })(t0);
}
function claws(){
  if(reduced()) return;
  const r = $('heroBox').getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const fl = document.createElement('div'); fl.className = 'redflash';
  $('fx').appendChild(fl); setTimeout(() => fl.remove(), 460);
  [-1, 0, 1].forEach((k, i) => {
    const c = document.createElement('div'); c.className = 'claw';
    c.style.left = (cx + k * 32) + 'px'; c.style.top = (cy - 10 + k * 9) + 'px';
    c.style.animationDelay = (i * 45) + 'ms';
    $('fx').appendChild(c); setTimeout(() => c.remove(), 700);
  });
}

/* ===================== the strike =====================
   The blow is the run's total card value times its length. That shape is the
   whole game in one line: a second card is worth more than twice a first,
   because it multiplies everything before it as well as adding to it.

   The tiers are set off the measured spread rather than picked. One blow came
   out at a median of 21 and a 90th percentile of 200 over 200,000 rounds, so
   most strikes are a scratch and the rare long run is the event - which is the
   feeling the game is for. A run of eight comes to about 470 and gets the full
   treatment; a run of one is worth seven and stays out of the way. */
const STRIKE_TIERS = [
  [0,   'Hit!'],
  [0.6, 'Solid hit!'],
  [1.6, 'Brutal!'],
  [3.3, 'Devastating!'],
  [6,   'Legendary!'],
];
const strikeTier = w => {
  let t = 0;
  STRIKE_TIERS.forEach((x, i) => { if(w / BLOW_AVG >= x[0]) t = i; });
  return t;
};
const runBlow = () => R.runVal * R.run;
const strikeDamage = w => armored(Math.round(w * lvlMult(S.level) * atkMult()), S.fight);

/* The waste pile is where the run has been kept, so when the blow lands that
   is the pile that goes into it. A number appearing out of nowhere reads as a
   number; cards flying into the monster reads as the thing you built. */
function sweepWaste(n){
  const slot = $('wasteslot');
  if(reduced() || !slot) return wait(60);
  const { x, y } = stageCenter();
  const r = slot.getBoundingClientRect();
  const many = Math.min(n, 6);
  for(let k = 0; k < many; k++){
    const f = document.createElement('div');
    f.className = 'flyer';
    f.style.left = r.left + 'px'; f.style.top = r.top + 'px';
    f.style.width = r.width + 'px'; f.style.height = r.height + 'px';
    $('fx').appendChild(f);
    f.animate([
      { transform:'none', opacity:1 },
      { transform:`translate(${x - r.left - r.width / 2}px, ${y - r.top - r.height / 2}px) ` +
                  `scale(.4) rotate(${120 + rndInt(200)}deg)`, opacity:0 }
    ], { duration:360, delay:k * 46, easing:'cubic-bezier(.5,0,.75,.2)', fill:'forwards' });
    setTimeout(() => f.remove(), 400 + k * 46);
  }
  return wait(360 + many * 46);
}

/* opts.answer false means the monster does not get its move back - used when
   the board was cleared, because clearing is already the reward */
async function doStrike(opts = {}){
  const w = runBlow();
  if(!w) return;
  const tier = strikeTier(w), dmg = strikeDamage(w);
  const len = R.run;
  R.run = 0; R.runVal = 0;
  /* drawn straight away, before the cards start flying: the run is spent the
     moment the blow begins, and leaving the old count on screen through the
     sweep showed a number the player no longer had */
  render();

  await sweepWaste(len);
  banner(STRIKE_TIERS[tier][1], `Run of ${len}`);
  await slashes(tier + 1);

  const f = S.fight, absorbed = Math.min(f.block, dmg);
  f.block -= absorbed; f.hp -= dmg - absorbed;
  damageBurst(dmg - absorbed, tier);
  if(absorbed) pop($('foeBlock'), `${fmt(absorbed)} blocked`, 'b');
  if(tier >= 2){ bigBoom(tier); shake(tier >= 3 ? 3 : 2); }
  else if(dmg - absorbed >= f.max * .25) shake(1);
  setFoeBars();
  render();
  await wait(tier >= 3 ? 900 : 640);

  if(f.hp <= 0) return;
  if(opts.answer !== false) await foeTurn();
}

/* ===================== the monster's move =====================
   One a strike, not one a stock turn. A stock turn taken while already stuck
   at a run of nothing is hunting for a card, and hunting is not something to
   be punished for - see STRIKES at the top of this file for what happens when
   it is. */
async function foeTurn(mult){
  const f = S.fight;
  const atks = f.moves.filter(m => m.k === 'atk');
  const mv = mult
    ? { k:'atk', n:Math.round(atks.reduce((a, b) => a + b.n, 0) / Math.max(1, atks.length) * mult) }
    : f.moves[f.mv++ % f.moves.length];
  await wait(200);

  if(mv.k === 'atk'){
    const hitMs = playFoeAttack();
    if(!hitMs){ anim($('foePic'), 'lunge'); swoosh(); }
    await wait(hitMs || 320);
    swoosh(); claws();
    const after = takeFrom(mv.n);
    const absorbed = Math.min(S.block, after); S.block -= absorbed;
    const dmg = Math.max(0, after - absorbed);
    S.hp = Math.max(0, S.hp - dmg);
    if(absorbed) pop($('heroBox'), `${fmt(absorbed)} blocked`, 'b');
    if(dmg > 0){
      setMyBars(); anim($('heroBox'), 'flash'); deadthud();
      const r = $('heroBox').getBoundingClientRect();
      const t = document.createElement('div');
      t.className = 'hurtnum'; t.textContent = '-' + fmt(dmg);
      t.style.left = (r.left + r.width / 2) + 'px'; t.style.top = r.top + 'px';
      $('fx').appendChild(t); setTimeout(() => t.remove(), 1250);
      shake(mult ? 2 : 1);
    }
    await wait(620);
  } else if(mv.k === 'blk'){
    f.block += mv.n;
    anim($('foeVidWrap'), 'shieldglow');
    pop($('foeBlock'), `Guard +${fmt(mv.n)}`, 'b');
    tone(330, .22, 'triangle', .06); tone(495, .2, 'sine', .04, .07);
    setFoeBars();
    await wait(560);
  } else {
    f.hp = Math.min(f.max, f.hp + mv.n);
    anim($('foeVidWrap'), 'healglow');
    pop($('foePic'), `+${fmt(mv.n)}`, 'h');
    tone(523, .2, 'sine', .05); tone(784, .22, 'sine', .04, .08);
    setFoeBars();
    await wait(560);
  }
  setFoeBars();
}

/* ===================== the ends of a fight =====================
   Victory, gold, experience and the level ladder are step 10 and step 11 of
   dev/plans/solitaire.md. These two carry the loop in the meantime so the game
   can be played end to end, and they get replaced rather than added to. */
async function won(){
  busy = true;
  stopFoeVideo();
  S.gold += S.fight.gold;
  S.xp += S.fight.xp;
  banner('It falls', `${fmt(S.fight.gold)} gold`);
  bigBoom(3); shake(2);
  setMyBars();
  await wait(1500);
  S.step++;
  if(S.step % AREA_FIGHTS === 0){ S.area++; if(S.area > 3){ S.area = 0; S.world++; } }
  S.hp = Math.min(S.maxHp, S.hp + Math.round(S.maxHp * .25));
  startFight();
  busy = false;
}
async function lost(){
  busy = true;
  stopFoeVideo();
  banner('You fall', 'Old Bram lays the cards out again');
  deadthud();
  await wait(1800);
  S.hp = S.maxHp;
  startFight();
  busy = false;
}

/* ===================== playing =====================
   Tapping a playable card sends it to the waste and the run grows. Tapping the
   stock turns a card, which ends the run - and the run ending is when the blow
   lands, so a tap on the stock is never free.

   The card flies rather than vanishing. A card that simply disappears reads as
   a mistake; one that travels to the waste tells the player where their run is
   being kept. The flight is measured from the card's own box to the waste's,
   so it stays right at any screen size without a number in here. */
let busy = false;

function flyToWaste(el, done){
  const slot = document.querySelector('#wasteslot');
  if(!slot || !el){ done(); return; }
  const a = el.getBoundingClientRect(), b = slot.getBoundingClientRect();
  el.style.zIndex = 60;
  el.style.transition = 'transform .26s cubic-bezier(.4,.1,.5,1), opacity .26s ease-in';
  el.style.transform =
    `translate(${(b.left + b.width/2) - (a.left + a.width/2)}px,` +
    ` ${(b.top + b.height/2) - (a.top + a.height/2)}px) scale(${b.width / a.width})`;
  el.style.opacity = '.25';
  setTimeout(done, 240);
}

function bumpRun(){
  const box = $('runbox');
  if(!box) return;
  box.classList.add('up');
  setTimeout(() => box.classList.remove('up'), 150);
}

function playCard(i){
  if(busy || !canPlay(i)) return;
  busy = true;
  const el = document.querySelector(`.pk[data-i="${i}"]`);
  flyToWaste(el, async () => {
    const c = R.tableau[i];
    c.gone = true;
    R.waste.push(c);
    R.run++;
    R.runVal += valueOf(c.r);
    render();
    bumpRun();
    cardSnap(R.run);

    /* a peak coming down is its own moment, and it has to land before the
       board is handed back, or the next tap arrives on top of it */
    const k = LAYOUT.peak[i];
    if(k >= 0 && !R.down.includes(k) && peakIsDown(k)){
      R.down.push(k);
      await peakDown(k);
      if(S.fight.hp <= 0){ await won(); return; }
    }
    busy = false;
    afterMove();
  });
}

/* ===================== a peak coming down =====================
   A correction to dev/plans/solitaire.md, step 8: it asks for the two
   remaining peaks to slide across and fill the space. They cannot, and it is
   not a matter of effort. The bottom row of ten is shared by all three peaks -
   covers[9+i] = [18+i, 18+i+1] - so a peak sits directly on the bottom-row
   cards beneath it. Slide a peak sideways and its cards are drawn over bottom
   cards they have no relationship with, and the one thing a player has to be
   able to read off this board, which card is holding which, becomes a lie.
   The space a fallen peak leaves is information: it is the part of the reading
   you have already cut away. So it stays empty, and the moment is carried by
   the burst and the blow instead. */
const peakIsDown = k => R.tableau.every((c, i) => LAYOUT.peak[i] !== k || c.gone);

function peakCenter(k){
  const el = $('peaks');
  if(!el) return stageCenter();
  const r = el.getBoundingClientRect();
  return { x: r.left + ((k * 3 + 2.21) / 10.42) * r.width,
           y: r.top + (1.0 / 4.988) * r.height };
}
function goldBurst(x, y, size){
  if(reduced()) return;
  const b = document.createElement('div');
  b.className = 'boom'; b.style.left = x + 'px'; b.style.top = y + 'px';
  b.style.width = b.style.height = size + 'px';
  $('fx').appendChild(b); setTimeout(() => b.remove(), 700);
}
/* a bonus blow: no run behind it, so it is its own damage rather than a
   multiple of anything the player was holding */
async function bonusBlow(raw, tier){
  const dmg = armored(Math.round(raw * lvlMult(S.level) * atkMult()), S.fight);
  const f = S.fight, absorbed = Math.min(f.block, dmg);
  f.block -= absorbed; f.hp -= dmg - absorbed;
  await slashes(tier);
  damageBurst(dmg - absorbed, tier);
  bigBoom(tier); shake(tier >= 3 ? 3 : 2);
  setFoeBars();
  await wait(760);
}

async function peakDown(k){
  const { x, y } = peakCenter(k);
  goldBurst(x, y, 150);
  tone(660, .18, 'triangle', .07); tone(880, .2, 'sine', .05, .08);
  banner('Peak down', `${3 - R.down.length} left standing`);
  await wait(420);
  await bonusBlow(PEAK_BONUS, 2);
}

/* Turning a card is how a run ends, so this is where the blow lands. A turn
   taken at a run of nothing is just hunting for a card and costs you nothing
   but the card - the monster only answers a strike. */
async function turnStock(){
  if(busy || R.si >= R.stock.length) return;
  busy = true;
  if(R.run){
    await doStrike();
    if(S.fight.hp <= 0){ await won(); return; }
    if(S.hp <= 0){ await lost(); return; }
  }
  R.waste.push(R.stock[R.si++]);
  cardSnap();
  render();
  busy = false;
  afterMove();
}

/* Is anything left to do? Either there is a legal card, or there is stock to
   turn. Neither means the round is over with peaks still standing, which is
   the losing end of it. */
const anyLegal = () => R.tableau.some((c, i) => canPlay(i));
const cleared  = () => R.tableau.every(c => c.gone);

function afterMove(){
  if(cleared()){ onClear(); return; }
  if(!anyLegal() && R.si >= R.stock.length) onDry();
}

/* The finisher. The run it ended on lands first - unanswered, because clearing
   the board is already the answer - and then the clear itself, which is the
   biggest single blow in the game and is meant to end most fights it happens
   in. */
async function onClear(){
  busy = true;
  if(R.run) await doStrike({ answer:false });
  if(S.fight.hp <= 0) return won();

  const el = $('peaks');
  if(el && !reduced()){
    const r = el.getBoundingClientRect();
    for(let k = 0; k < 3; k++){
      const c = peakCenter(k);
      setTimeout(() => goldBurst(c.x, c.y, 180), k * 110);
    }
    goldBurst(r.left + r.width / 2, r.top + r.height / 2, 260);
  }
  banner('The reading is cut away', 'All three peaks down');
  [0, 1, 2, 3].forEach(k => tone(523 * Math.pow(1.26, k), .2, 'triangle', .07, k * .09));
  await wait(700);
  await bonusBlow(CLEAR_BONUS, 4);
  if(S.fight.hp <= 0) return won();

  await wait(500);
  redeal();
}

/* Running the stock dry with peaks still standing is the punishment. It is
   the one move in the game that costs you health for nothing, and it has to
   be clearly worse than turning a card, or there would be no reason to care
   about the stock running low. */
async function onDry(){
  busy = true;
  /* The stock running out is itself a run breaking, so the run still lands
     before the punishment. Without this, playing your last legal card as the
     eighth of a run threw the whole run away - the one moment in the game
     where a player has earned the most and would be told the least. */
  if(R.run){
    await doStrike({ answer:false });
    if(S.fight.hp <= 0){ await won(); return; }
  }
  banner('Out of cards', 'It gets a free swing');
  deadthud();
  await wait(900);
  await foeTurn(DRY_MULT);
  if(S.hp <= 0) return lost();
  redeal();
}

function redeal(){
  const boss = S.fight && S.fight.boss;
  R = dealRound(boss ? S.fight.rule.deal : {});
  render();
  busy = false;
}

$('board').addEventListener('click', e => {
  const t = e.target.closest('[data-act="turn"]');
  if(t){ turnStock(); return; }
  const card = e.target.closest('.pk[data-i]');
  if(card) playCard(+card.dataset.i);
});

/* ===================== the first fight ===================== */
startFight();

/* exposed for the test harness and for dev/gen/slscan.cjs */
Object.assign(window, { __SOL: { get R(){ return R; }, dealRound, render, LAYOUT, takes, valueOf,
  set R(v){ R = v; }, S, startFight, makeFoe, WORLDS, BOSS_RULES } });

})();
</script>
