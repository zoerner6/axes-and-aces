    + `<p class="menu-note">You can carry ${POT_SLOTS} potions. You have ${(S.pots || []).length}.</p>`;
}
const coinSound = () => { tone(1568, .08, 'triangle', .05); tone(2093, .12, 'triangle', .05, .07); tone(1760, .1, 'triangle', .04, .14); };
function spend(n){ S.gold -= n; coinSound(); }

/* ---------- potions in a fight ---------- */
function renderPots(){
  const row = $('potRow'), pots = S.pots || [];
  row.hidden = !pots.length && !S.ironskin && !S.rage;
  const seen = {};
  pots.forEach(id => seen[id] = (seen[id] || 0) + 1);
  row.innerHTML = Object.keys(seen).map(id => `<button class="pot" data-act="drink" data-pot="${id}"
      aria-label="Drink ${PO[id].name}" ${busy || !S.fight ? 'disabled' : ''}>
      <img src="art/i_${PO[id].icon}.webp" alt="">${seen[id] > 1 ? `<i>${seen[id]}</i>` : ''}</button>`).join('')
    + (S.ironskin ? `<span class="chip blk">Iron skin</span>` : '')
    + (S.rage ? `<span class="chip hit">Rage</span>` : '');
}
function drink(id){
  const pots = S.pots || [];
  const k = pots.indexOf(id);
  if(k < 0 || busy) return;
  pots.splice(k, 1);
  if(id === 'heal'){
    const n = Math.min(S.maxHp - S.hp, Math.round(S.maxHp * .35));
    S.hp += n;
    pop($('heroBox'), `+${fmt(n)}`, 'h');
    tone(523, .2, 'sine', .05); tone(784, .22, 'sine', .04, .08);
  } else if(id === 'iron'){
    S.ironskin = true;
    pop($('heroBox'), 'Iron skin', 'b');
    tone(330, .25, 'triangle', .06);
  } else {
    S.rage = true;
    pop($('heroBox'), 'Rage', 'g');
    tone(196, .3, 'sawtooth', .07);
  }
  setMyBars(); renderPots();
}

/* ===================== the ends of a fight ===================== */
function victoryPanel(d, mood){
  const oldLv = S.level, gained = Math.round(d.xp * (hasPerk('study') ? 1.25 : 1));
  const oldXp = S.xp - gained;
  while(S.xp >= cumNeed(S.level)) levelUp();
  openPanel(`<div class="vic">
    <div class="vic-title">Victory!</div>
    ${mood.flawless ? `<div class="vic-tag"><b>Flawless</b><span>Not a scratch &middot; double gold</span></div>`
      : mood.clean ? `<div class="vic-tag"><b>Clean Read</b><span>All four home, deck to spare</span></div>`
      : mood.clutch ? `<div class="vic-tag"><b>Clutch</b><span>Won by a hair</span></div>` : ''}
    <div class="vic-foe"><img src="art/dead_${d.slug}.webp" alt="${d.name}, defeated"></div>
    <div class="vic-sub">You brought down the <b>${d.name}</b>.</div>
    <div class="loot">
      <div class="purse"><img src="art/i_coin.webp" alt=""><div><small>Gold</small><b id="vGold">${fmt(S.gold - d.gold - mood.bonus)}</b></div></div>
      <div class="xpwrap">
        <div class="xphead"><span>+${fmt(gained)} experience</span><span id="vLv">Level ${oldLv}</span></div>
        <div class="xpbar"><i id="vXp"></i><span id="vXpTxt"></span></div>
      </div>
    </div>
    <div class="hpbar" style="height:20px"><i style="width:${Math.max(0, S.hp / S.maxHp * 100)}%"></i><span>HP ${fmt(S.hp)} / ${fmt(S.maxHp)}</span></div>
    ${d.boss ? `<button class="btn big ghost" data-act="brag" data-kind="boss">Brag about this win</button>` : ''}
    <button class="btn big" data-act="onward">${S.pendingLv ? 'Level up!' : 'Onward'}</button>
  </div>`);
  countTo($('vGold'), S.gold - d.gold - mood.bonus, S.gold, 900, 300);
  xpFill(oldLv, oldXp, 500);
  if(mood.flawless || mood.clutch || mood.clean) setTimeout(() => { deadthud(); tone(523.25, .5, 'triangle', .05, .1); }, 300);
}

async function won(){
  busy = true;
  stopFoeVideo();
  const d = S.fight;
  /* Clean Read is this game's own: all three peaks down without the stock
     ever running out on you. Flawless and Clutch come across from the other
     two unchanged. */
  const mood = {
    flawless: !S.tookHit,
    clutch: S.hp <= S.maxHp * .12,
    clean: !!S.cleanRead,
  };
  mood.bonus = (mood.flawless ? d.gold : 0) + (mood.clean ? Math.round(d.gold * .5) : 0);
  S.gold += d.gold + mood.bonus;
  S.xp += Math.round(d.xp * (hasPerk('study') ? 1.25 : 1));
  S.wins = (S.wins || 0) + 1;
  S.lastWin = { name:d.name, slug:d.slug, boss:d.boss };
  banner('Victory!', `The ${d.name} is down`);
  if(S.daily){
    anim($('foePic'), 'hit');
    [0, 1, 2, 3].forEach(k => tone([523.25, 659.25, 783.99, 1046.5][k], k === 3 ? .6 : .14, 'triangle', .06, k * .13));
    await wait(1500);
    return dailyNext();
  }
  anim($('foePic'), 'hit');
  [0, 1, 2, 3].forEach(k => tone([523.25, 659.25, 783.99, 1046.5][k], k === 3 ? .6 : .14, 'triangle', .06, k * .13));
  setMyBars();
  await wait(1400);
  victoryPanel(d, mood);
}

/* ===================== the path =====================
   Crossing into a new area is the only point in a world where there is a
   choice to make, so it is the only point that stops and asks. Mid-area there
   is nothing to decide and the game does not pretend otherwise.

   The choice is the card game's: push on, or stay and train. It matters
   because the next area's monsters are two levels above the last one's, and a
   player who walks in underlevelled should be told so in words rather than
   discovering it in a fight. */
const AREA_SLUG = ['tavern', 'cellar', 'forest', 'castle'];
const areaIcon = (a = areaOf()) => (S.world || 0) % 10 === 0
  ? `art/i_area_${AREA_SLUG[a]}.webp` : `art/i_area_${worldOf().id}_${a}.webp`;
const questStep = () => (worldOf().steps || [])[Math.min(S.step % 12, 11)] || null;
const crossingNext = () => (S.step + 1) % AREA_FIGHTS === 0;

function nextAreaName(){
  const a = S.area + 1;
  if(a <= 3) return worldOf().areas[a].name;
  return WORLDS[(S.world + 1) % 10].areas[0].name;
}
function nextAreaBand(){
  const a = S.area + 1;
  const off = (a <= 3 ? S.world : S.world + 1) * 8;
  return [[1,3],[3,5],[5,7],[7,9]][a <= 3 ? a : 0].map(x => x + off);
}

function pathPanel(){
  S.phase = 'camp'; updateMusic();
  const here = curArea(), step = questStep();
  const [lo, hi] = nextAreaBand();
  const gap = lo - (S.level || 1);
  const hard = gap >= 3 ? 'far stronger than you' : gap >= 1 ? 'stronger than you' : 'a match for you';
  openPanel(`
    <div class="eyebrow">${worldName()}</div>
    <h2>Where to next?</h2>
    <div class="hpbar" style="height:22px"><i style="width:${Math.max(0, S.hp / S.maxHp * 100)}%"></i><span>HP ${fmt(S.hp)} / ${fmt(S.maxHp)}</span></div>
    ${gap >= 1 ? `<div class="tipbox"><b>${nextAreaName()}</b> is dangerous. The monsters there are
      <b>level ${lo} to ${hi}</b> and you are <b>level ${S.level}</b> &mdash; ${hard}.
      Lay the cards out here as long as you like, or push on and risk it.</div>` : ''}
    <button class="buy" data-act="quest">
      <img class="ico" src="${areaIcon(Math.min(3, S.area + 1))}" alt="">
      <b>${step ? step[0] : `On to ${nextAreaName()}`}</b>
      <span>${step ? step[1] : 'The quest goes on'}</span>
      <span class="cost">Go</span></button>
    <button class="buy" data-act="train">
      <img class="ico" src="${areaIcon()}" alt="">
      <b>Stay at ${here.name}</b>
      <span>Read the cards here again for experience and gold.</span>
      <span class="cost">Stay</span></button>`);
}
const worldName = () => {
  const w = S.world || 0;
  const n = WORLDS[w % 10].name;
  return w >= 10 ? `Endless &middot; Depth ${w - 9}: ${n}` : n;
};

/* where the next fight comes from, once the win is finished being celebrated */
function onwardFromShop(){
  /* a training fight is off the quest, so it advances nothing */
  if(S.training){ S.training = false; return nextFight(true); }
  if(crossingNext()) return pathPanel();
  nextFight();
}
function nextFight(stay){
  S.hp = Math.min(S.maxHp, S.hp + Math.round(S.maxHp * .25));
  saveGame();
  if(!stay){
    S.step++;
    if(S.step % AREA_FIGHTS === 0){
      S.area++;
      /* The world is finished. S.world is NOT advanced here: the closing
         beats belong to the world you just walked out of, and storyNext
         moves on once they have been read. */
      if(S.area > 3){ S.endBeat = 0; return storyPanel('end'); }
      return storyPanel(['a1', 'a2', 'a3'][S.area - 1]);
    }
  }
  closePanel();
  startFight();
}

/* ===================== the story =====================
   The scene art and the typing caption from dev/game.html, by way of
   dev/farkle.html. Four beats a world: two opening it, one on crossing into
   each new area, and two closing it. The words come out of dev/gen/
   slworlds.py, which rewrites the ones that speak of a hand of cards or a set
   of dice and leaves the rest of the quest alone. */
function storyPanel(key){
  S.phase = 'story'; updateMusic();
  const w = worldOf();
  const pre = w.id === 'w1' ? '' : w.id + '_';
  const beat = key === 'end'   ? w.story.end[S.endBeat || 0]
             : key === 'start' ? w.intro[S.introBeat || 0]
             : w.story[key];
  const art = key === 'end'   ? `art/sc_${pre}end_${Math.min(S.endBeat || 0, 1)}.webp`
            : key === 'start' ? `art/sc_${pre}start_${Math.min(S.introBeat || 0, 1)}.webp`
            : `art/sc_${pre}${key}_0.webp`;
  const more = key === 'end'   ? (S.endBeat || 0) < w.story.end.length - 1
             : key === 'start' ? (S.introBeat || 0) < w.intro.length - 1 : false;
  openPanel(`
    <div class="eyebrow">${worldName()}</div>
    <div class="scene"><img class="bg" src="${art}" alt="" onerror="this.src='art/${bgOf()}.webp'">
      <span class="tag">${beat.title}</span></div>
    <p id="storyText"></p>
    <button class="btn big" data-act="storyNext" data-key="${key}">${more ? 'Go on' : key === 'end' ? 'Onward' : 'Carry on'}</button>`);
  typeInto($('storyText'), beat.text, 14);
}
function storyNext(key){
  const w = worldOf();
  clearIntroTimers();
  if(key === 'start'){
    S.introBeat = (S.introBeat || 0) + 1;
    if(S.introBeat < w.intro.length) return storyPanel('start');
    S.introBeat = 0;
    /* the opening beats now sit after the first win, so they hand back to
       the level-up or the merchant rather than straight to a new fight */
    if(S.fight && S.fight.hp <= 0){
      if(S.pendingLv) return levelPanel();
      return shopPanel();
    }
    closePanel(); return startFight();
  }
  if(key === 'end'){
    S.endBeat = (S.endBeat || 0) + 1;
    if(S.endBeat < w.story.end.length) return storyPanel('end');
    S.endBeat = 0;
    S.world = (S.world || 0) + 1;
    S.area = 0; S.step = 0; S.introBeat = 0;
    return storyPanel('start');
  }
  closePanel(); startFight();
}

async function lost(){
  busy = true;
  stopFoeVideo();
  const d = S.fight;
  S.deaths = (S.deaths || 0) + 1;
  banner('You have fallen', `The ${d.name} brought you down`);
  deadthud();
  await wait(1600);
  if(S.daily) return dailyDone();      /* no second chances on today's cards */
  openPanel(`
    <div class="eyebrow">${curArea().name}</div>
    <h2>You have fallen</h2>
    <div class="scene"><img class="bg" src="art/${bgOf()}.webp" alt="">
      <img class="foe" src="art/${d.slug}.webp" alt="${d.name}"></div>
    <p>The <b>${d.name}</b> is still standing. Old Bram lays the cards out again.</p>
    <button class="btn big ghost" data-act="brag" data-kind="death">Brag about how far you got</button>
    <button class="btn big" data-act="again">Try again</button>`);
}

/* ===================== playing =====================
   Tapping a playable card sends it to the waste and the run grows. Tapping the
   stock turns a card, which ends the run - and the run ending is when the blow
   lands, so a tap on the stock is never free.

   The card flies rather than vanishing. A card that simply disappears reads as
   a mistake; one that travels to the waste tells the player where their run is
   being kept. The flight is measured from the card's own box to the waste's,
   so it stays right at any screen size without a number in here. */
let busy = false;

/* A tap starts a sequence that runs for seconds: a strike, the monster's
   answer, maybe a peak coming down. If anything in it throws, the board is
   left with busy still true and nothing to press - and because an unhandled
   promise rejection is not an uncaught exception, it does it silently, with
   nothing in the console to say what happened. So every sequence a tap starts
   goes through here: it says what failed, loudly, and hands the board back so
   a player is never stranded by it. */
function guard(work){
  return Promise.resolve(work).catch(err => {
    console.error('Monster Solitaire: a move failed, handing the board back.', err);
    busy = false;
    try{ render(); }catch(e){}
  });
}

function flyToWaste(el, done){
  const slot = document.querySelector('#wasteslot');
  if(!slot || !el){ done(); return; }
  const a = el.getBoundingClientRect(), b = slot.getBoundingClientRect();
  el.style.zIndex = 60;
  el.style.transition = 'transform .26s cubic-bezier(.4,.1,.5,1), opacity .26s ease-in';
  el.style.transform =
    `translate(${(b.left + b.width/2) - (a.left + a.width/2)}px,` +
    ` ${(b.top + b.height/2) - (a.top + a.height/2)}px) scale(${b.width / a.width})`;
  el.style.opacity = '.25';
  setTimeout(done, 240);
}

/* Jester's Coin. The card on the waste goes back on top of the stock, which
   puts a different rank in front of you without ending the run - the one way
   in this game to be stuck and not pay for it. Once a board. */
function useCoin(){
  if(busy || !R.coin || R.waste.length < 2) return;
  const c = R.waste.pop();
  /* back where it came from, which is a different end of the stock on each
     board - Klondike pops, Tri-Peaks walks an index */
  if(isPeaks()) R.stock.splice(R.si, 0, c);
  else R.stock.push(c);
  R.coin = false;
  banner("Jester's Coin", 'The card goes back');
  tone(1318, .12, 'triangle', .05); tone(1760, .14, 'triangle', .04, .07);
  render();
}

/* ===================== the first time =====================
   Four marks in the order a player meets them, once ever. Each one waits for
   the moment it is about rather than firing on a timer, so "turn a card when
   you are stuck" arrives the first time you are stuck and not before. */
/* Four marks, and on Klondike they deliberately say nothing about how to
   play solitaire. Nobody needs telling that an ace goes home or that a red
   six sits on a black seven - that is the entire reason the game changed.
   What a player does NOT know is that this board is a fight: that sending a
   card up is what hits, and that turning one ends the run. So that is all
   they say. */
const COACH = [
  {id:'play',
   when:() => isPeaks() ? !!document.querySelector('.peaks .pk.free')
                        : !!document.querySelector('.kl-cols .pk.live, [data-from="w"].live'),
   sel:() => document.querySelector('.peaks .pk.free, .kl-cols .pk.live, [data-from="w"].live'),
   text:() => isPeaks()
     ? 'Tap a card <b>one above or one below</b> the one on the pile.'
     : 'Tap a card to move it. The ones that go <b>home</b> are what hit.'},
  {id:'stock',
   when:() => isPeaks()
     ? (!document.querySelector('.peaks .pk.free') && R.si < R.stock.length)
     : (!document.querySelector('.kl-cols .pk.live') && !!document.querySelector('[data-act="draw"]')),
   sel:() => document.querySelector('[data-act="turn"], [data-act="draw"]'),
   text:() => 'Stuck? <b>Turn a card</b> &mdash; but that ends your run.'},
  {id:'run',
   when:() => R.run >= 2,
   sel:() => document.querySelector('#runbox'),
   text:() => 'That is your <b>run</b>. The longer it gets, the heavier the blow.'},
  {id:'clear',
   when:() => isPeaks() ? (R.down.length > 0 && R.down.length < 3)
                        : (R.done.length > 0 && R.done.length < 4),
   sel:() => document.querySelector('.peaks, .kl-top'),
   text:() => isPeaks()
     ? 'One peak down. Take <b>all three</b> and you cut the reading away.'
     : 'A whole suit home. Get <b>all four</b> and the fight is yours.'},
];
/* A set of what has been learned, not a position in a list. The list was an
   index, and a Tri-Peaks board can perfectly well open with no legal move -
   at which point the first mark could not be shown, the second was refused
   for not being first, and a player who met that board got no marks ever.
   Each mark now waits for its own moment and the order is kept by preferring
   the earliest one still unlearned whose moment is true. */
let coachLearned = new Set(store.get('coachLearned', []));
let coachEl = null, coachLit = null;
const coachKnowsAll = () => COACH.every(c => coachLearned.has(c.id));
function coachClear(){
  if(coachEl){ coachEl.remove(); coachEl = null; }
  if(coachLit){ coachLit.remove(); coachLit = null; }
}
function coachDone(id){
  if(coachLearned.has(id)) return;
  coachLearned.add(id);
  store.set('coachLearned', [...coachLearned]);
  coachClear();
}
/* Called wherever the board becomes the player's again. A timer started when
   the board was dealt was the obvious way and the wrong one: the board is
   dealt behind the fight intro, so whether a mark appeared came down to
   whether Fight had been pressed yet. */
function coachMaybe(){
  if(coachKnowsAll()) return;
  setTimeout(() => {
    if(busy || !$('overlay').hidden || coachEl || !R) return;
    const c = COACH.find(x => !coachLearned.has(x.id) && x.when());
    if(c) coachShow(c.id);
  }, 420);
}
function coachShow(id){
  if(coachLearned.has(id) || coachEl) return;
  const c = COACH.find(x => x.id === id);
  if(!c) return;
  const t = c.sel();
  if(!t) return;
  const r = t.getBoundingClientRect();
  if(r.width < 2) return;

  coachLit = document.createElement('div');
  coachLit.className = 'coachlit';
  Object.assign(coachLit.style, { left:(r.left - 4) + 'px', top:(r.top - 4) + 'px',
    width:(r.width + 8) + 'px', height:(r.height + 8) + 'px' });
  document.body.appendChild(coachLit);

  coachEl = document.createElement('div');
  coachEl.className = 'coach';
  coachEl.innerHTML = typeof c.text === 'function' ? c.text() : c.text;
  document.body.appendChild(coachEl);
  const b = coachEl.getBoundingClientRect();
  /* Below the thing if there is room, EXCEPT where that would cover the deck
     and the pile. The very first mark says to play a card one above or one
     below "the one on the pile" - and it was sitting on top of the pile. */
  const table = document.querySelector('.table');
  const floor = table ? Math.min(innerHeight - 8, table.getBoundingClientRect().top - 8)
                      : innerHeight - 8;
  const below = r.bottom + 14 + b.height < floor;
  const left = Math.max(8, Math.min(innerWidth - b.width - 8, r.left + r.width / 2 - b.width / 2));
  coachEl.classList.add(below ? 'below' : 'above');
  coachEl.style.left = left + 'px';
  coachEl.style.top = (below ? r.bottom + 12 : r.top - b.height - 12) + 'px';
  coachEl.style.setProperty('--px', Math.max(12, Math.min(b.width - 24, r.left + r.width / 2 - left - 9)) + 'px');
}

function bumpRun(){
  const box = $('runbox');
  if(!box) return;
  box.classList.add('up');
  setTimeout(() => box.classList.remove('up'), 150);
}

function playCard(i){
  if(busy || !canPlay(i)) return;
  busy = true;
  const el = document.querySelector(`.pk[data-i="${i}"]`);
  flyToWaste(el, () => guard((async () => {
    const c = R.tableau[i];
    if(R.wild && !takes(c.r, wasteTop().r, R.wrap)){
      R.wild = false;                       /* that was the Wild Ace, spent */
      banner('Wild Ace', 'The ace takes anything, once');
      tone(988, .18, 'triangle', .06);
    }
    c.gone = true;
    R.waste.push(c);
    R.run++;
    R.runVal += valueOf(c.r);
    render();
    bumpRun();
    cardSnap(R.run);
    coachDone('play');
    coachMaybe();

    /* a peak coming down is its own moment, and it has to land before the
       board is handed back, or the next tap arrives on top of it */
    const k = LAYOUT.peak[i];
    if(k >= 0 && !R.down.includes(k) && peakIsDown(k)){
      R.down.push(k);
      await peakDown(k);
      if(S.fight.hp <= 0){ await won(); return; }
    }

    /* a boss rule: the run breaks itself at a length, however good the board
       looks. It is a strike like any other, so the monster answers it. */
    if(R.cap && R.run >= R.cap && !cleared()){
      banner('The reading breaks', `A run cannot pass ${R.cap}`);
      await wait(520);
      await doStrike();
      if(S.fight.hp <= 0){ await won(); return; }
      if(S.hp <= 0){ await lost(); return; }
    }
    busy = false;
    afterMove();
  })()));
}

/* ===================== a peak coming down =====================
   A correction to dev/plans/solitaire.md, step 8: it asks for the two
   remaining peaks to slide across and fill the space. They cannot, and it is
   not a matter of effort. The bottom row of ten is shared by all three peaks -
   covers[9+i] = [18+i, 18+i+1] - so a peak sits directly on the bottom-row
   cards beneath it. Slide a peak sideways and its cards are drawn over bottom
   cards they have no relationship with, and the one thing a player has to be
   able to read off this board, which card is holding which, becomes a lie.
   The space a fallen peak leaves is information: it is the part of the reading
   you have already cut away. So it stays empty, and the moment is carried by
   the burst and the blow instead. */
const peakIsDown = k => R.tableau.every((c, i) => LAYOUT.peak[i] !== k || c.gone);

function peakCenter(k){
  const el = $('peaks');
  if(!el) return stageCenter();
  const r = el.getBoundingClientRect();
  return { x: r.left + ((k * 3 + 2.21) / 10.42) * r.width,
           y: r.top + (1.0 / 4.988) * r.height };
}
function goldBurst(x, y, size){
  if(reduced()) return;
  const b = document.createElement('div');
  b.className = 'boom'; b.style.left = x + 'px'; b.style.top = y + 'px';
  b.style.width = b.style.height = size + 'px';
  $('fx').appendChild(b); setTimeout(() => b.remove(), 700);
}
/* a bonus blow: no run behind it, so it is its own damage rather than a
   multiple of anything the player was holding */
async function bonusBlow(raw, tier){
  const dmg = armored(Math.round(raw * lvlMult(S.level) * atkMult() * (S.rage ? 1.5 : 1)), S.fight);
  /* the axe falls BEFORE the health comes off, the same order doStrike uses.
     Taking the health first and animating afterwards left the bar reading
     nearly five points higher than the monster's real health for most of half
     a second, which dev/gen/slplay.cjs caught as the bar disagreeing with the
     game - and it was the game that was ahead, not the bar that was wrong. */
  await slashes(tier);
  const f = S.fight, absorbed = Math.min(f.block, dmg);
  f.block -= absorbed; f.hp -= dmg - absorbed;
  if(S.daily) S.daily.score += dmg - absorbed;
  damageBurst(dmg - absorbed, tier);
  bigBoom(tier); shake(tier >= 3 ? 3 : 2);
  setFoeBars();
  await wait(760);
}

async function peakDown(k){
  const { x, y } = peakCenter(k);
  goldBurst(x, y, 150);
  tone(660, .18, 'triangle', .07); tone(880, .2, 'sine', .05, .08);
  banner('Peak down', `${3 - R.down.length} left standing`);
  if(R.down.length < 3) setTimeout(() => coachShow('clear'), 1600);
  await wait(420);
  await bonusBlow(PEAK_BONUS, 2);
  coachDone('clear');
}

/* Turning a card is how a run ends, so this is where the blow lands. A turn
   taken at a run of nothing is just hunting for a card and costs you nothing
   but the card - the monster only answers a strike. */
async function turnStock(){
  if(busy || R.si >= R.stock.length) return;
  busy = true;
  if(R.run){
    await doStrike();
    if(S.fight.hp <= 0){ await won(); return; }
    if(S.hp <= 0){ await lost(); return; }
  }
  R.waste.push(R.stock[R.si++]);
  cardSnap();
  render();
  coachDone('stock');
  busy = false;
  afterMove();
  coachMaybe();
}

/* Is anything left to do? Either there is a legal card, or there is stock to
   turn. Neither means the round is over with peaks still standing, which is
   the losing end of it. */
const anyLegal = () => isPeaks() ? R.tableau.some((c, i) => canPlay(i)) : klondikeLegal().length > 0;
const cleared  = () => isPeaks() ? R.tableau.every(c => c.gone) : klondikeCleared();
const outOfRoad = () => isPeaks() ? (!anyLegal() && R.si >= R.stock.length) : klondikeStuck();

function afterMove(){
  if(cleared()){ guard(onClear()); return; }
  if(outOfRoad()) guard(onDry());
}

/* The finisher. The run it ended on lands first - unanswered, because clearing
   the board is already the answer - and then the clear itself, which is the
   biggest single blow in the game and is meant to end most fights it happens
   in. */
async function onClear(){
  busy = true;
  if(R.run) await doStrike({ answer:false });
  if(S.fight.hp <= 0) return won();

  const el = $('peaks');
  if(el && !reduced()){
    const r = el.getBoundingClientRect();
    for(let k = 0; k < 3; k++){
      const c = peakCenter(k);
      setTimeout(() => goldBurst(c.x, c.y, 180), k * 110);
    }
    goldBurst(r.left + r.width / 2, r.top + r.height / 2, 260);
  }
  if(!S.ranDry) S.cleanRead = true;
  banner('The reading is cut away', 'All three peaks down');
  [0, 1, 2, 3].forEach(k => tone(523 * Math.pow(1.26, k), .2, 'triangle', .07, k * .09));
  await wait(700);
  await bonusBlow(CLEAR_BONUS, 4);
  if(S.fight.hp <= 0) return won();

  await wait(500);
  redeal();
}

/* Running the stock dry with peaks still standing is the punishment. It is
   the one move in the game that costs you health for nothing, and it has to
   be clearly worse than turning a card, or there would be no reason to care
   about the stock running low. */
async function onDry(){
  busy = true;
  S.ranDry = true;               /* so this fight can no longer be a Clean Read */
  /* The stock running out is itself a run breaking, so the run still lands
     before the punishment. Without this, playing your last legal card as the
     eighth of a run threw the whole run away - the one moment in the game
     where a player has earned the most and would be told the least. */
  if(R.run){
    await doStrike({ answer:false });
    if(S.fight.hp <= 0){ await won(); return; }
  }
  banner('Out of cards', 'It gets a free swing');
  deadthud();
  await wait(900);
  await foeTurn(DRY_MULT);
  if(S.hp <= 0) return lost();
  redeal();
}

function redeal(){
  const boss = S.fight && S.fight.boss;
  dailySeedOn();               /* a second board in the same fight is still today's */
  R = dealRound(boss ? S.fight.rule.deal : {});
  dailySeedOff();
  openBoard();
  busy = false;
  coachMaybe();
}

/* Everything that happens to a board before the first tap. Kept in one place
   because a board is dealt from three directions - a new fight, a redeal
   after the stock ran dry, and a cleared board - and a charm that only worked
   from one of them would be a charm that worked by accident. */
function openBoard(){
  /* On Klondike the deal has already placed Reader's Glass, because there the
     card has to come out of a column rather than be marked on top of one. */
  if(!isPeaks()){
    if(hasCharm('cup')) S.block = (S.block || 0) + 20;
    render(); renderPots(); return;
  }
  /* Reader's Glass: one card that would have stayed hidden is turned over.
     On a board with nothing hidden it has nothing to do, and says so rather
     than pretending. */
  if(hasCharm('glass') && R.hidden.length){
    const covered = R.tableau
      .map((c, i) => i)
      .filter(i => !isFaceUp(i) && !R.tableau[i].gone);
    if(covered.length) R.shown = [covered[rndInt(covered.length)]];
  }
  /* Iron Cup: a board opens with guard up */
  if(hasCharm('cup')) S.block = (S.block || 0) + 20;
  render();
  renderPots();
}

$('overlay').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(!b) return;
  const act = b.dataset.act;
  if(act === 'fight'){ closePanel(); busy = false; coachMaybe(); return; }
  if(act === 'onward'){
    /* the world's own words, once the player has played a board and knows
       what they are reading */
    if(!S.openingSeen){ S.openingSeen = true; saveGame(); S.introBeat = 0; return storyPanel('start'); }
    if(S.pendingLv) levelPanel(); else shopPanel();
    return;
  }
  if(act === 'perk'){ takePerk(b.dataset.perk); return; }
  if(act === 'again'){ S.hp = S.maxHp; closePanel(); startFight(); return; }
  if(act === 'shopTab'){ shopPanel(b.dataset.tab); return; }
  if(act === 'leaveShop'){ onwardFromShop(); return; }
  if(act === 'quest'){ nextFight(); return; }
  if(act === 'train'){ S.training = true; nextFight(true); return; }
  if(act === 'storyNext'){ storyNext(b.dataset.key); return; }
  if(act === 'togMusic'){ musicOn = !musicOn; store.set('music', musicOn); updateMusic(); return menuPanel(); }
  if(act === 'togSound'){ soundOn = !soundOn; store.set('sound', soundOn); return menuPanel(); }
  if(act === 'board'){ switchBoard(); return; }
  if(act === 'help'){ return helpPanel(0); }
  if(act === 'helpNext'){ return helpPanel(+b.dataset.page); }
  if(act === 'closeMenu'){ closePanel(); if(!S.fight) startFight(); return; }
  if(act === 'slots'){ return slotsPanel(); }
  if(act === 'cloud'){ return cloudPanel(); }
  if(act === 'cloudSave'){ cloudSave(); return; }
  if(act === 'cloudLoad'){ cloudLoad(); return; }
  if(act === 'cloudCopy'){
    try{ navigator.clipboard.writeText(prettyCode(cloudCode())); toast('Code copied'); }
    catch(e){ toast('Write it down instead'); }
    return;
  }
  if(act === 'brag'){ bragPanel(b.dataset.kind); return; }
  if(act === 'bragShare'){ bragShare(); return; }
  if(act === 'bragSave'){ bragSave(); return; }
  if(act === 'daily'){ return startDaily(); }
  if(act === 'dailyGo'){ closePanel(); S.daily.n = 0; dailyStep(); startFight(); return; }
  if(act === 'postDaily'){ postDaily(b); return; }
  if(act === 'dailyQuit'){ dailyQuit(); return; }
  if(act === 'lb'){ return lbPanel(); }
  if(act === 'postLevel'){ postLevel(); return; }
  if(act === 'newHero' || act === 'loadHero'){
    SLOT = +b.dataset.slot || 1;
    try{ localStorage.setItem('sl_slot', JSON.stringify(SLOT)); }catch(e){}
    const v = act === 'loadHero' ? loadSave(SLOT) : null;
    if(v && v.S){ S = v.S; closePanel(); startFight(); }
    else { S = freshHero(); saveGame(); closePanel(); S.introBeat = 0; R = dealRound(); busy = true; storyPanel('start'); }
    return;
  }
  if(act === 'rest'){
    if(S.gold < REST_PRICE || S.hp >= S.maxHp) return;
    spend(REST_PRICE);
    S.hp = Math.min(S.maxHp, S.hp + Math.round(S.maxHp * REST_SHARE));
    setMyBars(); shopPanel('rest'); return;
  }
  if(act === 'buyEq'){
    const type = b.dataset.type, tier = +b.dataset.tier, price = EQUIP[type].price[tier];
    if(S.gold < price) return;
    spend(price);
    S.eq[b.dataset.slot] = { type, tier };
    /* a two-handed weapon has no room for a second one */
    if(type === 'axe') delete S.eq.off;
    setMyBars(); shopPanel('smith'); return;
  }
  if(act === 'buyCharm'){
    const c = CH[b.dataset.charm];
    if(!c || S.gold < c.price || hasCharm(c.id)) return;
    spend(c.price);
    S.charms = (S.charms || []).concat([c.id]);
    shopPanel('charms'); return;
  }
  if(act === 'buyPot'){
    const po = PO[b.dataset.pot];
    if(!po || S.gold < po.price || (S.pots || []).length >= POT_SLOTS) return;
    spend(po.price);
    S.pots = (S.pots || []).concat([po.id]);
    shopPanel('pots'); return;
  }
});

/* the potion row is its own strip, outside the board */
$('app').addEventListener('click', e => {
  const t = e.target.closest('.tool[data-act]');
  if(!t) return;
  if(t.dataset.act === 'menu') menuPanel();
  else if(t.dataset.act === 'help') helpPanel();
});

$('potRow').addEventListener('click', e => {
  const b = e.target.closest('[data-act="drink"]');
  if(b) drink(b.dataset.pot);
});

$('board').addEventListener('click', e => {
  const c = e.target.closest('[data-act="coin"]');
  if(c){ useCoin(); return; }
  if(isPeaks()){
    const t = e.target.closest('[data-act="turn"]');
    if(t){ guard(turnStock()); return; }
    const card = e.target.closest('.pk[data-i]');
    if(card) playCard(+card.dataset.i);
    return;
  }
  /* Klondike: tap the deck to turn a card, tap a card to send it wherever it
     wants to go. No dragging - a drag on a 41px card is a miss waiting to
     happen. */
  const d = e.target.closest('[data-act="draw"]');
  if(d){ guard(klondikeDraw()); return; }
  const w = e.target.closest('[data-from="w"]');
  if(w){ guard(klondikeTap({ col:-1, n:-1, card:wasteTop() })); return; }
  const k = e.target.closest('[data-from="c"]');
  if(k){
    const col = +k.dataset.col, n = +k.dataset.n;
    guard(klondikeTap({ col, n, card:R.cols[col].up[n] }));
  }
});

/* ===================== the first board =====================
   A player who has been here before picks a hero. A new one gets cards, at
   once, with nothing in front of them. */
